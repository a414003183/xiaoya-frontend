          minimum: 0
        progress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: 缺省 0
        color:
          type: [string, 'null']
          description: 颜色（#RRGGBB 或预置色码）
        sort:
          type: [integer, 'null']
          description: 排序值（升序，越小越前）
    CardUpdateRequest:
      type: object
      description: 部分更新卡片（§5 白名单 name/description/priority/assignee/beginDate/endDate/estimateHours/progress/color/status；null=不修改）
      required: [lockVersion]
      properties:
        name:
          type: [string, 'null']
          description: 卡片标题
          maxLength: 255
        description:
          type: [string, 'null']
          description: 描述
        priority:
          type: [integer, 'null']
          description: 优先级
          minimum: 1
          maximum: 4
        assignee:
          type: [string, 'null']
          description: 处理人（登录账号，空=未指派）
        beginDate:
          type: [string, 'null']
          description: 开始日期
          format: date
        endDate:
          type: [string, 'null']
          description: 结束日期
          format: date
        estimateHours:
          type: [number, 'null']
          description: 预估工时
          minimum: 0
        progress:
          type: [integer, 'null']
          description: 进度（0~100）
          minimum: 0
          maximum: 100
        color:
          type: [string, 'null']
          description: 颜色（#RRGGBB 或预置色码）
        status:
          type: [string, 'null']
          enum: [doing, done, null]
