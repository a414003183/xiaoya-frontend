    TeamMemberInput:
      type: object
      description: 成员表全量提交的单行（account 必填；days 超所在项目 days → 42201）
      required: [account]
      properties:
        account: { type: string, description: "登录账号" }
        role:
          type: [string, 'null']
          description: 成员角色
          maxLength: 30
        joinDate:
          type: [string, 'null']
          description: 加入日期
          format: date
        days:
          type: [integer, 'null']
          description: 参与天数
          minimum: 0
        hours:
          type: [number, 'null']
          description: 计划投入（人天）
          minimum: 0
          maximum: 24
        sort:
          type: [integer, 'null']
          description: 排序值（升序，越小越前）
    TeamMemberSubmitRequest:
      type: object
      description: 成员表全量提交（旧 manageMembers 语义：diff 增删改，逐项校验，幂等）
      required: [members]
      properties:
        members:
          type: array
          description: 整体替换的目标成员集合
          items: { $ref: '#/components/schemas/TeamMemberInput' }
    TeamMemberSubmitResultItem:
      type: object
      required: [account, ok]
      properties:
        account: { type: string, description: "登录账号" }
        ok: { type: boolean, description: "是否成功" }
        error:
          type: [string, 'null']
          description: 失败原因（code:message 形态）
    TeamMemberSubmitResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: 逐项结果
