    TestRunList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TestRunView' }
        total: { type: integer, format: int64 }
    ReportView:
      type: object
      required: [id, executionId, title, testRunIds, beginDate, endDate, lockVersion]
      properties:
        id: { type: integer, format: int64 }
        executionId: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        title: { type: string, maxLength: 255 }
        testRunIds:
          type: array
          items: { type: integer, format: int64 }
        beginDate: { type: string, format: date }
        endDate: { type: string, format: date }
        owner:
          type: [string, 'null']
        content:
          type: [string, 'null']
          description: 报告正文（不透明，后端不解析）
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
        lockVersion: { type: integer }
    ReportCreateRequest:
      type: object
      required: [title, beginDate, endDate]
      properties:
        title: { type: string, maxLength: 255 }
        testRunIds:
          type: [array, 'null']
          items: { type: integer, format: int64 }
        beginDate: { type: string, format: date }
        endDate: { type: string, format: date }
        owner:
          type: [string, 'null']
        content:
          type: [string, 'null']
    ReportUpdateRequest:
      type: object
      required: [lockVersion]
      properties:
        title:
          type: [string, 'null']
          maxLength: 255
        testRunIds:
          type: [array, 'null']
          items: { type: integer, format: int64 }
        beginDate:
          type: [string, 'null']
          format: date
        endDate:
          type: [string, 'null']
          format: date
        owner:
          type: [string, 'null']
        content:
          type: [string, 'null']
        lockVersion: { type: integer }
    ReportList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReportView' }
        total: { type: integer, format: int64 }

    # ── doc · 文档库（doc 卡 §3.1/§3.2/§3.3） ──
    DocAclPayload:
      type: object
      description: 文档库/文档白名单载荷（accounts 账号 + groupIds 组，各 ≤50）
      properties:
        accounts:
          type: array
          items: { type: string }
        groupIds:
          type: array
          items: { type: integer, format: int64 }
    DocSpaceView:
      type: object
      description: 文档库视图（doc 卡 §3.1；docCount 为派生只读）
      required: [id, name, type, productId, projectId, executionId, acl, whitelist, docSort, isDefault,
        docCount, sort, createdBy, createdAt, lockVersion]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 60 }
        type:
          type: string
          description: 创建后不可改；mine 库恒 private 且仅创建者可见
          enum: [product, project, execution, custom, mine]
        productId: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        executionId: { type: integer, format: int64 }
        acl:
          type: string
          description: custom 库无 default；mine 库恒 private
          enum: [open, default, private]
        whitelist: { $ref: '#/components/schemas/DocAclPayload' }
        description:
          type: [string, 'null']
        docSort:
          type: string
          enum: [id_asc, id_desc]
        isDefault: { type: boolean }
        docCount:
          type: integer
          description: 派生只读：库内未删文档数
        sort: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
        lockVersion: { type: integer }
    DocSpaceCreateRequest:
      type: object
      description: 创建文档库（doc 卡 §3.1 ✓ 列；mine 重复创建返回既有库）
      required: [name, type]
      properties:
        name: { type: string, maxLength: 60 }
        type:
          type: string
          enum: [product, project, execution, custom, mine]
        productId:
          type: [integer, 'null']
          format: int64
        projectId:
          type: [integer, 'null']
          format: int64
        executionId:
          type: [integer, 'null']
          format: int64
        acl:
          type: [string, 'null']
          enum: [open, default, private, null]
        whitelist:
          $ref: '#/components/schemas/DocAclPayload'
        description:
          type: [string, 'null']
        docSort:
          type: [string, 'null']
          enum: [id_asc, id_desc, null]
        isDefault:
          type: [boolean, 'null']
        sort:
          type: [integer, 'null']
    DocSpaceUpdateRequest:
      type: object
      description: 部分更新库（doc 卡 §5：name/description/acl/whitelist/docSort/isDefault/sort；null = 不修改）
      required: [lockVersion]
      properties:
        name:
          type: [string, 'null']
          maxLength: 60
        description:
          type: [string, 'null']
        acl:
          type: [string, 'null']
          enum: [open, default, private, null]
        whitelist:
          $ref: '#/components/schemas/DocAclPayload'
        docSort:
          type: [string, 'null']
          enum: [id_asc, id_desc, null]
        isDefault:
          type: [boolean, 'null']
        sort:
          type: [integer, 'null']
        lockVersion: { type: integer }
    DocSpaceList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DocSpaceView' }
        total: { type: integer, format: int64 }
    DocView:
      type: object
      description: 文档视图（doc 卡 §3.2；列表响应不携带 content 与 files，仅详情/快照端点返回）
      required: [id, docSpaceId, productId, projectId, executionId, categoryId, parentId, path, title, type,
        status, acl, editors, readers, notifyAccounts, views, version, hasDraft, sort, createdBy, createdAt,
        lockVersion]
      properties:
        id: { type: integer, format: int64 }
        docSpaceId: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        executionId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        parentId: { type: integer, format: int64 }
        path:
          type: string
          description: 物化章节路径（,1,12, 格式），由 parentId 链生成，不直接写入
        title: { type: string, maxLength: 255 }
        keywords:
          type: [string, 'null']
          maxLength: 255
        type:
          type: string
          description: 新建仅 markdown；html 仅迁移存量（编辑保存后转 markdown）
          enum: [markdown, html]
        status:
          type: string
          enum: [draft, published]
        acl:
          type: string
          description: open 时 editors/readers 强制清空
          enum: [open, private]
        editors: { $ref: '#/components/schemas/DocAclPayload' }
        readers: { $ref: '#/components/schemas/DocAclPayload' }
        notifyAccounts:
          type: array
          description: publish 时站内通知的账号（≤50；不受 ACL 放行）
          items: { type: string }
        views: { type: integer }
        version:
          type: integer
          description: 最新发布版本号；0=从未发布
        hasDraft:
          type: boolean
          description: 派生只读：v0 工作副本与最新快照是否有差异
        files:
          type: [array, 'null']
          description: 当前内容快照的附件 id（仅详情/快照端点返回）
          items: { type: integer, format: int64 }
        content:
          type: [string, 'null']
          description: 当前正文（Markdown 源码；仅详情/快照端点返回）
        digest:
          type: [string, 'null']
          maxLength: 255
        sort: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
        lockVersion: { type: integer }
    DocCreateRequest:
      type: object
      description: 创建文档（title 必填；status=published 时 content 必填否则 42201）
      required: [title]
      properties:
        title: { type: string, maxLength: 255 }
        keywords:
          type: [string, 'null']
          maxLength: 255
        categoryId:
          type: [integer, 'null']
          format: int64
        parentId:
          type: [integer, 'null']
          format: int64
        type:
          type: [string, 'null']
          enum: [markdown, html, null]
        status:
          type: [string, 'null']
          enum: [draft, published, null]
        acl:
          type: [string, 'null']
          enum: [open, private, null]
        editors:
          $ref: '#/components/schemas/DocAclPayload'
        readers:
          $ref: '#/components/schemas/DocAclPayload'
        notifyAccounts:
          type: [array, 'null']
          items: { type: string }
        content:
          type: [string, 'null']
        files:
          type: [array, 'null']
          items: { type: integer, format: int64 }
        sort:
          type: [integer, 'null']
    DocUpdateRequest:
      type: object
      description: 基本信息部分更新（不含 content；null = 不修改，清空传空串/空数组）
      required: [lockVersion]
      properties:
        title:
          type: [string, 'null']
          maxLength: 255
        keywords:
          type: [string, 'null']
          maxLength: 255
        categoryId:
          type: [integer, 'null']
          format: int64
        parentId:
          type: [integer, 'null']
          format: int64
        acl:
          type: [string, 'null']
          enum: [open, private, null]
        editors:
          $ref: '#/components/schemas/DocAclPayload'
        readers:
          $ref: '#/components/schemas/DocAclPayload'
        notifyAccounts:
          type: [array, 'null']
          items: { type: string }
        sort:
          type: [integer, 'null']
        lockVersion: { type: integer }
    DocSaveDraftRequest:
      type: object
      description: 存草稿（覆盖写 v0 工作副本）
      required: [content]
      properties:
        title:
          type: [string, 'null']
          maxLength: 255
        content: { type: string }
        files:
          type: [array, 'null']
          items: { type: integer, format: int64 }
    DocMoveRequest:
      type: object
      description: 移动文档（目标库/目录/父章节；成环 → 42201）
      required: [docSpaceId]
      properties:
        docSpaceId: { type: integer, format: int64 }
        categoryId:
          type: [integer, 'null']
          format: int64
        parentId:
          type: [integer, 'null']
          format: int64
    DocList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DocView' }
        total: { type: integer, format: int64 }
    DocVersionView:
      type: object
      description: 正文快照（doc 卡 §3.3；version=0 为草稿工作副本，≥1 为不可变发布快照）
      required: [id, docId, version, title, digest, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        docId: { type: integer, format: int64 }
        version: { type: integer, minimum: 0 }
        title: { type: string, maxLength: 255 }
        content:
          type: [string, 'null']
          description: Markdown 源码
        digest: { type: string, maxLength: 255 }
        files:
          type: array
          items: { type: integer, format: int64 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
    DocVersionList:
      type: object
      description: 版本列表（v≥1 快照，固定 version desc，不分页）
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DocVersionView' }
        total: { type: integer, format: int64 }
    DocCategoryView:
      type: object
      description: 库内目录节点（doc 卡 §2 doc_category；真实删除）
      required: [id, docSpaceId, parentId, name, sort]
      properties:
        id: { type: integer, format: int64 }
        docSpaceId: { type: integer, format: int64 }
        parentId: { type: integer, format: int64 }
        name: { type: string, maxLength: 60 }
        sort: { type: integer }
    DocCategoryNode:
      type: object
      description: 目录树节点（嵌套 children）
      required: [id, docSpaceId, parentId, name, sort, children]
      properties:
        id: { type: integer, format: int64 }
        docSpaceId: { type: integer, format: int64 }
        parentId: { type: integer, format: int64 }
        name: { type: string, maxLength: 60 }
        sort: { type: integer }
        children:
          type: array
          items: { $ref: '#/components/schemas/DocCategoryNode' }
    DocCategoryTree:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DocCategoryNode' }
    DocCategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
        parentId:
          type: [integer, 'null']
          format: int64
        sort:
          type: [integer, 'null']
    DocCategoryUpdateRequest:
      type: object
      description: 目录改名/移动/排序（null = 不修改）
      properties:
        name:
          type: [string, 'null']
          maxLength: 60
        parentId:
          type: [integer, 'null']
          format: int64
        sort:
          type: [integer, 'null']

    # ── workspace · 待办（workspace 卡 §3.1） ──
    TodoView:
      type: object
      description: 待办视图（workspace 卡 §3.1 + 现算 objectTitle；旧库 name 列 → title）
      required: [id, title, type, objectId, date, priority, status, isPrivate, assignee, createdBy, createdAt,
        lockVersion]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, maxLength: 150 }
        type:
          type: string
          enum: [custom, bug, task, story, epic, requirement, testRun]
        objectId: { type: integer, format: int64 }
        objectTitle:
          type: [string, 'null']
          description: 现算只读：type≠custom 时关联对象标题，对象已删 → null（不回写 title）
        date:
          type: [string, 'null']
          format: date
          description: 待定日期为 null
        beginTime:
          type: [string, 'null']
          description: HH:mm（DB char(4) 存 HHmm）
        endTime:
          type: [string, 'null']
        priority: { type: integer }
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [wait, doing, done, closed]
        isPrivate: { type: boolean }
        assignee: { type: string }
        assignedBy:
          type: [string, 'null']
        assignedAt:
          type: [string, 'null']
          format: date-time
        finishedBy:
          type: [string, 'null']
        finishedAt:
          type: [string, 'null']
          format: date-time
        closedBy:
          type: [string, 'null']
        closedAt:
          type: [string, 'null']
          format: date-time
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
        lockVersion: { type: integer }
    TodoCreateRequest:
      type: object
      description: 创建待办（assignee 缺省当前账号；type≠custom 时 objectId 必填）
      required: [title]
      properties:
        title: { type: string, maxLength: 150 }
        type:
          type: [string, 'null']
          enum: [custom, bug, task, story, epic, requirement, testRun, null]
        objectId:
          type: [integer, 'null']
          format: int64
        date:
          type: [string, 'null']
          format: date
        beginTime:
          type: [string, 'null']
          pattern: '^\d{2}:\d{2}$'
        endTime:
          type: [string, 'null']
          pattern: '^\d{2}:\d{2}$'
        priority:
          type: [integer, 'null']
          minimum: 1
          maximum: 4
        description:
          type: [string, 'null']
        isPrivate:
          type: [boolean, 'null']
        assignee:
          type: [string, 'null']
    TodoUpdateRequest:
      type: object
      description: 部分更新待办（null = 不修改）
      required: [lockVersion]
      properties:
        title:
          type: [string, 'null']
          maxLength: 150
        type:
          type: [string, 'null']
          enum: [custom, bug, task, story, epic, requirement, testRun, null]
        objectId:
          type: [integer, 'null']
          format: int64
        date:
          type: [string, 'null']
          format: date
        beginTime:
          type: [string, 'null']
          pattern: '^\d{2}:\d{2}$'
        endTime:
          type: [string, 'null']
          pattern: '^\d{2}:\d{2}$'
        priority:
          type: [integer, 'null']
          minimum: 1
          maximum: 4
        description:
          type: [string, 'null']
        isPrivate:
          type: [boolean, 'null']
        lockVersion: { type: integer }
    TodoAssignRequest:
      type: object
      description: 指派待办（assignee 非本人，否则 42203）
      required: [assignee]
      properties:
        assignee: { type: string }
        comment:
          type: [string, 'null']
    TodoBatchRequest:
      type: object
      description: 批量创建（items ≤50）或批量动作（ids+action+params）；两种形态二选一
      properties:
        items:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/TodoCreateRequest' }
        ids:
          type: [array, 'null']
          items: { type: integer, format: int64 }
        action:
          type: [string, 'null']
          description: start|finish|activate|close|assign
        params:
          type: [object, 'null']
          additionalProperties: true
    TodoBatchResultItem:
      type: object
      required: [ok]
      properties:
        index:
          type: [integer, 'null']
          description: 批量创建项下标（动作项为 null）
        id:
          type: [integer, 'null']
          format: int64
          description: 批量动作项 id（创建项成功后为新建 id）
        ok: { type: boolean }
        error:
          type: [string, 'null']
    TodoBatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/TodoBatchResultItem' }
    TodoList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TodoView' }
        total: { type: integer, format: int64 }

    # ── workspace · 我的地盘 / 周报 / 报表（workspace 卡 §3.2–§3.4、§5） ──
    MySummaryView:
      type: object
      description: 地盘首页计数（固定 role=assignee 口径）
      required: [todoCount, taskCount, bugCount, storyCount]
      properties:
        todoCount:
          type: integer
          description: 待办 status ∈ wait,doing
        taskCount:
          type: integer
          description: 任务 status ∉ done,closed,cancel
        bugCount:
          type: integer
          description: Bug status=active
        storyCount:
          type: integer
          description: 需求 status ∉ closed,draft
    TaskSummaryView:
      type: object
      description: 任务摘要行（task 卡 §5；周报三表用，经 TaskApi 只读取数）
      required: [id, title, status, priority, estimateHours, consumedHours, leftHours]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        status: { type: string }
        priority: { type: integer }
        assignee:
          type: [string, 'null']
        estimateHours: { type: number }
        consumedHours: { type: number }
        leftHours: { type: number }
        beginDate:
          type: [string, 'null']
          format: date
        endDate:
          type: [string, 'null']
          format: date
    WeeklyReportView:
      type: object
      description: 周报视图（workspace 卡 §3.2；weekSN/weekEnd/analysis/三表为读取时现算）
      required: [id, projectId, weekStart, weekSN, weekEnd, pv, ev, ac, sv, cv, staff, workload, analysis,
        finished, postponed, nextWeek, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        weekStart: { type: string, format: date }
        weekSN:
          type: integer
          description: 第几周，由项目 beginDate 起算
        weekEnd: { type: string, format: date }
        pv: { type: number }
        ev: { type: number }
        ac: { type: number }
        sv: { type: number }
        cv: { type: number }
        staff: { type: integer }
        workload:
          type: object
          description: 本周按任务类型分组的预计工时 map
          additionalProperties: { type: number }
        analysis:
          type: string
          description: 按 sv/cv 阈值现算的纯文本结论，\n 分隔（前端禁 HTML 注入）
        finished:
          type: array
          items: { $ref: '#/components/schemas/TaskSummaryView' }
        postponed:
          type: array
          items: { $ref: '#/components/schemas/TaskSummaryView' }
        nextWeek:
          type: array
          items: { $ref: '#/components/schemas/TaskSummaryView' }
        updatedAt: { type: string, format: date-time }
    WeeklyReportList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WeeklyReportView' }
        total: { type: integer, format: int64 }
    StoryCountByStatus:
      type: object
      required: [status, count]
      properties:
        status: { type: string }
        count: { type: integer }
    StoryCountByPriority:
      type: object
      required: [priority, count]
      properties:
        priority: { type: integer }
        count: { type: integer }
    StoryCountByStage:
      type: object
      required: [stage, count]
      properties:
        stage: { type: string }
        count: { type: integer }
    StoryCountByType:
      type: object
      required: [type, count]
      properties:
        type: { type: string }
        count: { type: integer }
    StorySummaryReport:
      type: object
      description: 产品需求统计（排除 deletedAt 非空）
      required: [total, byStatus, byPriority, byStage, byType]
      properties:
        total: { type: integer }
        byStatus:
          type: array
          items: { $ref: '#/components/schemas/StoryCountByStatus' }
        byPriority:
          type: array
          items: { $ref: '#/components/schemas/StoryCountByPriority' }
        byStage:
          type: array
          items: { $ref: '#/components/schemas/StoryCountByStage' }
        byType:
          type: array
          items: { $ref: '#/components/schemas/StoryCountByType' }
    BugCountBySeverity:
      type: object
      required: [severity, count]
      properties:
        severity: { type: integer }
        count: { type: integer }
    BugCountByStatus:
      type: object
      required: [status, count]
      properties:
        status: { type: string }
        count: { type: integer }
    BugCountByResolution:
      type: object
      required: [resolution, count]
      properties:
        resolution: { type: string }
        count: { type: integer }
    BugDistributionReport:
      type: object
      description: Bug 分布（resolution 为空计入 unresolved 桶）
      required: [total, bySeverity, byStatus, byResolution]
      properties:
        total: { type: integer }
        bySeverity:
          type: array
          items: { $ref: '#/components/schemas/BugCountBySeverity' }
        byStatus:
          type: array
          items: { $ref: '#/components/schemas/BugCountByStatus' }
        byResolution:
          type: array
          items: { $ref: '#/components/schemas/BugCountByResolution' }
    BurnReport:
      type: object
      description: 燃尽报表（ideal 直线 + remaining 执行级日行，缺失日沿用上值）
      required: [beginDate, endDate, dates, ideal, remaining]
      properties:
        beginDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dates:
          type: array
          items: { type: string, format: date }
        ideal:
          type: array
          items: { type: number }
        remaining:
          type: array
          items: { type: number }
    CasePassRateReport:
      type: object
      description: 用例通过率（passRate 分母 total−na 为 0 时 null）
      required: [total, passed, failed, blocked, na, passRate]
      properties:
        total: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        blocked: { type: integer }
        na: { type: integer }
        passRate:
          type: [number, 'null']

    # ── org · 人员管理（org 卡 §5 Personnel 节） ──
    PersonnelMemberView:
      type: object
      description: 成员视图（无表只读聚合：账号列 + 跨域在办计数；停用/软删账号不出现）
      required: [account, realName, openTaskCount, unresolvedBugCount]
      properties:
        account: { type: string }
        realName: { type: string }
        departmentId:
          type: [integer, 'null']
          format: int64
        role:
          description: 账号角色码（GET /roles 的 code）；未设置为 null
          type: [string, 'null']
          maxLength: 16
        openTaskCount:
          type: integer
          description: 在办任务数（assignee 且 status ∉ done,closed,cancel）
        unresolvedBugCount:
          type: integer
          description: 未解决 Bug 数（status=active 且 assignee=本人）
    PersonnelMemberList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PersonnelMemberView' }
        total: { type: integer, format: int64 }
    PersonnelWorkloadView:
      type: object
      description: 工作量行（effort.workDate ∈ filters[date] 区间按 assignee 聚合）
      required: [account, realName, consumedHours, finishedTaskCount]
      properties:
        account: { type: string }
        realName: { type: string }
        departmentId:
          type: [integer, 'null']
          format: int64
        consumedHours: { type: number }
        finishedTaskCount:
          type: integer
          description: 区间内完成的任务数（finishedAt ∈ 区间）
    PersonnelWorkloadList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PersonnelWorkloadView' }
        total: { type: integer, format: int64 }
