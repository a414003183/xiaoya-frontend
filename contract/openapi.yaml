        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        branchId: { type: integer, format: int64 }
        parentId: { type: integer, format: int64 }
        title: { type: string, maxLength: 90 }
        status: { type: string, enum: [wait, doing, done, closed] }
        description:
          type: [string, 'null']
        beginDate:
          type: [string, 'null']
          format: date
        endDate:
          type: [string, 'null']
          format: date
        finishedAt:
          type: [string, 'null']
          format: date-time
        closedAt:
          type: [string, 'null']
          format: date-time
        closedReason:
          type: [string, 'null']
        customFields:
          type: object
          additionalProperties: true
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
        lockVersion: { type: integer }
    PlanCreateRequest:
      type: object
      required: [title]
      properties:
        branchId:
          type: [integer, 'null']
          format: int64
        parentId:
          type: [integer, 'null']
          format: int64
        title: { type: string, maxLength: 90 }
        beginDate:
          type: [string, 'null']
          format: date
        endDate:
          type: [string, 'null']
          format: date
        description:
          type: [string, 'null']
        customFields:
          type: [object, 'null']
          additionalProperties: true
    PlanUpdateRequest:
      type: object
      required: [lockVersion]
      properties:
        title:
          type: [string, 'null']
          maxLength: 90
        branchId:
          type: [integer, 'null']
          format: int64
        parentId:
          type: [integer, 'null']
          format: int64
        beginDate:
          type: [string, 'null']
          format: date
        endDate:
          type: [string, 'null']
          format: date
        description:
          type: [string, 'null']
        customFields:
          type: [object, 'null']
