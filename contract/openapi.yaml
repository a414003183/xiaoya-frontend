        type:
          type: [string, 'null']
          description: 类型
          enum: [markdown, html, null]
        status:
          type: [string, 'null']
          description: 状态
          enum: [draft, published, null]
        acl:
          type: [string, 'null']
          description: 访问控制（可见范围策略）
          enum: [open, private, null]
        editors:
