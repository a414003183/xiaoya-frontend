          description: 团队内角色（自由文本）
        joinDate: { type: string, format: date, description: 缺省当天 }
        days: { type: integer, minimum: 0, description: ≤所在项目 days }
        hours: { type: number, minimum: 0, maximum: 24, description: 每日可用工时，≤1 位小数 }
