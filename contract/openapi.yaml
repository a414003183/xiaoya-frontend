    # ── doc · 文档库（doc 卡 §3.1/§3.2/§3.3） ──
    DocAclPayload:
      type: object
      description: 文档库/文档白名单载荷（accounts 账号 + groupIds 组，各 ≤50；组 id 现在就是角色 id）
      required: []
      properties:
        accounts:
          type: array
          description: 账号白名单（登录名集合）
          items: { type: string }
        groupIds:
          type: array
          description: 用户组 id 集合
          items: { type: integer, format: int64 }
    DocSpaceView:
      type: object
      description: 文档库视图（doc 卡 §3.1；docCount 为派生只读）
      required: [id, name, type, productId, projectId, executionId, acl, whitelist, docSort, isDefault,
        docCount, sort, createdBy, createdAt, lockVersion]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        name: { type: string, maxLength: 60, description: "库名称" }
        type:
          type: string
          description: 创建后不可改；mine 库恒 private 且仅创建者可见
          enum: [product, project, execution, custom, mine]
        productId: { type: integer, format: int64, description: "产品 id" }
        projectId: { type: integer, format: int64, description: "项目 id" }
        executionId: { type: integer, format: int64, description: "执行 id" }
        acl:
          type: string
          description: custom 库无 default；mine 库恒 private
          enum: [open, default, private]
        whitelist: { $ref: '#/components/schemas/DocAclPayload', description: "白名单（自定义可见集）" }
        description:
          type: [string, 'null']
          description: 描述
        docSort:
          type: string
          description: 库内默认排序
          enum: [id_asc, id_desc]
        isDefault: { type: boolean, description: "是否默认" }
        docCount:
          type: integer
          description: 派生只读：库内未删文档数
        sort: { type: integer, description: "排序值（升序，越小越前）" }
        createdBy: { type: string, description: "创建人（登录账号）" }
        createdAt: { type: string, format: date-time, description: "创建时间" }
        updatedBy:
          type: [string, 'null']
          description: 更新人（登录账号）
        updatedAt:
          type: [string, 'null']
          description: 更新时间
          format: date-time
        lockVersion: { type: integer, description: "乐观锁版本号（更新须回传，不符 → 40901）" }
    DocSpaceCreateRequest:
      type: object
      description: 创建文档库（doc 卡 §3.1 ✓ 列；mine 重复创建返回既有库）
      required: [name, type]
      properties:
        name: { type: string, maxLength: 60, description: "库名称" }
        type:
          type: string
          description: 类型
          enum: [product, project, execution, custom, mine]
        productId:
          type: [integer, 'null']
          description: 产品 id
          format: int64
        projectId:
          type: [integer, 'null']
          description: 项目 id
          format: int64
        executionId:
          type: [integer, 'null']
          description: 执行 id
          format: int64
        acl:
          type: [string, 'null']
          description: 访问控制（可见范围策略）
          enum: [open, default, private, null]
        whitelist:
          $ref: '#/components/schemas/DocAclPayload'
          description: 白名单（自定义可见集）
        description:
          type: [string, 'null']
          description: 描述
        docSort:
          type: [string, 'null']
          description: 库内默认排序
          enum: [id_asc, id_desc, null]
        isDefault:
          type: [boolean, 'null']
          description: 是否默认
        sort:
          type: [integer, 'null']
          description: 排序值（升序，越小越前）
    DocSpaceUpdateRequest:
      type: object
      description: 部分更新库（doc 卡 §5：name/description/acl/whitelist/docSort/isDefault/sort；null = 不修改）
      required: [lockVersion]
      properties:
        name:
          type: [string, 'null']
          description: 库名称
          maxLength: 60
        description:
          type: [string, 'null']
          description: 描述
        acl:
          type: [string, 'null']
          description: 访问控制（可见范围策略）
          enum: [open, default, private, null]
        whitelist:
          $ref: '#/components/schemas/DocAclPayload'
          description: 白名单（自定义可见集）
        docSort:
          type: [string, 'null']
          description: 库内默认排序
          enum: [id_asc, id_desc, null]
        isDefault:
          type: [boolean, 'null']
          description: 是否默认
        sort:
          type: [integer, 'null']
          description: 排序值（升序，越小越前）
        lockVersion: { type: integer, description: "乐观锁版本号（更新须回传，不符 → 40901）" }
    DocSpaceList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/DocSpaceView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }
    DocView:
      type: object
      description: 文档视图（doc 卡 §3.2；列表响应不携带 content 与 files，仅详情/快照端点返回）
      required: [id, docSpaceId, productId, projectId, executionId, categoryId, parentId, path, title, type,
        status, acl, editors, readers, notifyAccounts, views, version, hasDraft, sort, createdBy, createdAt,
        lockVersion]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        docSpaceId: { type: integer, format: int64, description: "文档库 id" }
        productId: { type: integer, format: int64, description: "产品 id" }
        projectId: { type: integer, format: int64, description: "项目 id" }
        executionId: { type: integer, format: int64, description: "执行 id" }
        categoryId: { type: integer, format: int64, description: "分类 id" }
        parentId: { type: integer, format: int64, description: "父节点 id（0 或空=顶级）" }
        path:
          type: string
          description: 物化章节路径（,1,12, 格式），由 parentId 链生成，不直接写入
        title: { type: string, maxLength: 255, description: "文档标题" }
        keywords:
          type: [string, 'null']
          description: 关键词
          maxLength: 255
        type:
          type: string
          description: 新建仅 markdown；html 仅迁移存量（编辑保存后转 markdown）
          enum: [markdown, html]
        status:
          type: string
          description: 状态
          enum: [draft, published]
        acl:
          type: string
          description: open 时 editors/readers 强制清空
          enum: [open, private]
        editors: { $ref: '#/components/schemas/DocAclPayload', description: "可编辑白名单（账号与用户组）" }
        readers: { $ref: '#/components/schemas/DocAclPayload', description: "只读白名单（账号与用户组）" }
        notifyAccounts:
          type: array
          description: publish 时站内通知的账号（≤50；不受 ACL 放行）
          items: { type: string }
        views: { type: integer, description: "浏览次数（status=published 时读取 +1）" }
        version:
          type: integer
          description: 最新发布版本号；0=从未发布
        hasDraft:
          type: boolean
          description: 派生只读：v0 工作副本与最新快照是否有差异
        files:
          type: [array, 'null']
          description: 当前内容快照的附件 id（仅详情/快照端点返回）
          items: { type: integer, format: int64 }
        content:
          type: [string, 'null']
          description: 当前正文（Markdown 源码；仅详情/快照端点返回）
        digest:
          type: [string, 'null']
          description: 摘要（内容截断）
          maxLength: 255
        sort: { type: integer, description: "排序值（升序，越小越前）" }
        createdBy: { type: string, description: "创建人（登录账号）" }
        createdAt: { type: string, format: date-time, description: "创建时间" }
        updatedBy:
          type: [string, 'null']
          description: 更新人（登录账号）
        updatedAt:
          type: [string, 'null']
          description: 更新时间
          format: date-time
        lockVersion: { type: integer, description: "乐观锁版本号（更新须回传，不符 → 40901）" }
    DocCreateRequest:
      type: object
      description: 创建文档（title 必填；status=published 时 content 必填否则 42201）
