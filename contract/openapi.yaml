  # ═════════════════════ task · P3 新增 schema（task 卡 §3/§3b）═════════════════════
    # ── task · 任务（task 卡 §3） ──
    TaskChildSummary:
      type: object
      description: 子任务摘要（父任务详情的 children 数组元素，task 卡 §3）
      required: [id, title, status]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, maxLength: 255 }
        status: { type: string, enum: [wait, doing, done, pause, cancel, closed] }
        assignee:
          type: [string, 'null']
    TaskView:
      type: object
      description: 任务视图（task 卡 §3 读侧；children/storyTitle 为联表只读字段，不接受写入）
      required: [id, executionId, projectId, storyId, parentId, categoryId, title, type, priority, status, consumedHours, isParent, notifyAccounts, createdBy, createdAt, lockVersion]
      properties:
        id: { type: integer, format: int64 }
        executionId:
          type: integer
          format: int64
          description: 所属执行，创建后不可改
        projectId:
          type: integer
          format: int64
          description: 冗余列，创建时由执行带出，不可改
        storyId:
          type: integer
          format: int64
          description: 关联需求；0=无（filterable）
        parentId:
          type: integer
          format: int64
          description: 父任务；0=顶层（filterable；父子仅一层）
        categoryId:
          type: integer
          format: int64
          description: 执行下 type=task 的分类节点；0=无（filterable）
        title: { type: string, maxLength: 255 }
        type: { type: string, enum: [design, devel, request, test, study, discuss, ui, affair, misc] }
        priority: { type: integer, minimum: 1, maximum: 4 }
        status: { type: string, enum: [wait, doing, done, pause, cancel, closed] }
        estimateHours:
          type: [number, 'null']
          description: 预计工时（≥0，≤999.99）
        consumedHours:
          type: number
          description: 已消耗（≥0；只读，由动作/工时回写，不开放直改）
        leftHours:
          type: [number, 'null']
          description: 剩余工时（≥0，≤999.99；start 初始化、effort 覆写）
        estStartedDate:
          type: [string, 'null']
          format: date
        deadline:
          type: [string, 'null']
          format: date
        assignee:
          type: [string, 'null']
        assignedAt:
          type: [string, 'null']
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
          description: start/finish 回写
        activatedAt:
          type: [string, 'null']
          format: date-time
        finishedBy:
          type: [string, 'null']
        finishedAt:
          type: [string, 'null']
          format: date-time
        canceledBy:
          type: [string, 'null']
        canceledAt:
          type: [string, 'null']
          format: date-time
        closedBy:
          type: [string, 'null']
        closedAt:
          type: [string, 'null']
          format: date-time
        closedReason:
          type: [string, 'null']
          enum: [done, cancel, null]
        keywords:
          type: [string, 'null']
          maxLength: 255
        description:
          type: [string, 'null']
        isParent:
          type: boolean
          description: 有未删子任务即 true（系统维护，不开放写）
        notifyAccounts:
          type: array
          items: { type: string }
        customFields:
          type: object
          additionalProperties: true
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
        lockVersion:
          type: integer
          description: 写路径 If-Match 语义（动作端点不校验）
        children:
          type: [array, 'null']
          description: 子任务摘要数组（仅详情响应出现；列表为 null）
          items: { $ref: '#/components/schemas/TaskChildSummary' }
        storyTitle:
          type: [string, 'null']
          description: 关联需求标题（仅响应出现，storyId≠0 时；不接受写入）
    TaskCreateRequest:
      type: object
      description: 创建任务（task 卡 §3；executionId 取自路径、projectId 由执行带出，均不在请求体；创建时 status 恒 wait、consumedHours 恒 0，leftHours start 时初始化）
      required: [title]
      properties:
        storyId:
          type: [integer, 'null']
          format: int64
          description: 该执行已关联的需求（0=无）
        parentId:
          type: [integer, 'null']
          format: int64
          description: 同执行任务（带值即创建子任务；0/缺省=顶层）
        parentIndex:
          type: [integer, 'null']
          description: 仅批量创建（items 内下标，0 起）：引用同行父行；父行失败则本行连带 error
        categoryId:
          type: [integer, 'null']
          format: int64
          description: 执行下 type=task 的分类节点（0=无）
        title: { type: string, maxLength: 255 }
        type:
          type: [string, 'null']
          description: 缺省 devel
          enum: [design, devel, request, test, study, discuss, ui, affair, misc, null]
        priority:
          type: [integer, 'null']
          description: 1–4，缺省 3
        estimateHours:
          type: [number, 'null']
          description: ≥0，≤999.99
        estStartedDate:
          type: [string, 'null']
          format: date
        deadline:
          type: [string, 'null']
          format: date
        assignee:
          type: [string, 'null']
          description: 指派账号（存在账号）
        keywords:
          type: [string, 'null']
          maxLength: 255
        description:
          type: [string, 'null']
        notifyAccounts:
          type: [array, 'null']
          items: { type: string }
    TaskUpdateRequest:
      type: object
      description: 部分更新任务（PATCH 白名单；键缺失=不修改；storyId/categoryId 传 0 清空；estStartedDate/deadline/keywords/description 传空串或显式 null 清空；estimateHours 传 0 清零）
      required: [lockVersion]
      properties:
        title:
          type: [string, 'null']
          maxLength: 255
        type:
          type: [string, 'null']
          enum: [design, devel, request, test, study, discuss, ui, affair, misc, null]
        priority:
          type: [integer, 'null']
          description: 1–4
        categoryId:
          type: [integer, 'null']
          format: int64
        storyId:
          type: [integer, 'null']
          format: int64
        estimateHours:
          type: [number, 'null']
          description: ≥0，≤999.99；传 0 清零
        estStartedDate:
          type: [string, 'null']
          format: date
        deadline:
          type: [string, 'null']
          format: date
        keywords:
          type: [string, 'null']
          maxLength: 255
        description:
          type: [string, 'null']
        notifyAccounts:
          type: [array, 'null']
          items: { type: string }
        lockVersion:
          type: integer
          description: 乐观锁版本（不符 → 40901）
    TaskList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskView' }
        total: { type: integer, format: int64 }

    # ── task · 动作请求体（task 卡 §4/§5） ──
    TaskStartRequest:
      type: object
      description: 开始任务（均可省；consumedHours>0 时同步落一条 effort）
      properties:
        assignee:
          type: [string, 'null']
          description: 传入即改派
        consumedHours:
          type: [number, 'null']
          description: 本次消耗（>0 落 effort）
        leftHours:
          type: [number, 'null']
          description: 缺省初始化为 estimateHours−consumedHours
        comment:
          type: [string, 'null']
    TaskFinishRequest:
      type: object
      description: 完成任务（本次消耗按增量累计；consumedHours>0 自动落一条 effort，work 缺省取 comment）
      properties:
        consumedHours:
          type: [number, 'null']
          description: 本次消耗（>0 落 effort；与累计均为 0 → 42203）
        leftHours:
          type: [number, 'null']
          description: 缺省清零
        startedAt:
          type: [string, 'null']
          format: date-time
          description: 须 ≤ finishedAt（违反 → 42201）
        finishedAt:
          type: [string, 'null']
          format: date-time
        work:
          type: [string, 'null']
          description: 自动落 effort 的内容
        comment:
          type: [string, 'null']
    TaskCloseRequest:
      type: object
      description: 关闭任务（done/cancel 来源缺省回填 closedReason；父任务从任意非 closed 关闭时 closedReason 必填）
      properties:
        closedReason:
          type: [string, 'null']
          enum: [done, cancel, null]
        comment:
          type: [string, 'null']
    TaskActivateRequest:
      type: object
      description: 激活任务（leftHours 必填且 >0，缺失/≤0 → 42201；可改派 assignee）
      required: [leftHours]
      properties:
        leftHours:
          type: number
          description: 必填且 >0
        assignee:
          type: [string, 'null']
          description: 传入即改派
        comment:
          type: [string, 'null']
    TaskAssignRequest:
      type: object
      description: 指派任务（assignee 必填且为存在账号，否则 42201；可覆写 leftHours）
      required: [assignee]
      properties:
        assignee:
          type: string
          description: 目标账号（存在校验）
        leftHours:
          type: [number, 'null']
          description: 传入则覆写任务剩余
        comment:
          type: [string, 'null']

    # ── task · 批量（task 卡 §3/§5） ──
    TaskBatchCreateRequest:
      type: object
      description: 批量创建任务（≤50 条，逐条校验部分成功；子任务用 parentIndex 引用 items 中同行父行——0 起下标、父行失败则子行连带 error，或用 parentId 引用已存在任务）
      required: [items]
      properties:
        items:
          type: array
          description: ≤50 条；子任务随父一并提交
          maxItems: 50
          items: { $ref: '#/components/schemas/TaskCreateRequest' }
    TaskBatchCreateResult:
      type: object
      description: 批量创建逐项结果
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/BatchCreateResultItem' }

    # ── task · 工时（task 卡 §3b） ──
    EffortView:
      type: object
      description: 工时流水视图（task 卡 §3b；account 恒等于 createdBy，工时不设 lockVersion，流水按 id 定位）
      required: [id, taskId, executionId, projectId, account, workDate, consumedHours, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        taskId:
          type: integer
          format: int64
          description: 强关联任务（仅挂任务）
        executionId:
          type: integer
          format: int64
          description: 冗余列，创建时由任务带出
        projectId:
          type: integer
          format: int64
          description: 冗余列，创建时由任务带出
        account:
          type: string
          description: 登记账号（恒为当前账号/createdBy，不接受传入）
        workDate:
          type: string
          format: date
          description: 登记粒度=天，≤今天
        consumedHours:
          type: number
          description: 本次消耗（>0，≤999.99），增量累计进任务
        leftHours:
          type: [number, 'null']
          description: 覆写任务剩余；null=不覆写
        work:
          type: [string, 'null']
          maxLength: 255
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: 软删标记
    EffortCreateRequest:
      type: object
      description: 登记工时（account 恒当前账号，不接受代登记；executionId/projectId 由任务带出）
      required: [consumedHours]
      properties:
        workDate:
          type: [string, 'null']
          format: date
          description: ≤今天；缺省取当天
        consumedHours:
          type: number
          exclusiveMinimum: 0
          maximum: 999.99
          description: 本次消耗，>0
        leftHours:
          type: [number, 'null']
          minimum: 0
          maximum: 999.99
          description: 传值则覆写任务剩余；null/缺省不改动；传 0 触发任务自动完成
        work:
          type: [string, 'null']
          maxLength: 255
    EffortUpdateRequest:
      type: object
      description: 编辑工时（仅 workDate/consumedHours/leftHours/work 可改；taskId/account 不可改；回算任务 consumedHours 与 leftHours，状态不回退）
      properties:
        workDate:
          type: [string, 'null']
          format: date
          description: ≤今天
        consumedHours:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 999.99
        leftHours:
          type: [number, 'null']
          minimum: 0
          maximum: 999.99
        work:
          type: [string, 'null']
          maxLength: 255
    EffortList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EffortView' }
        total: { type: integer, format: int64 }

