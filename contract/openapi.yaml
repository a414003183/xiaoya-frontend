  # ═════════════════════ task · 任务与工时（task 卡 §5，P3 · C2）═════════════════════
  # ───────────────────────── task · 执行任务（task 卡 §5） ─────────────────────────
  /executions/{executionId}/tasks:
    get:
      operationId: listExecutionTasks
      summary: 执行任务列表（DataScope 注入可见执行；树状按 parentId 由前端装配）
      description: |
        数据权限：执行 ACL 决定可见性（project 域 ExecutionApi.visibleExecutionIds，DataScope 注入 execution_id IN 可见集）；
        不可见执行 → 40302，执行不存在 → 40401，超管不受限。权限码 task-view。
        取数：filters[parentId]=@null 取顶层、=id 取该任务的子任务；树状展示由前端按 parentId 装配，可配 limit≤200 全量拉取。
      tags: [task]
      parameters:
        - name: executionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序，白名单 id/priority/status/deadline/estimateHours/consumedHours/leftHours/createdAt，- 前缀降序；默认 -id
          schema: { type: string }
        - name: filters[status]
          in: query
          description: 状态等值/IN（wait|doing|done|pause|cancel|closed）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[type]
          in: query
          description: 类型等值/IN（design|devel|request|test|study|discuss|ui|affair|misc）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[priority]
          in: query
          description: 优先级等值/IN（1–4）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[assignee]
          in: query
          description: 指派账号；@me=当前账号、@null=未指派、@notNull=已指派；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[storyId]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: filters[parentId]
          in: query
          description: '@null=顶层任务；=id 取该任务的子任务；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制'
          schema: { type: string }
        - name: filters[categoryId]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: filters[closedReason]
          in: query
          description: done|cancel；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[isParent]
          in: query
          description: true|false；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[deadline]
          in: query
          description: 日期闭区间 a..b，半开 ..b / a..；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[createdBy]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: filters[createdAt]
          in: query
          description: 时间闭区间 a..b，半开 ..b / a..；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[id]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: q
          in: query
          description: LIKE title/keywords（不命中 description）
          schema: { type: string }
      responses:
        '200':
          description: 任务分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createTask
      summary: 创建任务（带 parentId 即子任务；执行可见 40302 + task-create 40301；创建后 status 恒 wait）
      description: |
        executionId 取自路径、projectId 由执行带出（均不在请求体、创建后不可改）；创建时 status 恒 wait、consumedHours 恒 0，
        leftHours 不开放（start 时初始化）、consumedHours 不开放直改。
        父子仅一层：parentId 须为同执行任务（跨执行 → 42201），对子任务再传 parentId → 42203；首个子任务创建成功后父任务 isParent 置 true。
        权限：执行可见（40302）+ task-create（40301）；子任务不单独判权，随父任务所在执行判定。
      tags: [task]
      parameters:
        - name: executionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '200':
          description: 任务视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /executions/{executionId}/tasks/batch:
    post:
      operationId: batchCreateTasks
      summary: 批量创建任务（≤50 条，逐条校验部分成功；子任务随父一并提交）
      description: |
        ≤50 条，逐条校验、部分成功；子任务用 parentIndex 引用 items 中同行父行（父行失败则子行连带 error），
        或用 parentId 引用已存在任务。权限同单条创建：执行可见（40302）+ task-create（40301）。
      tags: [task]
      parameters:
        - name: executionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskBatchCreateRequest' }
      responses:
        '200':
          description: 逐项结果（index/ok/id/error）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskBatchCreateResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /tasks/{taskId}:
    get:
      operationId: getTask
      summary: 任务详情（含 children 摘要数组与 storyTitle；不可见执行 → 40302 先于 40401）
      description: |
        响应含只读联查字段：children（子任务摘要 id/title/status/assignee，仅详情响应出现）与 storyTitle（storyId≠0 时）。
        权限码 task-view。
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 任务视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTask
      summary: 部分更新任务（白名单 title/type/priority/categoryId/storyId/estimateHours/estStartedDate/deadline/keywords/description/notifyAccounts）
      description: |
        PATCH 清空语义（03 §1：null=不修改）：storyId/categoryId 传 0 清空；estStartedDate/deadline/keywords/description 传空串或显式 null（请求体出现该键）清空；
        estimateHours 传 0 清零。status/assignee/isParent/executionId/projectId/consumedHours/leftHours 不在白名单：状态流转走动作端点、
        指派走 assign、三件套由动作/工时回写，consumedHours 直改 → 42201。lockVersion 不符 → 40901。权限码 task-edit。
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdateRequest' }
      responses:
        '200':
          description: 任务视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LockConflict' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      operationId: deleteTask
      summary: 软删任务（父任务存在未删子任务 → 42203；删子任务后兄弟全删复位父 isParent）
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 已软删，data 为 null
          content:
            application/json:
              schema: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Referenced' }

  # ───────────────────────── task · 状态机八动作（task 卡 §4/§5） ─────────────────────────
  /tasks/{taskId}/start:
    post:
      operationId: startTask
      summary: 开始任务（wait → doing；startedAt=now，leftHours 缺省初始化）
      description: |
        守卫：非父任务（isParent=true → 42202）；from 非 wait → 42202；执行已关闭 → 42203。
        副作用：startedAt=now；leftHours 缺省初始化为 estimateHours−consumedHours；可带本次消耗（>0 落一条 effort）；传入 assignee 即改派；
        动态流 started；通知 assignee；父任务状态与三件套联动；storyId≠0 触发需求 stage 重算。
        动作端点不校验 lockVersion（状态本身即并发闸门，后至者 42202）；目标不存在或已软删 → 40401。权限码 task-start。
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskStartRequest' }
      responses:
        '200':
          description: 任务视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/StateConflict' }

  /tasks/{taskId}/finish:
    post:
      operationId: finishTask
      summary: 完成任务（wait|doing|pause → done；增量消耗 + 自动落 effort）
      description: |
        守卫：非父任务（isParent=true → 42202）；from ∉ wait|doing|pause → 42202；本次消耗>0 或累计 consumedHours>0（两者均为 0 → 42203）；
        startedAt ≤ finishedAt（违反 → 42201）；执行已关闭 → 42203。
        副作用：consumedHours += 本次消耗；leftHours 缺省清零；startedAt 空则补 now；finishedBy/At 回写；本次消耗>0 落一条 effort
        （leftHours=0、workDate=finishedAt 当天、work 缺省取 comment）且与状态更新同一事务（失败整体回滚）；动态流 finished；通知 createdBy；父联动。
        动作端点不校验 lockVersion（后至者 42202）；目标不存在或已软删 → 40401。权限码 task-finish。
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskFinishRequest' }
      responses:
        '200':
          description: 任务视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/StateConflict' }

  /tasks/{taskId}/pause:
    post:
      operationId: pauseTask
      summary: 暂停任务（doing → pause）
      description: |
        守卫：doing → pause，from 列外 → 42202；执行已关闭 → 42203。
        副作用：动态流 paused。动作端点不校验 lockVersion（后至者 42202）；目标不存在或已软删 → 40401。权限码 task-pause。
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
      responses:
        '200':
          description: 任务视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/StateConflict' }

  /tasks/{taskId}/resume:
    post:
      operationId: resumeTask
      summary: 继续任务（pause → doing）
      description: |
        守卫：pause → doing，from 列外 → 42202；执行已关闭 → 42203。
        副作用：动态流 resumed。动作端点不校验 lockVersion（后至者 42202）；目标不存在或已软删 → 40401。权限码 task-resume。
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
      responses:
        '200':
          description: 任务视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/StateConflict' }

  /tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
      summary: 取消任务（wait|doing|pause → cancel；assignee 回指 createdBy）
      description: |
        守卫：from ∉ wait|doing|pause → 42202；执行已关闭 → 42203。
        副作用：canceledBy/At 回写；assignee 回指 createdBy；动态流 canceled；通知原 assignee。
        动作端点不校验 lockVersion（后至者 42202）；目标不存在或已软删 → 40401。权限码 task-cancel。
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
      responses:
        '200':
          description: 任务视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/StateConflict' }

  /tasks/{taskId}/close:
    post:
      operationId: closeTask
      summary: 关闭任务（done|cancel → closed；父任务可从任意非 closed 关闭，非 done/cancel 来源 closedReason 必填）
      description: |
        守卫：done|cancel → closed；父任务（isParent=true）可从任意非 closed 状态关闭；非 done/cancel 来源时 closedReason 必填（缺失 → 42201）；
        from 列外 → 42202；执行已关闭 → 42203。
        副作用：closedReason 缺省按来源回填（done→done、cancel→cancel）；closedBy/At 回写；assignee 置空；动态流 closed。
        动作端点不校验 lockVersion（后至者 42202）；目标不存在或已软删 → 40401。权限码 task-close。
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCloseRequest' }
      responses:
        '200':
          description: 任务视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/StateConflict' }

  /tasks/{taskId}/activate:
    post:
      operationId: activateTask
      summary: 激活任务（done|cancel|closed → doing；leftHours 必填且 >0）
      description: |
        守卫：done|cancel|closed → doing；leftHours 必填且 >0（缺失/≤0 → 42201）；from 列外 → 42202；执行已关闭 → 42203。
        副作用：finishedBy/At、canceledBy/At、closedBy/At、closedReason 清空；activatedAt=now；传入 assignee 即改派；
        动态流 activated；通知 assignee；父联动；storyId≠0 触发需求 stage 重算。
        动作端点不校验 lockVersion（后至者 42202）；目标不存在或已软删 → 40401。权限码 task-activate。
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskActivateRequest' }
      responses:
        '200':
          description: 任务视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/StateConflict' }

  /tasks/{taskId}/assign:
    post:
      operationId: assignTask
      summary: 指派任务（任意非 closed/cancel；assignee 必填且存在）
      description: |
        守卫：closed/cancel → 42202，其余状态可指派；assignee 须为存在账号（不存在 → 42201）；执行已关闭 → 42203。
        副作用：assignee/assignedAt 更新；leftHours 传入则覆写；动态流 assigned；通知 assignee。
        动作端点不校验 lockVersion（后至者 42202）；目标不存在或已软删 → 40401。权限码 task-assign。
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskAssignRequest' }
      responses:
        '200':
          description: 任务视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/StateConflict' }

  /tasks/batch:
    post:
      operationId: batchTasks
      summary: 任务批量动作（action ∈ edit|assign|start|pause|resume|cancel|close，逐项结果部分成功）
      description: |
        action 枚举 = edit|assign|start|pause|resume|cancel|close；finish/activate 不进批量（表单个体差异大，走单动作端点）。
        action=edit 时 params 为 TaskUpdateRequest 子集逐条应用；其余动作 params 同对应单动作请求体（assign={assignee,leftHours?,comment?} 等）。
        逐项校验、部分成功（单条失败不影响其余）；越权项 error=40301，状态不允许 error=42202；权限按对应动作码逐条校验（无码 → 40301）。
      tags: [task]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchActionRequest' }
      responses:
        '200':
          description: 逐项结果（id/ok/error）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchActionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  # ───────────────────────── task · 工时（task 卡 §3b/§5） ─────────────────────────
  /tasks/{taskId}/efforts:
    get:
      operationId: listTaskEfforts
      summary: 任务工时明细（分页，默认 -workDate,-id；跨域统计复用本表规则）
      description: |
        任务可见即可读全部明细（读不限本人）；filters[workDate]=a..b 支持闭区间/半开（我的地盘/周报跨域统计复用本表规则）。
        默认排序 -workDate,-id。
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序，白名单 id/workDate，- 前缀降序；默认 -workDate,-id
          schema: { type: string }
        - name: filters[account]
          in: query
          description: 登记账号；@me=当前账号；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[workDate]
          in: query
          description: 日期闭区间 a..b，半开 ..b / a..；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[id]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: q
          in: query
          description: LIKE work
          schema: { type: string }
      responses:
        '200':
          description: 工时分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffortList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createEffort
      summary: 登记工时（consumedHours 增量累计进任务，leftHours 覆写任务剩余）
      description: |
        语义：任务 consumedHours += 本次消耗；leftHours 传值（非 null）则覆写任务剩余，缺省不改动。
        联动：consumedHours>0 且 leftHours>0 且任务 wait → 自动 doing（动态流 started）；leftHours=0 且任务未完成 → 自动按 finish 副作用完成（动态流 finished）。
        守卫：closed/cancel 任务拒绝登记（42202）；父任务（isParent=true）登记工时 → 42202（工时由子任务合计承载）；workDate 晚于今天 → 42201；执行已关闭 → 42203。
        account 恒为当前账号（不接受代登记，仅可为自己登记）；executionId/projectId 由任务带出；登记成功落动态流 effortRecorded（自动完成时先 effortRecorded 后 finished）。
        权限码 task-effort（任何可见者均可为自己登记）。
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EffortCreateRequest' }
      responses:
        '200':
          description: 工时视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffortView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /efforts/{effortId}:
    patch:
      operationId: updateEffort
      summary: 编辑工时（仅 workDate/consumedHours/leftHours/work 可改；回算任务工时）
      description: |
        可改字段仅 workDate/consumedHours/leftHours/work；taskId/account 不可改。
        回算：任务 consumedHours = 未删 effort 合计；leftHours 取最近一条 effort 的覆写值（无则保持）；状态不自动回退。动态流 effortEdited。
        权限：仅 effort 本人或超管（他人 → 40301，权限码 task-effort-edit）；执行已关闭 → 42203。工时不设 lockVersion（流水按 id 定位）。
      tags: [task]
      parameters:
        - name: effortId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EffortUpdateRequest' }
      responses:
        '200':
          description: 工时视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffortView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      operationId: deleteEffort
      summary: 删除工时（软删 + 回算任务工时；仅本人或超管）
      description: |
        软删与任务回算同一事务（失败整体回滚）：consumedHours 按剩余未删 effort 合计重算、leftHours 取最近覆写值，状态不回退；动态流 effortDeleted。
        权限：仅 effort 本人或超管（他人 → 40301，权限码 task-effort-delete）；执行已关闭 → 42203（写端点整体只读）。
      tags: [task]
      parameters:
        - name: effortId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 已删除，data 为 null
          content:
            application/json:
              schema: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Referenced' }

  /tasks/{taskId}/activities:
    get:
      operationId: listTaskActivities
      summary: 任务动态流（游标分页，倒序）
      description: |
        动作名全集：created/edited/started/finished/paused/resumed/canceled/closed/activated/assigned/effortRecorded/effortEdited/effortDeleted/autoUpdated。
      tags: [task]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          description: 默认 50 上限 200
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: beforeId
          in: query
          description: 上一页末条 id
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 动态流（items + hasMore）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  # ═════════════════════ quality · 质量域（quality 卡 §5，P4 · C1/C2）═════════════════════
  /products/{productId}/bugs:
    get:
      operationId: listBugs
      summary: Bug 列表（DataScope 注入 visibleProductIds）
      tags: [quality]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序，白名单 id/severity/priority/status/createdAt
          schema: { type: string }
        - name: filters[status]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: filters[severity]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: filters[priority]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: filters[type]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
