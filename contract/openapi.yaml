      properties:
        name:
          type: [string, 'null']
          maxLength: 255
        percent:
          type: [number, 'null']
          minimum: 0
          maximum: 100
        type:
          type: [string, 'null']
          enum: [mix, request, design, dev, qa, release, review, other, null]
        sort:
          type: [integer, 'null']

    # ── project · 看板空间（project 卡 §3.3） ──
    BoardSpaceView:
      type: object
      description: 看板空间（私人空间仅 owner/team/白名单可见，§7）；boards 仅空间详情端点填充，列表端点恒空数组
      required: [id, name, type, acl, whitelist, status, sort, lockVersion, boards]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 90 }
        type: { type: string, enum: [cooperation, public, private] }
        owner: { type: string }
        team:
          type: array
          items: { type: string }
        description:
          type: [string, 'null']
        acl: { type: string, enum: [open, private] }
        whitelist:
          type: array
          description: acl=private 时生效（acl_entry 承载）
          items: { type: string }
        status: { type: string, enum: [active, closed] }
        sort: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
