  # ═════════════════════ project · P3 新增 schema（project 卡 §3.2–3.8）═════════════════════
    # ── project · 三义实体（program / project / execution 同表，type 判别；project 卡 §3.1） ──
    ProjectView:
      type: object
      description: 项目集/项目/执行的统一视图（一表三义，type 判别：program=项目集；project=项目；sprint|stage|kanban=执行）
      required: [id, type, parentId, name, status, priority, acl, whitelist, sort, lockVersion]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        type: { type: string, enum: [program, project, sprint, stage, kanban], description: "类型" }
        parentId: { type: integer, format: int64, description: program→上级 program 或 0；project→所属 program 或 0；execution→所属 project }
        path: { type: string, description: '逗号包裹物化路径 ,1,3,' }
        grade: { type: integer, description: 层级深度，顶级=1 }
        name: { type: string, maxLength: 90, description: "项目名称" }
        code:
          type: [string, 'null']
          description: 编码（业务唯一标识）
          maxLength: 45
        model: { type: string, enum: [scrum, waterfall, kanban], description: 仅 project 型有效（execution 随所属项目；program 恒 scrum） }
        status: { type: string, enum: [wait, doing, suspended, delay, closed], description: "状态" }
        priority: { type: integer, minimum: 1, maximum: 4, description: "优先级" }
        beginDate:
          type: [string, 'null']
          description: 开始日期
          format: date
        endDate:
          type: [string, 'null']
          description: 结束日期
          format: date
        firstEndDate:
          type: [string, 'null']
          format: date
          description: 首次计划完成日，延期比对
        realBeganDate:
          type: [string, 'null']
          format: date
          description: start 动作回填
        realEndDate:
          type: [string, 'null']
          format: date
          description: close 动作回填
        days: { type: integer, description: 可用工作日，0–3650 }
        budget:
          type: [number, 'null']
          description: 预算
          minimum: 0
        budgetUnit: { type: string, enum: [CNY, USD], description: "预算单位" }
        description:
          type: [string, 'null']
          description: 描述
        pm:
          type: [string, 'null']
          description: 项目经理（登录账号）
        po:
          type: [string, 'null']
          description: 产品负责人（登录账号）
        qd:
          type: [string, 'null']
          description: 测试负责人（登录账号）
        rd:
          type: [string, 'null']
          description: 研发负责人（登录账号）
        progress: { type: integer, minimum: 0, maximum: 100, description: "进度（0~100）" }
        estimateHours: { type: number, minimum: 0, description: "预估工时" }
        consumedHours: { type: number, minimum: 0, description: "已消耗工时" }
        leftHours: { type: number, minimum: 0, description: "剩余工时" }
        isMilestone: { type: boolean, description: 仅 type=stage 有效 }
        acl: { type: string, enum: [open, private, program], description: program=继承上级项目集可见性（仅 project 型可用） }
        whitelist:
          type: array
          description: acl=private 时生效（acl_entry 承载）
          items: { type: string }
        sort: { type: integer, description: "排序值（升序，越小越前）" }
        customFields:
          type: object
          description: 自定义字段（动态字段表）
          additionalProperties: true
        createdBy: { type: string, description: "创建人（登录账号）" }
        createdAt: { type: string, format: date-time, description: "创建时间" }
        updatedBy:
          type: [string, 'null']
          description: 更新人（登录账号）
        updatedAt:
          type: [string, 'null']
          description: 更新时间
          format: date-time
        closedBy:
          type: [string, 'null']
          description: 关闭人（登录账号）
        closedAt:
          type: [string, 'null']
          description: 关闭时间
          format: date-time
        lockVersion: { type: integer, description: 写路径 If-Match 语义 }
    ProjectList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/ProjectView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }
    ProjectCreateRequest:
      type: object
      description: |-
        三型创建请求体（type 由端点定，不入 body）：POST /programs=项目集（必填 name/acl；parentId 缺省 0=顶级）；
        POST /projects=项目（必填 name/model/beginDate/endDate/acl + productIds，项目必须关联产品）；POST /projects/{projectId}/executions=执行（必填 name/beginDate/endDate/acl，parentId 取路径，跨型挂载 → 42201）。
      required: [name, acl]
      properties:
        type:
          type: [string, 'null']
          enum: [program, project, sprint, stage, kanban, null]
          description: 仅执行型创建端点必填（sprint|stage|kanban）；program/project 创建端点由路径决定类型，忽略该字段
        parentId:
          type: [integer, 'null']
          format: int64
          description: program→上级 program 或 0；project→所属 program 或 0；execution 由路径注入
        name: { type: string, maxLength: 90, description: "项目名称" }
        code:
          type: [string, 'null']
          description: 编码（业务唯一标识）
          maxLength: 45
        model:
          type: [string, 'null']
          enum: [scrum, waterfall, kanban, null]
          description: 仅 project 型，缺省 scrum
        beginDate:
          type: [string, 'null']
          format: date
          description: project/execution 必填且 beginDate ≤ endDate
        endDate:
          type: [string, 'null']
          description: 结束日期
          format: date
        days:
          type: [integer, 'null']
          description: ≥0 且 ≤3650，缺省 0
        budget:
          type: [number, 'null']
          description: 预算
          minimum: 0
        budgetUnit:
          type: [string, 'null']
          enum: [CNY, USD, null]
          description: 缺省 CNY
        priority:
          type: [integer, 'null']
          minimum: 1
          maximum: 4
          description: 缺省 1
        description:
          type: [string, 'null']
          description: 描述
        pm:
          type: [string, 'null']
          description: 项目经理（登录账号）
        po:
          type: [string, 'null']
          description: 产品负责人（登录账号）
        qd:
          type: [string, 'null']
          description: 测试负责人（登录账号）
        rd:
          type: [string, 'null']
          description: 研发负责人（登录账号）
        acl: { type: string, enum: [open, private, program], description: 缺省 open；program=继承上级项目集（仅 project 型） }
        whitelist:
          type: [array, 'null']
          description: 账号存在性校验；acl=private 时生效，缺省 []
          items: { type: string }
        sort:
          type: [integer, 'null']
          description: 排序值（升序，越小越前）
        isMilestone:
          type: [boolean, 'null']
          description: 仅执行型（type=stage）有效，缺省 false
        customFields:
          type: [object, 'null']
          description: 自定义字段（动态字段表）
          additionalProperties: true
        productIds:
          type: [array, 'null']
          description: '仅 POST /projects：项目必须关联产品（无产品项目不做，§1）；全量落 project_product'
          items: { type: integer, format: int64 }
    ProjectUpdateRequest:
      type: object
      description: |-
        三型部分更新请求体（project 卡 §5 PATCH 白名单；null=不修改）。program：name/code/beginDate/endDate/budget/pm/acl/whitelist/description/sort；
        project：name/code/model/beginDate/endDate/days/budget/pm/po/qd/rd/acl/whitelist/description/sort；execution：同 project + isMilestone。
      required: [lockVersion]
      properties:
