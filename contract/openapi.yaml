# 契约唯一真源 · 手写维护（03-contract.md §8）
# 变更流程：领域卡改字段 → 本文件改 schema → pnpm codegen + 后端实现对齐 → CI contract-diff 双向校验。
openapi: 3.1.0
info:
  title: Zentao API
  version: 0.2.0
  description: |
    自研项目管理平台 API。所有时间 ISO-8601 带时区；信封见 components。
    列表 DSL（03 §3）：page/limit/sort/filters[x]/q；游标时间线：limit/beforeId。
servers:
  - url: /api/v1
tags:
  - name: platform
    description: 平台能力（会话/RBAC/通知/文件/搜索/meta/dicts/settings/lang-items/comments）
  - name: org
    description: 组织（账号/部门树/权限组矩阵与成员）
  - name: product
    description: 产品（产品/分支/分类树/计划/发布/构建；product 卡 §5）
  - name: requirement
    description: 需求（story/epic/requirement 三型全生命周期；requirement 卡 §5）
  - name: project
    description: 项目（项目集/项目/执行三层、阶段字典、通用看板、团队与干系人；project 卡 §5）
  - name: task
    description: 任务与工时（八动作全生命周期 + effort 登记与回算；task 卡 §5）

  - name: quality
    description: 质量（Bug/用例/套件/用例库/测试单/执行结果/测试报告；quality 卡 §5）
  - name: doc
    description: 文档（文档库/文档/版本快照与比对/库内目录；doc 卡 §5）
  - name: workspace
    description: 工作台（待办/我的地盘聚合/周报 EVM/固定报表；workspace 卡 §5）

paths:
  # ───────────────────────── platform · 会话（P0 已在） ─────────────────────────
  /session:
    post:
      operationId: login
      summary: 登录（种 HttpOnly cookie ZT_SESSION，SameSite=Lax，有效期随会话过期时间）
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回当前账号视图并种会话 cookie（信封 {data:…} 由 api-client 统一拆解，故此处直接引用载荷）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          description: 账号或密码错误 / 账号停用 / 锁定窗口内（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: '缺少 CSRF 头 X-Requested-With: fetch（40301）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 字段校验失败（42201，error.fields 携带字段级错误）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 同账号 1 分钟失败 ≥10 次（42901）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: logout
      summary: 登出（删会话行，清 cookie）
      tags: [platform]
      responses:
        '200':
          description: 已登出，data 为 null（api-client 拆解后载荷为 null）
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /me:
    get:
      operationId: getMe
      summary: 当前账号 + 权限码数组 + 字典快照
      tags: [platform]
      responses:
        '200':
          description: 当前会话账号视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ───────────────────────── platform · 通知（platform 卡 §5） ─────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      summary: 本人通知列表（恒 recipient=@me；filters[readAt]=@null 即未读页签）
      tags: [platform]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序，白名单 id/createdAt，- 前缀降序
          schema: { type: string }
        - name: filters[type]
          in: query
          description: 通知事件码等值/IN（DSL 见 03 §3）
          schema: { type: string }
        - name: filters[objectType]
          in: query
          schema: { type: string }
        - name: filters[readAt]
          in: query
          description: '@null=未读；@notNull=已读'
          schema: { type: string }
        - name: filters[createdAt]
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: LIKE title/content
          schema: { type: string }
      responses:
        '200':
          description: 通知分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /notifications/unread-count:
    get:
      operationId: getNotificationUnreadCount
      summary: 当前账号未读通知数
      tags: [platform]
      responses:
        '200':
          description: 未读计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCountView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: 标记通知已读（幂等；他人通知 → 40302）
      tags: [platform]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 已读通知视图（readAt 置位）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 非本人通知（40302）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 通知不存在（40401）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /notifications/stream:
    get:
      operationId: subscribeNotificationStream
      summary: SSE 订阅（event=notification.created/ping；每账号 ≤5 连接，超出 42901；首帧 retry:5000；Last-Event-ID 补发 ≤100 条）
      tags: [platform]
      responses:
        '200':
          description: text/event-stream 长连接
          content:
            text/event-stream:
              schema: { type: string }
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 每账号并发连接超上限（42901）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ───────────────────────── platform · 文件（platform 卡 §5） ─────────────────────────
  /files:
    post:
      operationId: uploadFile
      summary: 上传附件（multipart 单文件；黑名单扩展名/超 50MB → 42201）
      tags: [platform]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                objectType:
                  type: string
                  description: 绑定对象类型，空=未绑定
                objectId:
                  type: integer
                  format: int64
      responses:
        '200':
          description: 文件视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 file-upload 权限码（40301）/ 缺 CSRF 头
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 扩展名黑名单 / 超 50MB（42201）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listFiles
      summary: 按对象列出附件（filters[objectType] + filters[objectId] 必填，缺 → 40001）
      tags: [platform]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序，白名单 id/size/createdAt
          schema: { type: string }
        - name: filters[objectType]
          in: query
          required: true
          schema: { type: string }
        - name: filters[objectId]
          in: query
          required: true
          schema: { type: string }
        - name: filters[extension]
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: LIKE title
          schema: { type: string }
      responses:
        '200':
          description: 附件分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'
        '400':
          description: 缺必填过滤或字段未注册（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /files/{fileId}/download:
    get:
      operationId: downloadFile
      summary: '下载附件（恒 Content-Disposition: attachment；downloads+1）'
      tags: [platform]
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 文件二进制流
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 文件不存在或已软删（40401）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /files/{fileId}/raw:
    get:
      operationId: getRawFile
      summary: 图片内联预览（白名单 jpg/jpeg/png/gif/webp/bmp；非图片 → 40001；不计 downloads）
      tags: [platform]
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: '图片二进制流（Content-Type 按扩展名探测；inline + X-Content-Type-Options: nosniff）'
          content:
            image/*:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /files/{fileId}:
    delete:
      operationId: deleteFile
      summary: 删除附件（软删；仅上传人或超管，否则 40302）
      tags: [platform]
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 已删除，data 为 null
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 非上传人且非超管（40302）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 文件不存在（40401）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ───────────────────────── platform · 搜索（platform 卡 §5.2） ─────────────────────────
  /search:
    get:
      operationId: globalSearch
      summary: 全局搜索（SQL LIKE；DataScope 滤除无权对象；scope 白名单外 → 40001）
      tags: [platform]
      parameters:
        - name: q
          in: query
          required: true
          description: 关键词 1–100 字符
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: scope
          in: query
          description: 缺省=全部注册 scope
          schema:
            type: string
            enum: [story, epic, requirement, task, bug, testCase, doc, todo]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 统一结果项，按 updatedAt 倒序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultList'
        '400':
          description: q 缺失或 scope 白名单外（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ───────────────────────── platform · meta/dicts/settings/lang-items ─────────────────────────
  /meta/{domain}:
    get:
      operationId: getMeta
      summary: 域字段元数据（03 §5；未注册域 → 40401）
      tags: [platform]
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string }
        - name: form
          in: query
          description: 表单场景（create/edit/动作名），影响 required/visibleWhen
          schema: { type: string }
      responses:
        '200':
          description: 域元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 域未注册（40401）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /dicts/{name}:
    get:
      operationId: getDict
      summary: 计算字典（platform 卡 §3.9；未注册名 → 40401）
      tags: [platform]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 字典条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 字典未注册（40401）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /settings:
    get:
      operationId: getSettings
      summary: 设置读取（keys=csv 扁平键 `<domain>.<key>`，不存在的键不出现）
      tags: [platform]
      parameters:
        - name: keys
          in: query
          required: true
          description: 逗号分隔扁平键，如 common.timezone,notify.story-change
          schema: { type: string }
      responses:
        '200':
          description: 键值映射
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: putSettings
      summary: 设置批量写（notify.* 个人级 owner=@me；其余系统键需 setting-manage）
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          description: 写入后的键值映射
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 写系统键无 setting-manage（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ───────────────────────── platform · 列设置（个人级，服务端持久化） ─────────────────────────
  /column-prefs/{resource}:
    get:
      operationId: getColumnPref
      summary: 列设置读取（个人级：只读当前账号自己的行；未设置 → columns 为 null，前端用页面默认）
      tags: [platform]
      parameters:
        - $ref: '#/components/parameters/ColumnPrefResource'
      responses:
        '200':
          description: 该账号在该资源的列设置（未设置为 null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnPrefView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: resource 不合规（42201，fields.resource）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: saveColumnPref
      summary: 整表保存列设置（个人级：只写当前账号自己的行；同账号同资源幂等覆盖）
      tags: [platform]
      parameters:
        - $ref: '#/components/parameters/ColumnPrefResource'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnPrefUpdateRequest'
      responses:
        '200':
          description: 保存后的列设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnPrefView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 列项非法（42201，fields.columns；key 空/重复/超长、fixed 枚举外值）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: resetColumnPref
      summary: 重置列设置（删除当前账号在该资源的行 = 回页面默认）
      tags: [platform]
      parameters:
        - $ref: '#/components/parameters/ColumnPrefResource'
      responses:
        '200':
          description: 已重置，data 为 null
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: resource 不合规（42201，fields.resource）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /lang-items/{domain}/{field}:
    get:
      operationId: getLangItems
      summary: 文案读取（内建默认 + 覆盖合并，overridden 标记）
      tags: [platform]
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string }
        - name: field
          in: path
          required: true
          schema: { type: string }
        - name: lang
          in: query
          description: 缺省 zh-cn
          schema: { type: string }
      responses:
        '200':
          description: 键值与覆盖标记
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LangItemView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: putLangItems
      summary: 保存文案覆盖（lang-manage）
      tags: [platform]
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string }
        - name: field
          in: path
          required: true
          schema: { type: string }
        - name: lang
          in: query
          description: 文案语言码，缺省 zh-cn（运行时早已接受，2026-09-20 补登记：C-16 X-01）
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LangItemsUpdateRequest'
      responses:
        '200':
          description: 保存后键值
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LangItemView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 lang-manage（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteLangItems
      summary: 恢复默认（删覆盖层，lang-manage）
      tags: [platform]
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string }
        - name: field
          in: path
          required: true
          schema: { type: string }
        - name: lang
          in: query
          description: 文案语言码，缺省 zh-cn（运行时早已接受，2026-09-20 补登记：C-16 X-02）
          schema: { type: string }
      responses:
        '200':
          description: 删除覆盖后键值
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LangItemView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 lang-manage（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ───────────────────────── platform · 多语言上传（platform 卡 §3.12） ─────────────────────────
  /lang-items/overrides:
    get:
      operationId: listLangOverrides
      summary: 文案覆盖层全量（按语言；前端运行时合并的数据源）
      tags: [platform]
      parameters:
        - name: lang
          in: query
          description: 文案语言码，缺省 zh-cn
          schema: { type: string }
      responses:
        '200':
          description: 该语言的全部覆盖行（不分页，无 domain/section 过滤）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LangOverrideList'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lang-items/export:
    get:
      operationId: exportLangItems
      summary: 导出语言包 Excel（全量键 + 当前生效文案，lang-manage）
      tags: [platform]
      responses:
        '200':
          description: >-
            xlsx 二进制流（Content-Disposition: attachment; filename=lang-zh-CN.xlsx）；
            单工作表单页，表头 `key | zh-cn | en`，一行一个目录键，值 = 覆盖值（无覆盖则内建默认），
            导出的文件即导入格式，可原样回传
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /lang-imports:
    post:
      operationId: createLangImport
      summary: 上传语言包 Excel（格式校验 + 落覆盖 + 记操作，lang-manage）
      tags: [platform]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, lang]
              properties:
                file:
                  type: string
                  format: binary
                  description: .xlsx/.xls 文件；首行表头须含 key，且至少含 zh-cn/en 之一
                lang:
                  type: string
                  description: 本次上传的语言码（zh-cn/en；记录进上传日志）
      responses:
        '200':
          description: 成功落库并记一条 status=success 的上传记录（全部行通过校验才写入，校验期间不写覆盖层）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LangImportView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: >-
            格式校验失败（42201）：`fields` 为 `row:<Excel 行号>` → 原因码（文件级错误用键 `file`），
            至多 20 条；失败同样写一条 status=failed 的上传记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listLangImports
      summary: 语言包上传记录（平台卡 §3.12；谁在什么时候上传了什么）
      tags: [platform]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序（缺省 -createdAt）
          schema: { type: string, default: '-createdAt' }
        - name: filters[lang]
          in: query
          description: 上传语言（等值；zh-cn/en）
          schema: { type: string }
        - name: filters[status]
          in: query
          description: 上传结果（等值）
          schema: { type: string, enum: [success, failed] }
        - name: q
          in: query
          description: 关键词（文件名包含匹配）
          schema: { type: string }
      responses:
        '200':
          description: 上传记录列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LangImportList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

