      description: >-
        sessionId 是 GET /online-users 给出的 id（token 的 sha256），不是 cookie 值本身。幂等：行已消失
        （对方已登出 / 已过期）同样 200——管理意图「这条会话没了」已达成。成功的写请求由审计横切落
        audit_log（action=online-user-kick）。
      tags: [platform]
      parameters:
        - name: sessionId
          in: path
          required: true
          description: 在线会话 id（GET /online-users 的 items[].id，64 位 hex 摘要）
          schema: { type: string }
      responses:
        '200':
          description: 已强退，data 为 null（api-client 拆解后载荷为 null）
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 online-user-kick（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': { $ref: '#/components/responses/Validation' }

