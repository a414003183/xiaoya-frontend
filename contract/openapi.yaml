      operationId: listWeeklyReports
      summary: 周报快照列表（仅已落库历史周，不触发重算）
      tags: [workspace]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序，白名单 weekStart
          schema: { type: string }
        - name: filters[weekStart]
          in: query
          description: 日期或区间
          schema: { type: string }
      responses:
        '200':
          description: 周报分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyReportList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/weekly-reports/current:
    get:
      operationId: getCurrentWeeklyReport
      summary: 指定周周报（date 传周内任意一天，缺省本周，归一到周一；读取时幂等重算并整行覆写）
      tags: [workspace]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: date
          in: query
          description: 周内任意一天 YYYY-MM-DD，缺省今天
          schema: { type: string, format: date }
      responses:
        '200':
          description: 周报视图（含 weekSN/weekEnd/analysis 与三张任务表）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyReportView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{productId}/reports/story-summary:
    get:
      operationId: getStorySummaryReport
      summary: 需求统计（按状态/优先级/阶段/类型分组，排除已删）
      tags: [workspace]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 需求统计报表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorySummaryReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{productId}/reports/bug-distribution:
    get:
      operationId: getBugDistributionReport
      summary: Bug 分布（按严重度/状态/解决方案分组，resolution 空计 unresolved 桶）
      tags: [workspace]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Bug 分布报表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BugDistributionReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /executions/{executionId}/reports/burn:
    get:
      operationId: getBurnReport
      summary: 燃尽报表（ideal 直线 + remaining 执行级日行；当日快照缺失先幂等落库）
      tags: [workspace]
      parameters:
        - name: executionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 燃尽报表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BurnReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /test-runs/{testRunId}/reports/case-pass-rate:
    get:
      operationId: getCasePassRateReport
      summary: 用例通过率（passRate = passed/(total−na)×100 两位小数，分母 0 → null）
      tags: [workspace]
      parameters:
        - name: testRunId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 用例通过率报表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasePassRateReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  responses:
    BadRequest:
      description: 参数错误 / 未注册过滤排序字段（40001）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 未登录或会话过期（40101）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 无功能权限（40301）或不满足数据权限（40302）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 资源不存在（40401）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    LockConflict:
      description: 乐观锁冲突，lockVersion 不符（40901）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Validation:
      description: 字段校验失败（42201，fields 携带字段级错误）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    StateConflict:
      description: 当前状态不允许该动作（42202）或守卫条件不满足（42203）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Referenced:
      description: 被其他资源引用，禁止删除（42203）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  parameters:
    Page:
      name: page
      in: query
      description: 页码，从 1 开始（03 §3）
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: 每页条数，默认 50 上限 200
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    ColumnPrefResource:
      name: resource
      in: path
      required: true
      description: 列设置的资源标识（列表页身份，如 quality-bugs）
      schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9-]+$' }

  schemas:
    DataEnvelope:
      type: object
      required: [data]
      properties:
        data:
          description: 任意单资源/聚合对象；200 响应直接引用载荷 schema，信封由 api-client 统一拆解
      description: 单资源信封基型（03 §2）。列表端点用 ListEnvelope，错误用 ErrorEnvelope。
    ListEnvelope:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
          format: int64
      description: 列表信封（03 §2）：items + total。游标分页时间线例外：items + hasMore。
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId]
          properties:
            code:
              type: integer
              description: 5 位错误码（03 §4），段位即 HTTP 映射：40101 未登录/40301 无功能权限/40302 无数据权限/40401 不存在/40901 乐观锁/42201 字段校验/42202 状态不允许/42203 守卫不满足/42901 限流/50001 内部
            message:
              type: string
              description: 已按 Accept-Language 本地化的错误文案
            fields:
              type: object
              additionalProperties:
                type: string
              description: 仅 42201：字段级错误码，form-engine 直接消费
            traceId:
              type: string
              description: 链路追踪 id，与响应头 X-Trace-Id 一致

    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 64

    AccountView:
      type: object
      description: 账号响应视图（org 卡 §3.1 读侧；password 只写不读，任何端点不回显）
      required: [id, account, realName, gender, status, groupIds, fails, createdAt, lockVersion]
      properties:
        id:
          type: integer
          format: int64
        account:
          type: string
        realName:
          type: string
        nickname:
          type: [string, 'null']
          maxLength: 60
        role:
          description: 账号角色码，取值来自角色列表（GET /roles，可维护）；未设置为 null
          type: [string, 'null']
          maxLength: 16
        departmentId:
          type: [integer, 'null']
          format: int64
        email:
          type: [string, 'null']
          maxLength: 90
        mobile:
          type: [string, 'null']
          maxLength: 20
        phone:
          type: [string, 'null']
          maxLength: 20
        gender:
          type: string
          enum: [m, f]
        birthday:
          type: [string, 'null']
          format: date
        joinedAt:
          type: [string, 'null']
          format: date
        avatarFileId:
          type: [integer, 'null']
          format: int64
        status:
          type: string
          enum: [active, disabled]
        mustChangePassword:
          type: boolean
          readOnly: true
          description: 首登强制改密标记（06 A7-5，只读）：种子/迁移生成的初始口令为 true，本人改密成功后为 false；
            前端会话门禁据此把业务路由重定向到 /my/profile，后端不拦截请求
        groupIds:
          type: array
          description: 所属权限组 id 集合（user_group 关联）
          items: { type: integer, format: int64 }
        fails:
          type: integer
          description: 连续登录失败次数（只读）
        lockedAt:
          type: [string, 'null']
          format: date-time
          description: 登录锁定时间（只读；10 分钟窗口自动解除）
        lastActiveAt:
          type: [string, 'null']
          format: date-time
        createdBy:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: 软删标记
        lockVersion:
          type: integer

    MeView:
      type: object
      description: 当前会话快照（03 §7）：前端权限显隐只认 privileges，真鉴权永远在后端；dictionaries 字段 2026-09-19 移除（恒空无消费者，C3 冻结登记）
      required: [account, privileges]
      properties:
        account:
          $ref: '#/components/schemas/AccountView'
        privileges:
          type: array
          items:
            type: string
          description: 权限码数组（`<资源单数>-<动作>`，platform 卡 §7.1）

    # ── platform · 通知 ──
    NotificationView:
      type: object
      description: 站内通知（platform 卡 §3.4）
      required: [id, recipient, type, objectId, title, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        recipient: { type: string }
        type:
          type: string
          description: 通知事件码 `<资源单数>-<动作>`
        objectType:
          type: [string, 'null']
        objectId:
          type: integer
          format: int64
          description: 0=系统通知
        activityId:
          type: [integer, 'null']
          format: int64
          description: 点击跳转上下文
        title: { type: string, maxLength: 255 }
        content:
          type: [string, 'null']
          maxLength: 2000
        readAt:
          type: [string, 'null']
          format: date-time
          description: null=未读
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationView' }
        total: { type: integer, format: int64 }
    NotificationUnreadCountView:
      type: object
      required: [count]
      properties:
        count: { type: integer, format: int64 }

    # ── platform · 文件 ──
    FileView:
      type: object
      description: 附件（platform 卡 §3.5；path 内部列不进响应体）
      required: [id, title, url, extension, size, objectType, objectId, downloads, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, maxLength: 255 }
        url:
          type: string
          description: = /files/{id}/download，编辑器插图用
        extension: { type: string }
        size: { type: integer, format: int64, description: 字节 }
        objectType:
          type: string
          description: 空=未绑定对象
        objectId: { type: integer, format: int64 }
        downloads: { type: integer, format: int64 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    FileList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FileView' }
        total: { type: integer, format: int64 }

    # ── platform · 搜索 ──
    SearchResultItem:
      type: object
      description: 统一搜索结果项（platform 卡 §5.2）
      required: [objectType, objectId, title, updatedAt]
      properties:
        objectType: { type: string }
        objectId: { type: integer, format: int64 }
        title: { type: string }
        excerpt:
          type: [string, 'null']
        updatedAt: { type: string, format: date-time }
    SearchResultList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchResultItem' }
        total: { type: integer, format: int64 }

    # ── platform · meta / dicts ──
    MetaView:
      type: object
      description: 域元数据（03 §5）
      required: [domain, fields]
      properties:
        domain: { type: string }
        fields:
          type: array
          items:
            type: object
            additionalProperties: true
        list:
          type: [object, 'null']
          additionalProperties: true
          description: '{defaultColumns, defaultSort}'
        actions:
          type: [array, 'null']
          description: 动作目录，allowedStatus 与 workflow YAML 同源
          items:
            type: object
            additionalProperties: true
        statusVisuals:
          type: [object, 'null']
          additionalProperties: true
    DictView:
      type: object
      description: 计算字典（platform 卡 §3.9）
      required: [name, items]
      properties:
        name: { type: string }
        items:
          type: array
          description: 条目结构随 name 变化（accounts/departments/timezones/locales/privileges）
          items: { type: object, additionalProperties: true }

    # ── platform · settings / lang-items ──
    SettingView:
      type: object
      description: 设置键值映射（扁平键 `<domain>.<key>` → JSON 值）
      required: [settings]
      properties:
        settings:
          type: object
          additionalProperties: true
    SettingsUpdateRequest:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          additionalProperties: true
          description: 批量写键值

    # ── platform · 列设置（个人级偏好：列表页「列设置」的服务端持久化） ──
    ColumnPrefItem:
      type: object
      description: 一个列的设置项（数组顺序即展示顺序）
      required: [key, visible, fixed]
      properties:
        key:
          type: string
          maxLength: 64
          description: 列的稳定身份（与前端列 key/dataIndex 同值）
        visible:
          type: boolean
          description: 是否显示
        fixed:
          type: [string, 'null']
          enum: [left, right, null]
          description: 固定方向；不固定为 null
    ColumnPrefView:
      type: object
      description: 某账号在某列表资源上的列设置（个人级；未设置时 columns 为 null）
      required: [resource, columns]
      properties:
        resource:
          type: string
          description: 资源标识（同请求路径参数）
        columns:
          type: [array, 'null']
          description: 列设置有序表；null = 未设置（前端用页面默认列）
          items:
            $ref: '#/components/schemas/ColumnPrefItem'
    ColumnPrefUpdateRequest:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          description: 整表覆盖（顺序即展示顺序；服务端按此顺序返回）
          items:
            $ref: '#/components/schemas/ColumnPrefItem'
    LangItemView:
      type: object
      description: 文案键值（内建默认 + 覆盖合并）
      required: [items]
      properties:
        items:
          type: object
          additionalProperties: { type: string }
        overridden:
          type: boolean
          description: 该域/字段是否存在覆盖
    LangItemsUpdateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: object
          additionalProperties: { type: string }
          description: key → 覆盖文案

    # ── platform · 多语言上传（platform 卡 §3.12） ──
    LangOverrideView:
      type: object
      description: 一条文案覆盖行（platform 卡 §3.12；key 为全点分键，lang/domain/section 为存储拆分）
      required: [lang, domain, section, key, value]
      properties:
        lang: { type: string }
        domain: { type: string }
        section: { type: string }
        key:
          type: string
          description: 全点分键（= domain + '.' + 其余段；与语言包键同形）
        value: { type: string }
    LangOverrideList:
      type: object
      description: 某语言的覆盖层全量（不分页、无过滤；前端运行时合并，见 platform 卡 §3.12）
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LangOverrideView' }
    LangImportView:
      type: object
      description: 语言包上传记录（platform 卡 §3.12；失败也留痕，message 存校验失败摘要）
      required: [id, lang, fileName, totalRows, appliedRows, failedRows, status, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        lang: { type: string }
        fileName: { type: string }
        totalRows:
          type: integer
          format: int32
          description: 文件数据行数（不含表头）
        appliedRows:
          type: integer
          format: int32
          description: 实际落覆盖的行数（校验失败为 0）
        failedRows:
          type: integer
          format: int32
          description: 未通过校验的行数
        status:
          type: string
          enum: [success, failed]
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        message:
          type: [string, 'null']
          description: 校验失败摘要（成功为 null）
        lockVersion: { type: integer, format: int32 }
    LangImportList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LangImportView' }
        total: { type: integer, format: int64 }

    # ── platform · 评论 / 动态流 ──
    CommentView:
      type: object
      description: 评论（platform 卡 §3.3）
      required: [id, objectType, objectId, content, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        objectType: { type: string }
        objectId: { type: integer, format: int64 }
        content: { type: string, maxLength: 10000 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    CommentCreateRequest:
      type: object
      required: [objectType, objectId, content]
      properties:
        objectType: { type: string }
        objectId: { type: integer, format: int64 }
        content: { type: string, minLength: 1, maxLength: 10000 }
    CommentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CommentView' }
        total: { type: integer, format: int64 }
    ActivityView:
      type: object
      description: 动态流（platform 卡 §3.2）
      required: [id, objectType, objectId, actor, action, occurredAt]
      properties:
        id: { type: integer, format: int64 }
        objectType: { type: string }
        objectId: { type: integer, format: int64 }
        actor: { type: string }
        action: { type: string, maxLength: 64 }
        detail:
          type: [array, 'null']
          description: 编辑类动作字段 diff [{field, oldValue, newValue}]
          items: { type: object, additionalProperties: true }
        remark:
          type: [string, 'null']
        occurredAt: { type: string, format: date-time }
    ActivityList:
      type: object
      description: 游标分页时间线（03 §3：items + hasMore，倒序）
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityView' }
        hasMore: { type: boolean }

    # ── org · 账号请求 ──
    AccountCreateRequest:
      type: object
      description: 创建账号（org 卡 §3.1 写侧）
      required: [account, password, realName]
      properties:
        account:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9._-]+$'
        password:
          type: string
          minLength: 6
          maxLength: 64
        realName:
          type: string
          minLength: 1
          maxLength: 100
        nickname:
          type: [string, 'null']
          maxLength: 60
        role:
          description: 账号角色码，必须存在于角色列表（GET /roles）；未设置为 null
          type: [string, 'null']
          maxLength: 16
        departmentId:
          type: [integer, 'null']
          format: int64
        email:
          type: [string, 'null']
          maxLength: 90
        mobile:
          type: [string, 'null']
          maxLength: 20
        phone:
          type: [string, 'null']
          maxLength: 20
        gender:
          type: [string, 'null']
          enum: [m, f, null]
        birthday:
          type: [string, 'null']
          format: date
        joinedAt:
          type: [string, 'null']
          format: date
        avatarFileId:
          type: [integer, 'null']
          format: int64
        groupIds:
          type: array
          description: 初始权限组
          items: { type: integer, format: int64 }
    AccountUpdateRequest:
      type: object
      description: 部分更新（account 字段不可出现；null=不修改）
      properties:
        realName:
          type: [string, 'null']
          maxLength: 100
        nickname:
          type: [string, 'null']
          maxLength: 60
        role:
          description: 账号角色码，必须存在于角色列表（GET /roles）；未设置为 null
          type: [string, 'null']
          maxLength: 16
        departmentId:
          type: [integer, 'null']
          format: int64
        email:
          type: [string, 'null']
          maxLength: 90
        mobile:
          type: [string, 'null']
          maxLength: 20
        phone:
          type: [string, 'null']
          maxLength: 20
        gender:
          type: [string, 'null']
          enum: [m, f, null]
        birthday:
          type: [string, 'null']
          format: date
        joinedAt:
          type: [string, 'null']
          format: date
        avatarFileId:
          type: [integer, 'null']
          format: int64
        groupIds:
          type: [array, 'null']
          description: 全量替换组集合
          items: { type: integer, format: int64 }
        lockVersion:
          type: integer
    AccountPasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, minLength: 1, maxLength: 64 }
        newPassword: { type: string, minLength: 6, maxLength: 64 }
    AccountResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, minLength: 6, maxLength: 64 }
    AccountActionRequest:
      type: object
      description: disable/enable/delete 动作通用请求体（comment 可省）
      properties:
        comment:
          type: [string, 'null']
    AccountBatchCreateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AccountCreateRequest' }
    AccountBatchCreateResult:
      type: object
      description: 批量创建逐项结果（org 卡 §5）
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [index, ok]
            properties:
              index: { type: integer }
              ok: { type: boolean }
              id:
                type: [integer, 'null']
                format: int64
              error:
                type: [string, 'null']
    AccountList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AccountView' }
        total: { type: integer, format: int64 }

    # ── org · 部门 ──
    DepartmentNode:
      type: object
      description: 部门节点（org 卡 §3.2；path/grade 服务端维护只读；平铺列表端点复用本 schema，children 恒空数组）
      required: [id, name, path, grade, sort, children]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 60 }
        parentId:
          type: [integer, 'null']
          format: int64
        parentName:
          type: [string, 'null']
          description: 上级部门名（服务端按 parent_id 一次映射解析；根部门为 null）
        path:
          type: string
          description: 逗号包裹 id 链（,1,3,8,）
        grade:
          type: integer
          description: 层级，根=1
        sort: { type: integer }
        manager:
          type: [string, 'null']
        children:
          type: array
          items: { $ref: '#/components/schemas/DepartmentNode' }
    DepartmentTree:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DepartmentNode' }
    DepartmentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DepartmentNode' }
        total: { type: integer, format: int64 }
    DepartmentCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        parentId:
          type: [integer, 'null']
          format: int64
        sort: { type: integer, minimum: 0 }
        manager:
          type: [string, 'null']
    DepartmentUpdateRequest:
      type: object
      description: 重命名/移动/改负责人（null=不修改）
      properties:
        name:
          type: [string, 'null']
          maxLength: 60
        parentId:
          type: [integer, 'null']
          format: int64
        sort:
          type: [integer, 'null']
          minimum: 0
        manager:
          type: [string, 'null']
        lockVersion: { type: integer }
    DepartmentTreeSaveRequest:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [name]
            properties:
              id:
                type: [integer, 'null']
                format: int64
                description: 无 id = 新增节点
              parentId:
                type: [integer, 'null']
                format: int64
              name: { type: string, minLength: 1, maxLength: 60 }
              sort: { type: integer, minimum: 0 }
              manager:
                type: [string, 'null']

    # ── org · 权限组 ──
    RoleView:
      type: object
      description: 账号角色字典项（org 卡 §3.4；内置角色 builtin=true，可改名不可删）
      required: [code, labels, sort, builtin, accountCount, lockVersion]
      properties:
        code:
          type: string
          maxLength: 16
          description: 角色码（账号 role 列存它，创建后不可改；上限 16 与 account.role 列同宽）
        labels:
          type: object
          additionalProperties: { type: string, maxLength: 60 }
          description: 语言码 → 角色名（前端按当前语言取，缺省回退任一非空值；服务端不枚举语言）
        sort: { type: integer, description: 升序展示位 }
        builtin: { type: boolean, description: 内置角色（迁移自旧禅道 roleList，不可删除） }
        accountCount: { type: integer, format: int64, description: 仍在使用该角色的账号数（删除守卫） }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: [string, 'null'] }
        updatedAt:
          type: [string, 'null']
          format: date-time
        lockVersion: { type: integer }
    RoleList:
      type: object
      description: 角色列表（字典级小列表，不分页）
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RoleView' }
        total: { type: integer, format: int64 }
    RoleCreateRequest:
      type: object
      required: [code, labels]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 16
          pattern: '^[a-z][a-z0-9-]*$'
          description: 角色码（小写字母开头，字母/数字/连字符；上限 16 与 account.role 列同宽）
        labels:
          type: object
          additionalProperties: { type: string }
          description: 语言码 → 角色名（至少一个非空）
        sort: { type: [integer, 'null'], description: 缺省排到末尾 }
    RoleUpdateRequest:
      type: object
      description: 部分更新（03 §1 null=不修改）
      properties:
        labels:
          type: [object, 'null']
          additionalProperties: { type: string }
        sort:
          type: [integer, 'null']
        lockVersion: { type: integer }
    GroupView:
      type: object
      description: 权限组（org 卡 §3.3；矩阵与成员走子资源端点）
      required: [id, name, memberCount, privilegeCount, createdAt, lockVersion]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 60 }
        description:
          type: [string, 'null']
          maxLength: 255
        acl:
          $ref: '#/components/schemas/GroupAcl'
        memberCount: { type: integer, format: int64 }
        privilegeCount: { type: integer, format: int64 }
        createdBy:
          type: [string, 'null']
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
        lockVersion: { type: integer }
    GroupAcl:
      type: object
      description: 组数据权限追加可见集（platform 卡 §7.2；A-08 补口 2026-09-19），五键各为对象 id 数组
      properties:
        views:
          type: array
          items: { type: integer, format: int64 }
        products:
          type: array
          items: { type: integer, format: int64 }
        programs:
          type: array
          items: { type: integer, format: int64 }
        projects:
          type: array
          items: { type: integer, format: int64 }
        executions:
          type: array
          items: { type: integer, format: int64 }
    GroupCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description:
          type: [string, 'null']
          maxLength: 255
    GroupUpdateRequest:
      type: object
      properties:
        name:
          type: [string, 'null']
          maxLength: 60
        description:
          type: [string, 'null']
          maxLength: 255
        acl:
          $ref: '#/components/schemas/GroupAcl'
          description: null=不修改；传对象=整体替换（PATCH null 语义见 03 §1）
        lockVersion: { type: integer }
    GroupCopyRequest:
      type: object
      required: [name, copyPrivileges, copyMembers]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description:
          type: [string, 'null']
          maxLength: 255
        copyPrivileges: { type: boolean }
        copyMembers: { type: boolean }
    GroupPrivilegesView:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { type: string }
    GroupPrivilegesRequest:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          description: 整体替换的目标权限码集合
          items: { type: string }
    GroupMembersRequest:
      type: object
      required: [accountIds]
      properties:
        accountIds:
          type: array
          description: 整体替换的目标成员集合（服务端去重）
          items: { type: integer, format: int64 }
    GroupList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GroupView' }
        total: { type: integer, format: int64 }

    # ── 通用请求/结果（product + requirement 共用；03 §8.3） ──
    CommentRequest:
      type: object
      description: 仅带可选备注的动作请求体（close/activate/finish/terminate 等）
      properties:
        comment:
          type: [string, 'null']
    LinkRequest:
      type: object
      description: link/unlink 统一请求体（plan/release/build 三族同构）
      required: [objectType, ids]
      properties:
        objectType:
          type: string
          enum: [story, bug]
        ids:
          type: array
          items: { type: integer, format: int64 }
    BatchActionRequest:
      type: object
      description: 批量动作请求体（03 §1：ids + action + params；action=edit 时 params.rows=[{id,lockVersion,…}] 逐行应用——2026-09-19 A-03 定案）
      required: [ids, action]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
        action:
          type: string
          description: product ∈ close|activate|edit；story ∈ close|activate|assign|edit；bug/testCase ∈ confirm|resolve|activate|close|assign|edit|review（testCase）
        params:
          type: object
          additionalProperties: true
    BatchResultItem:
      type: object
      required: [id, ok]
      properties:
        id: { type: integer, format: int64 }
        ok: { type: boolean }
        error:
          type: [string, 'null']
    BatchActionResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/BatchResultItem' }
    BatchCreateResultItem:
      type: object
      required: [index, ok]
      properties:
        index: { type: integer }
        ok: { type: boolean }
        id:
          type: [integer, 'null']
          format: int64
        error:
          type: [string, 'null']
    BugView:
      type: object
      description: Bug 视图（quality 卡 §3.1 全字段）
      required: [id, productId, title, severity, priority, type, status, confirmed, activatedCount, lockVersion]
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        branchId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        executionId: { type: integer, format: int64 }
        planId:
          type: [integer, 'null']
          format: int64
        storyId:
          type: [integer, 'null']
          format: int64
        taskId:
          type: [integer, 'null']
          format: int64
        testCaseId:
          type: [integer, 'null']
          format: int64
        testRunId:
          type: [integer, 'null']
          format: int64
        title: { type: string, maxLength: 255 }
        keywords:
          type: [string, 'null']
          maxLength: 255
        severity: { type: integer, minimum: 1, maximum: 4 }
        priority: { type: integer, minimum: 1, maximum: 4 }
        type:
          type: string
          enum: [codeerror, config, install, security, performance, standard, automation, designdefect, others]
        os:
          type: [string, 'null']
        browser:
          type: [string, 'null']
        steps:
          type: [string, 'null']
        openedBuilds:
          type: [string, 'null']
          maxLength: 255
        status: { type: string, enum: [active, resolved, closed] }
        confirmed: { type: boolean }
        activatedCount: { type: integer, minimum: 0 }
        deadline:
          type: [string, 'null']
          format: date
        assignee:
          type: [string, 'null']
        assignedAt:
          type: [string, 'null']
          format: date-time
        resolution:
          type: [string, 'null']
          enum: [bydesign, duplicate, external, fixed, notrepro, postponed, willnotfix, tostory]
        resolvedBy:
          type: [string, 'null']
        resolvedAt:
          type: [string, 'null']
          format: date-time
        resolvedBuild:
          type: [string, 'null']
          maxLength: 90
        duplicateOfId:
          type: [integer, 'null']
          format: int64
        relatedBugIds:
          type: array
          items: { type: integer, format: int64 }
        notifyAccounts:
          type: array
          items: { type: string }
        closedBy:
          type: [string, 'null']
        closedAt:
          type: [string, 'null']
          format: date-time
        customFields:
          type: object
          additionalProperties: true
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
        lockVersion: { type: integer }
    BugList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BugView' }
        total: { type: integer, format: int64 }

    # ── product · 产品（product 卡 §3.1） ──
    ProductView:
      type: object
      required: [id, name, type, status, acl, whitelist, sort, lockVersion]
      properties:
        id: { type: integer, format: int64 }
        programId: { type: integer, format: int64 }
        name: { type: string, maxLength: 90 }
        code:
          type: [string, 'null']
          maxLength: 45
        type: { type: string, enum: [normal, branch, platform] }
        status: { type: string, enum: [normal, closed] }
        description:
          type: [string, 'null']
        po:
          type: [string, 'null']
        qd:
          type: [string, 'null']
        rd:
          type: [string, 'null']
        acl: { type: string, enum: [public, private, custom] }
        whitelist:
          type: array
          items: { type: string }
        sort: { type: integer }
        customFields:
          type: object
          additionalProperties: true
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
        closedAt:
          type: [string, 'null']
          format: date-time
        lockVersion: { type: integer }
    ProductCreateRequest:
      type: object
      required: [name]
      properties:
        programId:
          type: [integer, 'null']
          format: int64
        name: { type: string, maxLength: 90 }
        code:
          type: [string, 'null']
          maxLength: 45
        type:
          type: [string, 'null']
        po:
          type: [string, 'null']
        qd:
          type: [string, 'null']
        rd:
          type: [string, 'null']
        acl:
          type: [string, 'null']
        whitelist:
          type: [array, 'null']
          items: { type: string }
        description:
          type: [string, 'null']
        sort:
          type: [integer, 'null']
        customFields:
          type: [object, 'null']
          additionalProperties: true
    ProductUpdateRequest:
      type: object
      required: [lockVersion]
      properties:
        name:
          type: [string, 'null']
          maxLength: 90
        code:
          type: [string, 'null']
          maxLength: 45
        type:
          type: [string, 'null']
        programId:
          type: [integer, 'null']
          format: int64
        po:
          type: [string, 'null']
        qd:
          type: [string, 'null']
        rd:
          type: [string, 'null']
        acl:
          type: [string, 'null']
        whitelist:
          type: [array, 'null']
          items: { type: string }
        description:
          type: [string, 'null']
        sort:
          type: [integer, 'null']
        customFields:
          type: [object, 'null']
          additionalProperties: true
        lockVersion: { type: integer }
    ProductList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductView' }
        total: { type: integer, format: int64 }

    # ── product · 分支（product 卡 §3.2） ──
    BranchView:
      type: object
      required: [id, productId, name, isDefault, status, sort, lockVersion]
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        name: { type: string, maxLength: 255 }
        isDefault: { type: boolean }
        status: { type: string, enum: [active, closed] }
        description:
          type: [string, 'null']
          maxLength: 255
        sort: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
        closedAt:
          type: [string, 'null']
          format: date-time
        lockVersion: { type: integer }
    BranchCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        description:
          type: [string, 'null']
          maxLength: 255
        sort:
          type: [integer, 'null']
    BranchUpdateRequest:
      type: object
      required: [lockVersion]
      properties:
        name:
          type: [string, 'null']
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 255
        sort:
          type: [integer, 'null']
        lockVersion: { type: integer }
    BranchList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BranchView' }
        total: { type: integer, format: int64 }

    # ── product · 分类（product 卡 §3.3） ──
    CategoryView:
      type: object
      required: [id, productId, type, name, sort, lockVersion]
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        branchId: { type: integer, format: int64 }
        parentId: { type: integer, format: int64 }
        type: { type: string, enum: [story, bug, case] }
        name: { type: string, maxLength: 60 }
        owner:
          type: [string, 'null']
        sort: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
        lockVersion: { type: integer }
    CategoryCreateRequest:
      type: object
      required: [type, name]
      properties:
        branchId:
          type: [integer, 'null']
          format: int64
        parentId:
          type: [integer, 'null']
          format: int64
        type: { type: string, enum: [story, bug, case] }
        name: { type: string, maxLength: 60 }
        owner:
          type: [string, 'null']
        sort:
          type: [integer, 'null']
    CategoryUpdateRequest:
      type: object
      required: [lockVersion]
      properties:
        name:
          type: [string, 'null']
          maxLength: 60
        owner:
          type: [string, 'null']
        sort:
          type: [integer, 'null']
        parentId:
          type: [integer, 'null']
          format: int64
        lockVersion: { type: integer }
    CategoryList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CategoryView' }
        total: { type: integer, format: int64 }

    # ── product · 计划（product 卡 §3.4） ──
    PlanView:
      type: object
      required: [id, productId, title, status, lockVersion]
