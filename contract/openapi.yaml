        - name: role
          in: query
          description: 缺省 assignee；非法值 → 40001
          schema: { type: string, enum: [assignee, creator, reviewer, closer] }
        - name: sort
          in: query
          description: 透传 requirement 域 sortable 白名单
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: filters[status]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: filters[stage]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: filters[priority]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: filters[type]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
      responses:
        '200':
          description: 需求分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /my/activities:
    get:
      operationId: listMyActivities
      summary: 我的动态（actor=@me，游标分页倒序）
      tags: [workspace]
      parameters:
        - name: limit
          in: query
          description: 默认 50 上限 200
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: beforeId
          in: query
          description: 上一页末条 id
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 动态流（items + hasMore）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────── workspace · 周报与固定报表（workspace 卡 §5） ─────────────────────────
  /projects/{projectId}/weekly-reports:
    get:
      operationId: listWeeklyReports
      summary: 周报快照列表（仅已落库历史周，不触发重算）
      tags: [workspace]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序，白名单 weekStart
          schema: { type: string }
        - name: filters[weekStart]
          in: query
          description: 日期或区间；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
      responses:
        '200':
          description: 周报分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyReportList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/weekly-reports/current:
    get:
      operationId: getCurrentWeeklyReport
      summary: 指定周周报（date 传周内任意一天，缺省本周，归一到周一；读取时幂等重算并整行覆写）
      tags: [workspace]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: date
          in: query
          description: 周内任意一天 YYYY-MM-DD，缺省今天
          schema: { type: string, format: date }
      responses:
        '200':
          description: 周报视图（含 weekSN/weekEnd/analysis 与三张任务表）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyReportView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{productId}/reports/story-summary:
    get:
      operationId: getStorySummaryReport
      summary: 需求统计（按状态/优先级/阶段/类型分组，排除已删）
      tags: [workspace]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 需求统计报表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorySummaryReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{productId}/reports/bug-distribution:
    get:
      operationId: getBugDistributionReport
      summary: Bug 分布（按严重度/状态/解决方案分组，resolution 空计 unresolved 桶）
      tags: [workspace]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Bug 分布报表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BugDistributionReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /executions/{executionId}/reports/burn:
    get:
      operationId: getBurnReport
      summary: 燃尽报表（ideal 直线 + remaining 执行级日行；当日快照缺失先幂等落库）
      tags: [workspace]
      parameters:
        - name: executionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 燃尽报表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BurnReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /test-runs/{testRunId}/reports/case-pass-rate:
    get:
      operationId: getCasePassRateReport
      summary: 用例通过率（passRate = passed/(total−na)×100 两位小数，分母 0 → null）
      tags: [workspace]
      parameters:
        - name: testRunId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 用例通过率报表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasePassRateReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ZT_SESSION
      description: 会话 Cookie（`SessionResolver.COOKIE_NAME`）
  responses:
    BadRequest:
      description: 参数错误 / 未注册过滤排序字段（40001）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 未登录或会话过期（40101）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 无功能权限（40301）或不满足数据权限（40302）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 资源不存在（40401）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    LockConflict:
      description: 乐观锁冲突，lockVersion 不符（40901）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Validation:
      description: 字段校验失败（42201，fields 携带字段级错误）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    StateConflict:
      description: 当前状态不允许该动作（42202）或守卫条件不满足（42203）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Referenced:
      description: 被其他资源引用，禁止删除（42203）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  parameters:
    Page:
      name: page
      in: query
      description: 页码，从 1 开始（03 §3）；翻页深度 (page-1)*limit ≤ 10000，超限 40001 不钳制
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: 每页条数，默认 20 上限 200；?format=csv 全量导出上限 5000
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    ColumnPrefResource:
      name: resource
      in: path
      required: true
      description: 列设置的资源标识（列表页身份，如 quality-bugs）
      schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9-]+$' }

  schemas:
    DataEnvelope:
      type: object
      required: [data]
      properties:
        data:
          description: 任意单资源/聚合对象；200 响应直接引用载荷 schema，信封由 api-client 统一拆解
      description: 单资源信封基型（03 §2）。列表端点用 ListEnvelope，错误用 ErrorEnvelope。
    ListEnvelope:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: {}
        total:
          type: integer
          description: 总条数（满足筛选的全量）
          format: int64
      description: 列表信封基型（03 §2），三种形态——items+total = 默认（服务端分页，page/limit 翻页，total 为满足筛选的全量条数）；items+hasMore = 游标分页时间线（beforeId/limit 翻页，不给 total，全量 count 昂贵时用，见 ActivityList）；items = 小整树/全量快照（不分页不过滤，见 LangOverrideList）。新列表端点默认 items+total。
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          description: 错误体（code/message/fields/traceId）
          required: [code, message, traceId]
          properties:
            code:
              type: integer
              description: 5 位错误码（03 §4），段位即 HTTP 映射：40101 未登录/40301 无功能权限/40302 无数据权限/40401 不存在/40901 乐观锁/42201 字段校验/42202 状态不允许/42203 守卫不满足/42901 限流/50001 内部
            message:
              type: string
              description: 已按 Accept-Language 本地化的错误文案
            fields:
              type: object
              additionalProperties:
                type: string
              description: 仅 42201：字段级错误码，form-engine 直接消费
            traceId:
              type: string
              description: 链路追踪 id，与响应头 X-Trace-Id 一致

    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account:
          type: string
          description: 登录账号
          minLength: 1
          maxLength: 64
        password:
          type: string
          description: 口令
          minLength: 1
          maxLength: 64

    AccountView:
      type: object
      description: 账号响应视图（org 卡 §3.1 读侧；password 只写不读，任何端点不回显）
      required: [id, account, realName, gender, status, roleIds, fails, createdAt, lockVersion]
      properties:
        id:
          type: integer
          description: 主键 id
          format: int64
        account:
          type: string
          description: 登录账号
        realName:
          type: string
          description: 姓名
        nickname:
          type: [string, 'null']
          description: 昵称
          maxLength: 60
        roleIds:
          type: array
          description: 所属角色 id 集合（GET /roles 的 id；成员关系，权限码由角色决定）
          items: { type: integer, format: int64 }
        departmentId:
          type: [integer, 'null']
          description: 部门 id
          format: int64
        email:
          type: [string, 'null']
          description: 邮箱
          maxLength: 90
        mobile:
          type: [string, 'null']
          description: 手机号
          maxLength: 20
        phone:
          type: [string, 'null']
          description: 电话
          maxLength: 20
        gender:
          type: string
          description: 性别
          enum: [m, f]
        birthday:
          type: [string, 'null']
          description: 生日
          format: date
        joinedAt:
          type: [string, 'null']
          description: 入职日期
          format: date
        avatarFileId:
          type: [integer, 'null']
          description: 头像文件 id
          format: int64
        status:
          type: string
          description: 状态
          enum: [active, disabled]
        mustChangePassword:
          type: boolean
          readOnly: true
          description: 首登强制改密标记（06 A7-5，只读）：种子/迁移生成的初始口令为 true，本人改密成功后为 false；
            前端会话门禁据此把业务路由重定向到 /my/profile，后端不拦截请求
        fails:
          type: integer
          description: 连续登录失败次数（只读）
        lockedAt:
          type: [string, 'null']
          format: date-time
          description: 登录锁定时间（只读；10 分钟窗口自动解除）
        lastActiveAt:
          type: [string, 'null']
          description: 最近活跃时间
          format: date-time
        createdBy:
          type: [string, 'null']
          description: 创建人（登录账号）
        createdAt:
          type: string
          description: 创建时间
          format: date-time
        updatedBy:
          type: [string, 'null']
          description: 更新人（登录账号）
        updatedAt:
          type: [string, 'null']
          description: 更新时间
          format: date-time
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: 软删标记
        lockVersion:
          type: integer
          description: 乐观锁版本号（更新须回传，不符 → 40901）

    MeView:
      type: object
      description: 当前会话快照（03 §7）：前端权限显隐只认 privileges，真鉴权永远在后端；dictionaries 字段 2026-09-19 移除（恒空无消费者，C3 冻结登记）
      required: [account, privileges]
      properties:
        account:
          $ref: '#/components/schemas/AccountView'
          description: 登录账号
        privileges:
          type: array
          items:
            type: string
          description: 权限码数组（`<资源单数>-<动作>`，platform 卡 §7.1）

    # ── platform · 通知 ──
    NotificationView:
      type: object
      description: 站内通知（platform 卡 §3.4）
      required: [id, recipient, type, objectId, title, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        recipient: { type: string, description: "接收人（登录账号）" }
        type:
          type: string
          description: 通知事件码 `<资源单数>-<动作>`
        objectType:
          type: [string, 'null']
          description: 绑定对象类型
        objectId:
          type: integer
          format: int64
          description: 0=系统通知
        activityId:
          type: [integer, 'null']
          format: int64
          description: 点击跳转上下文
        title: { type: string, maxLength: 255, description: "通知标题" }
        content:
          type: [string, 'null']
          description: 通知内容
          maxLength: 2000
        readAt:
          type: [string, 'null']
          format: date-time
          description: null=未读
        createdBy: { type: string, description: "创建人（登录账号）" }
        createdAt: { type: string, format: date-time, description: "创建时间" }
    NotificationList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/NotificationView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }
    NotificationUnreadCountView:
      type: object
      required: [count]
      properties:
        count: { type: integer, format: int64, description: "条数" }

    # ── platform · 文件 ──
    FileView:
      type: object
      description: 附件（platform 卡 §3.5；path 内部列不进响应体）
      required: [id, title, url, extension, size, objectType, objectId, downloads, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        title: { type: string, maxLength: 255, description: "文件标题" }
        url:
          type: string
          description: = /files/{id}/download，编辑器插图用
        extension: { type: string, description: "文件扩展名" }
        size: { type: integer, format: int64, description: 字节 }
        objectType:
          type: string
          description: 空=未绑定对象
        objectId: { type: integer, format: int64, description: "绑定对象 id" }
        downloads: { type: integer, format: int64, description: "下载次数" }
        createdBy: { type: string, description: "创建人（登录账号）" }
        createdAt: { type: string, format: date-time, description: "创建时间" }
    FileList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/FileView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }

    # ── platform · 搜索 ──
    SearchResultItem:
      type: object
      description: 统一搜索结果项（platform 卡 §5.2）
      required: [objectType, objectId, title, updatedAt]
      properties:
        objectType: { type: string, description: "绑定对象类型" }
        objectId: { type: integer, format: int64, description: "绑定对象 id" }
        title: { type: string, description: "命中标题" }
        excerpt:
          type: [string, 'null']
          description: 搜索命中摘要
        updatedAt: { type: string, format: date-time, description: "更新时间" }
    SearchResultList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/SearchResultItem' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }

    # ── platform · meta / dicts ──
    MetaView:
      type: object
      description: 域元数据（03 §5）
      required: [domain, fields]
      properties:
        domain: { type: string, description: "meta 域（story/bug/task 等）" }
        fields:
          type: array
          description: 字段定义（meta 域字段表）
          items:
            type: object
            additionalProperties: true
        list:
          type: [object, 'null']
          additionalProperties: true
          description: 列表默认配置（defaultColumns 与 defaultSort）
        actions:
          type: [array, 'null']
          description: 动作目录，allowedStatus 与 workflow YAML 同源
          items:
            type: object
            additionalProperties: true
        statusVisuals:
          type: [object, 'null']
          description: 状态视觉配置（色码表）
          additionalProperties: true
    DictView:
      type: object
      description: 计算字典（platform 卡 §3.9）
      required: [name, items]
      properties:
        name: { type: string, description: "字典类型名称" }
        items:
          type: array
          description: 条目结构随 name 变化（accounts/departments/timezones/locales/privileges）
          items: { type: object, additionalProperties: true }

    # ── platform · settings / lang-items ──
    SettingView:
      type: object
      description: 设置键值映射（扁平键 `<domain>.<key>` → JSON 值）
      required: [settings]
      properties:
        settings:
          type: object
          description: 配置表（键 → 值）
          additionalProperties: true
    SettingsUpdateRequest:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          additionalProperties: true
          description: 批量写键值

    # ── platform · 参数管理（T15 P1-3） ──
    SettingEntryView:
      type: object
      description: 系统参数行（setting 表 owner=system 且 section=''；key 是扁平寻址串，与 GET /settings 的 keys 同形）
      required: [key, domain, itemKey, value]
      properties:
        key:
          type: string
          maxLength: 121
          description: 扁平键 `<domain>.<itemKey>`（寻址用；PATCH/DELETE 的路径段就是它）
          example: common.timezone
        domain:
          type: string
          description: 配置分组
          maxLength: 60
          example: common
        itemKey:
          type: string
          description: 配置项键
          maxLength: 60
          example: timezone
        value:
          type: [string, 'null']
          description: 参数值（JSON 文本，原样存原样出；读取方按 JSON 解析）
          example: '"Asia/Shanghai"'
    SettingEntryList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/SettingEntryView' }
        total:
          type: integer
          description: 总条数（满足筛选的全量）
          format: int64
          example: 12
    SettingEntryCreateRequest:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          maxLength: 121
          description: 扁平键 `<domain>.<key>`；domain 小写字母开头，两段各 ≤60 字符
          example: common.itemsPerPage
        value:
          type: string
          description: 参数值（合法 JSON 文本；字符串要带引号）
          example: '20'
    SettingEntryUpdateRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: 参数值（合法 JSON 文本；字符串要带引号）
          example: '50'

    # ── platform · 字典管理（T16 P1-4） ──
    DictTypeView:
      type: object
      description: 字典类型（dict_type 表；读取侧 GET /dicts/{code} 的第二来源）
      required: [code, name, status]
      properties:
        code:
          type: string
          maxLength: 60
          description: 字典名（读取侧的查询键，形如 demo-level；创建后不可改）
          example: demo-level
        name:
          type: string
          description: 字典类型名称
          maxLength: 60
          example: 演示等级
        status:
          type: string
          enum: [active, disabled]
          description: active = 可被 GET /dicts/{code} 读到；disabled = 停用
          example: active
    DictTypeList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/DictTypeView' }
        total:
          type: integer
          description: 总条数（满足筛选的全量）
          format: int64
          example: 3
    DictTypeRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          maxLength: 60
          description: 形如 `^[a-z][a-z0-9-]*$`；与内置字典名或已有类型重复 → 42201
          example: demo-level
        name:
          type: string
          description: 字典类型名称
          maxLength: 60
          example: 演示等级
        status:
          type: string
          description: 状态
          enum: [active, disabled]
          default: active
    DictTypeUpdateRequest:
      type: object
      required: []
      properties:
        name:
          type: string
          description: 字典类型名称
          maxLength: 60
        status:
          type: string
          description: 状态
          enum: [active, disabled]
    DictDataView:
      type: object
      description: 字典数据项（dict_data 表）
      required: [id, typeCode, itemLabel, itemValue, sortNo, status]
      properties:
        id:
          type: integer
          description: 主键 id
          format: int64
          example: 12
        typeCode:
          type: string
          description: 字典类型 code
          example: demo-level
        itemLabel:
          type: string
          description: 下拉里显示的字面文案（不是翻译键）
          example: 高
        itemValue:
          type: string
          description: 存储值（同类下唯一）
          example: high
        sortNo:
          type: integer
          description: 排序号（升序，越小越前）
          example: 10
        status:
          type: string
          description: 状态
          enum: [active, disabled]
          example: active
    DictDataList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/DictDataView' }
        total:
          type: integer
          description: 总条数（满足筛选的全量）
          format: int64
          example: 3
    DictDataUpdateRequest:
      type: object
      description: 数据项更新体：字段全可选，只改传了的
      required: []
      properties:
        itemLabel:
          type: string
          description: 字典项显示名
          maxLength: 120
        itemValue:
          type: string
          maxLength: 120
          description: 同类下唯一；重复 → 42201 fields.itemValue=duplicate
        sortNo:
          type: integer
          description: 排序号（升序，越小越前）
        status:
          type: string
          description: 状态
          enum: [active, disabled]
    DictDataRequest:
      type: object
      description: 数据项新建体
      required: [itemLabel, itemValue]
      properties:
        itemLabel:
          type: string
          description: 字典项显示名
          maxLength: 120
          example: 高
        itemValue:
          type: string
          maxLength: 120
          description: 同类下唯一；重复 → 42201 fields.itemValue=duplicate
          example: high
        sortNo:
          type: integer
          description: 排序号（升序，越小越前）
          default: 0
        status:
          type: string
          description: 状态
          enum: [active, disabled]
          default: active

    # ── platform · 服务监控（T17 P1-5） ──
    ServerMetricsView:
      type: object
      description: 单机负载快照（字节数为原始值，百分比由前端算；-1 = 该指标不可用）
      required: [cpuCores, cpuLoad, memoryTotalBytes, memoryUsedBytes, diskTotalBytes, diskUsedBytes, diskPath,
                 jvmHeapUsedBytes, jvmHeapMaxBytes, uptimeSeconds, sampledAt]
      properties:
        cpuCores:
          type: integer
          description: 可用处理器数
          example: 16
        cpuLoad:
          type: number
          format: double
          description: 系统当前 CPU 负载（0~1）；-1 = 该平台不可用
          example: 0.42
        memoryTotalBytes:
          type: integer
          format: int64
          description: 物理内存总量（字节）
          example: 17179869184
        memoryUsedBytes:
          type: integer
          format: int64
          description: 物理内存已用（字节）
          example: 8589934592
        diskTotalBytes:
          type: integer
          format: int64
          description: 工作目录所在盘总量（字节）
          example: 512110190592
        diskUsedBytes:
          type: integer
          format: int64
          description: 工作目录所在盘已用（字节）
          example: 128027547648
        diskPath:
          type: string
          description: 探测到的工作目录（单机部署下就是数据盘）
          example: D:\projects\zentao
        jvmHeapUsedBytes:
          type: integer
          format: int64
          description: 当前 JVM 堆已用（字节）
          example: 536870912
        jvmHeapMaxBytes:
          type: integer
          format: int64
          description: JVM 堆上限（字节）
          example: 4294967296
        uptimeSeconds:
          type: integer
          format: int64
          description: 本进程已运行秒数
          example: 86400
        sampledAt:
          type: string
          format: date-time
          description: 采样时间（页面据此显示「刚刚刷新」）
          example: '2026-09-21T06:00:00Z'

    # ── platform · 列设置（个人级偏好：列表页「列设置」的服务端持久化） ──
    ColumnPrefItem:
      type: object
      description: 一个列的设置项（数组顺序即展示顺序）
      required: [key, visible, fixed]
      properties:
        key:
          type: string
          maxLength: 64
          description: 列的稳定身份（与前端列 key/dataIndex 同值）
        visible:
          type: boolean
          description: 是否显示
        fixed:
          type: [string, 'null']
          enum: [left, right, null]
          description: 固定方向；不固定为 null
    MenuNode:
      type: object
      description: >-
        菜单树节点（目录/菜单/按钮同型）。节点身份是 `key`：组 `admin`、分区 `admin/system`、
        菜单 = 页面路径、按钮 = `页面key#权限码`、管理员新建的节点是 `db-<id>`。key 一经使用不可改，
        写端点按它寻址（见 `PATCH /menus` 的 `nodeKey` 查询参数）。
      required: [key, kind, title, orderNo, status, children]
      properties:
        key:
          type: string
          description: 节点身份键（自然键；管理员新建的节点 = db-<id>）
          example: /admin/menus
        kind:
          type: string
          enum: [group, section, item, button]
          description: 渲染类型：一级目录 / 组内目录 / 菜单 / 按钮（按钮只进管理面与授权树，不进侧栏）
        parentKey:
          type: [string, 'null']
          description: 上级节点 key；null = 一级模块
        title:
          type: string
          description: i18n 键或管理员填的字面文案；前端 t() 解析，缺键时原样显示
          example: platform.menu.title
        path:
          type: [string, 'null']
          description: 菜单项的路由路径（目录与按钮为 null）；T26 起它是**数据**，管理端可改
        component:
          type: [string, 'null']
          description: >-
            页面实现（组件名，如 RoleListPage）：代码所有，由节点的 `path` 从页面注册表自动匹配
            （GET /menus/page-registry），管理端不手选；目录与按钮恒为 null
        icon:
          type: [string, 'null']
          description: antd 图标名（目录与菜单可用；按钮与未设置时为 null）
        hidden:
          type: boolean
          description: 隐藏页（@hide 的详情/批量/编辑页）：进路由表与管理树，不进侧栏
        orderNo:
          type: integer
          description: 排序号（升序，越小越前）
          example: 4
        perm:
          type: [string, 'null']
          description: 可见/可达所需权限码；null = 人人可见
        status:
          type: string
          description: 状态
          enum: [active, disabled]
        children:
          type: array
          description: 子节点
          items: { $ref: '#/components/schemas/MenuNode' }
    MenuTree:
      type: object
      description: >-
        菜单树：目录/菜单/按钮同型。菜单节点的子级 = **该页面的按钮**（页面文件里 HasPerm 扫出来的
        + 权限编目按域归属的；T03 起按钮仍是代码派生——存在性随代码变化，标题/排序/状态可被同 key 的
        DB 行覆盖）+ **挂在它下面的隐藏页**（T03 起由 DB 行的 parent_key 表达），故「菜单管理」与
        「角色授权」看到的是同一棵完整树——按钮天然按页面归位。
      required: [items]
      properties:
        items:
          type: array
          description: 菜单节点列表（嵌套树）
          items: { $ref: '#/components/schemas/MenuNode' }
    PageRegistry:
      type: object
      description: 页面注册表（代码侧「有哪些页面」的清单，navigation.json 的 API 形态）
      required: [items]
      properties:
        items:
          type: array
          description: 页面条目（含 @hide 的隐藏页）
          items: { $ref: '#/components/schemas/PageRegistryEntry' }
    PageRegistryEntry:
      type: object
      description: 一个已注册页面：path 与 component 是代码侧的稳定对应关系
      required: [key, path, component, titleKey, hide]
      properties:
        key:
          type: string
          description: 页面 key（= path，与菜单节点的 key 一致）
          example: /admin/menus
        path:
          type: string
          description: 页面默认路径（菜单项的 path 可被管理端改，组件仍按注册表匹配）
          example: /admin/menus
        component:
          type: string
          description: 页面实现（组件名），前端路由按它取组件
          example: MenuListPage
        titleKey:
          type: string
          description: 页面标题的 i18n 键
          example: platform.menu.title
        perm:
          type: [string, 'null']
          description: 页面权限码（null = 登录即可）
        hide:
          type: boolean
          description: 是否隐藏页（@hide：详情/批量/编辑等上下文页，不进侧栏）
    RouteTable:
      type: object
      description: 前端路由表（T26 动态路由）：全部页面（含隐藏页）的 path/component/perm/activeMenu
      required: [items]
      properties:
        items:
          type: array
          description: 路由表条目
          items: { $ref: '#/components/schemas/RouteEntry' }
    RouteEntry:
      type: object
      description: 一条页面路由：path 是数据（可被管理端改），component 是代码实现
      required: [path, component, title, status, hidden]
      properties:
        path:
          type: string
          description: 路由路径（管理端可改；改了之后前端按新路径挂载同一个组件）
          example: /admin/roles
        component:
          type: string
          description: 页面实现（组件名）：前端从生成的组件表里按名取
          example: RoleListPage
        title:
          type: string
          description: i18n 键（内置页面）或字面文案（管理端覆盖过）
        perm:
          type: [string, 'null']
          description: 进入该页所需权限码（前端据此渲染 403 页；真鉴权在后端）
        activeMenu:
          type: [string, 'null']
          description: 隐藏页的菜单高亮目标（NULL = 不是隐藏页或未声明）
        status:
          type: string
          enum: [active, disabled]
          description: disabled 只让菜单项不进侧栏，页面仍可直达（与 MenuNode.status 同义）
        hidden:
          type: boolean
          description: 是否隐藏页（不进侧栏）
    MenuRequest:
      type: object
      description: 新建菜单节点（目录/菜单/按钮）
      required: [type, title]
      properties:
        parentKey:
          type: string
          maxLength: 255
          description: 上级节点 key；目录可空（= 一级模块），菜单挂组/分区，按钮挂菜单
        type:
          type: string
          enum: [dir, menu, button]
          description: 目录 / 菜单 / 按钮
        title:
          type: string
          maxLength: 120
          description: i18n 键或字面文案
        path:
          type: string
          maxLength: 255
          description: >-
            以 / 开头的路由路径，**仅菜单项可填且必填**：须命中页面注册表（未命中 → 42201 fields.path=unknown），
            服务端据此推导 `component`；目录/按钮填了也会被清空
        icon:
          type: string
          maxLength: 64
          description: antd 图标名（前端图标选择器给出可选集）
        orderNo:
          type: integer
          description: 同级排序，缺省 999
        perm:
          type: string
          maxLength: 64
          description: 权限码；须在权限编目内（未注册 → 42201 fields.perm=unknown）。按钮必填
        status:
          type: string
          description: 状态
          enum: [active, disabled]
    MenuUpdateRequest:
      type: object
      description: 菜单行更新体：字段全可选，只改传了的（path 传空串 = 清空，仅菜单项有意义）
      required: []
      properties:
        title:
          type: string
          description: 显示名称
          maxLength: 120
        component:
          type: string
          maxLength: 80
          description: 换一个页面实现（须在页面注册表里）；一般不用传——改 `path` 时服务端会按注册表重新匹配
        path:
          type: string
          maxLength: 255
          description: 路由路径（可改：菜单项指向另一个页面）
        icon:
          type: string
          maxLength: 64
          description: antd 图标名；传空串 = 清空
        orderNo:
          type: integer
          description: 排序号（升序，越小越前）
        perm:
          type: string
          description: 权限码
          maxLength: 64
        status:
          type: string
          description: 状态
          enum: [active, disabled]
    ColumnPrefView:
      type: object
      description: 某账号在某列表资源上的列设置（个人级；未设置时 columns 为 null）
      required: [resource, columns]
      properties:
        resource:
          type: string
          description: 资源标识（同请求路径参数）
        columns:
          type: [array, 'null']
          description: 列设置有序表；null = 未设置（前端用页面默认列）
          items:
            $ref: '#/components/schemas/ColumnPrefItem'
    ColumnPrefUpdateRequest:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          description: 整表覆盖（顺序即展示顺序；服务端按此顺序返回）
          items:
            $ref: '#/components/schemas/ColumnPrefItem'
    LangOverrideView:
      type: object
      description: 一条文案覆盖行（platform 卡 §3.12；key 为全点分键，lang/domain/section 为存储拆分）
      required: [lang, domain, section, key, value]
      properties:
        lang: { type: string, description: "语言代码" }
        domain: { type: string, description: "文案域" }
        section: { type: string, description: "文案分区（zh.common 这类前缀）" }
        key:
          type: string
          description: 全点分键（= domain + '.' + 其余段；与语言包键同形）
        value: { type: string, description: "覆盖文案" }
    LangOverrideList:
      type: object
      description: 某语言的覆盖层全量（不分页、无过滤；前端运行时合并，见 platform 卡 §3.12）
      required: [items]
      properties:
        items:
          type: array
          description: 覆盖层条目（全量快照，不分页）
          items: { $ref: '#/components/schemas/LangOverrideView' }
    LangImportView:
      type: object
      description: 语言包上传记录（platform 卡 §3.12；失败也留痕，message 存校验失败摘要）
      required: [id, lang, fileName, totalRows, appliedRows, failedRows, status, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        lang:
          type: string
          description: 新记录恒 `all`（T05 单文件全语言，语言由文件列头决定）；历史行仍为 zh-cn/en
        fileName: { type: string, description: "原始文件名" }
        totalRows:
          type: integer
          format: int32
          description: 文件数据行数（不含表头）
        appliedRows:
          type: integer
          format: int32
          description: 实际落覆盖的行数（校验失败为 0）
        failedRows:
          type: integer
          format: int32
          description: 未通过校验的行数
        status:
          type: string
          description: 状态
          enum: [success, failed]
        createdBy: { type: string, description: "创建人（登录账号）" }
        createdAt: { type: string, format: date-time, description: "创建时间" }
        message:
          type: [string, 'null']
          description: 校验失败摘要（成功为 null）
        lockVersion: { type: integer, format: int32, description: "乐观锁版本号（更新须回传，不符 → 40901）" }
    LangImportList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/LangImportView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }

    # ── platform · 审计日志 ──
    AuditLogView:
      type: object
      description: 审计日志行（B1 §H3 / T04 审计 2.0；只读，无写端点——行由写请求的审计横切追加）
      required: [id, action, category, result, createdAt]
      properties:
        id:
          type: integer
          description: 主键 id
          format: int64
          example: 1024
        account:
          type: [string, 'null']
          maxLength: 64
          description: 操作人账号；无会话主体的动作（如登录失败）为 null
          example: admin
        action:
          type: string
          maxLength: 64
          description: 动作名（@Audit 声明值或「HTTP 方法 + 路由」推导值）
          example: account-create
        category:
          type: string
          description: 操作分类（9 类；动作到分类的映射由 AuditCatalog 声明，未登记动作回落 business）
          enum: [auth, perm, config, business, batch, export, sensitive, query, approve]
          example: perm
        result:
          type: string
          description: 结果；fail 行带 reason（失败原因或错误码）
          enum: [success, fail, denied]
          example: success
        reason:
          type: [string, 'null']
          maxLength: 255
          description: 失败/拒绝原因（result=fail|denied 时有值，来自错误文案或异常名）
          example: 账号或密码错误
        objectType:
          type: [string, 'null']
          description: 绑定对象类型
          maxLength: 64
          example: account
        objectId:
          type: [integer, 'null']
          description: 绑定对象 id
          format: int64
          example: 42
        batchId:
          type: [integer, 'null']
          description: 批次 id（批量/导出类动作共享；非批量动作为 null）
          format: int64
          example: 9001
        detail:
          type: [string, 'null']
          description: 动作明细：写路径记「HTTP 方法 + 实际 URI」（按 key 寻址的写端点带查询串）
          example: 'PATCH /api/v1/products/42'
        ip:
          type: [string, 'null']
          description: 来源 IP
          maxLength: 64
          example: 10.0.0.7
        ua:
          type: [string, 'null']
          maxLength: 255
          description: User-Agent 原文（截断至 255）
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0.0.0 Safari/537.36
        device:
          type: [string, 'null']
          maxLength: 64
          description: UA 摘要（浏览器 + 操作系统，朴素识别；MFA 位预留）
          example: Chrome / Windows
        mfa:
          type: [string, 'null']
          maxLength: 32
          description: 多因素认证方式（预留，T34 启用；当前恒 null）
          example: totp
        traceId:
          type: [string, 'null']
          maxLength: 64
          description: 链路 id（同响应头 X-Trace-Id），可与服务日志/APM 关联
          example: 4f2a1c9d8b7e6a5f
        createdAt:
          type: string
          description: 创建时间（秒精度，与库列 TIMESTAMP 一致）
          format: date-time
          example: '2026-09-20T10:15:30Z'
    AuditLogList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/AuditLogView' }
        total:
          type: integer
          description: 总条数（满足筛选的全量）
          format: int64
          example: 128
    AuditChange:
      type: object
      required: [field]
      description: 字段级变更（@AuditDiff 采集；敏感字段值掩码为 ***）
      properties:
        field:
          type: string
          description: 字段名（对象上的属性名）
          example: status
        before:
          type: [string, 'null']
          description: 变更前值（JSON 文本；新增字段为 null）
          example: '"draft"'
        after:
          type: [string, 'null']
          description: 变更后值（JSON 文本；删除字段为 null）
          example: '"published"'
    AuditLogDetail:
      type: object
      required: [id, action, category, result, createdAt]
      description: 审计日志行详情（含 changes/snapshot/extra；列表不带这三者）
      properties:
        id:
          type: integer
          description: 主键 id
          format: int64
          example: 1024
        account:
          type: [string, 'null']
          maxLength: 64
          description: 操作人账号
          example: admin
        action:
          type: string
          maxLength: 64
          description: 动作名
          example: account-create
        category:
          type: string
          description: 操作分类
          enum: [auth, perm, config, business, batch, export, sensitive, query, approve]
          example: perm
        result:
          type: string
          description: 结果
          enum: [success, fail, denied]
          example: success
        reason:
          type: [string, 'null']
          maxLength: 255
          description: 失败/拒绝原因
          example: 账号或密码错误
        objectType:
          type: [string, 'null']
          description: 绑定对象类型
          maxLength: 64
          example: account
        objectId:
          type: [integer, 'null']
          description: 绑定对象 id
          format: int64
          example: 42
        batchId:
          type: [integer, 'null']
          description: 批次 id
          format: int64
          example: 9001
        detail:
          type: [string, 'null']
          description: 动作明细
          example: 'PATCH /api/v1/products/42'
        changes:
          type: [array, 'null']
          description: 字段级 diff（@AuditDiff 采集；未采集为 null）
          items: { $ref: '#/components/schemas/AuditChange' }
        snapshot:
          type: [string, 'null']
          description: 完整快照 JSON（审批/发布类；未采集为 null）
          example: '{"status":"draft"}'
        extra:
          type: [string, 'null']
          description: 动作自定义补充 JSON（如导出条数/文件哈希；未采集为 null）
          example: '{"rows":128}'
        ip:
          type: [string, 'null']
          description: 来源 IP
          maxLength: 64
          example: 10.0.0.7
        ua:
          type: [string, 'null']
          maxLength: 255
          description: User-Agent 原文
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0.0.0 Safari/537.36
        device:
          type: [string, 'null']
          maxLength: 64
          description: UA 摘要（浏览器 / 操作系统）
          example: Chrome / Windows
        mfa:
          type: [string, 'null']
          maxLength: 32
          description: 多因素认证方式（预留，当前恒 null）
          example: totp
        traceId:
          type: [string, 'null']
          maxLength: 64
          description: 链路 id
          example: 4f2a1c9d8b7e6a5f
        prevHash:
          type: [string, 'null']
          maxLength: 64
          description: 前一行的链哈希（V43 之前的历史行为 null）
          example: 9f2c…（64 位十六进制）
        hash:
          type: [string, 'null']
          maxLength: 64
          description: 本行链哈希 sha256(prev_hash + 规范序列化)（V43 之前的历史行为 null）
          example: 7ab3…（64 位十六进制）
        createdAt:
          type: string
          description: 创建时间
          format: date-time
          example: '2026-09-20T10:15:30Z'
    AuditVerifyResult:
      type: object
      required: [valid, scanned, unhashedPrefix, scanLimitReached]
      description: 哈希链校验结果（T04；逐行重算，首处不一致即 valid=false）
      properties:
        valid:
          type: boolean
          description: 扫描区间内链是否自洽（无哈希的历史前缀不计）
          example: true
        scanned:
          type: integer
          description: 本次实际校验的行数
          format: int64
          example: 1024
        unhashedPrefix:
          type: integer
          description: 无 hash 的历史行数（V43 之前写入，不参与校验）
          format: int64
          example: 37
        brokenId:
          type: [integer, 'null']
          description: 首处断链的行 id（valid=true 时为 null）
          format: int64
          example: 1024
        checkedFrom:
          type: [integer, 'null']
          description: 本次校验的起始行 id（无行可校验时为 null）
          format: int64
          example: 900
        checkedTo:
          type: [integer, 'null']
          description: 本次校验的结束行 id（无行可校验时为 null）
          format: int64
          example: 1024
        scanLimitReached:
          type: boolean
          description: 是否因 maxRows 截断（true 时用 checkedTo+1 作为下次 fromId 续扫）
          example: false
    AuditQueryStatView:
      type: object
      required: [id, account, resource, day, count, totalMs]
      description: 查询聚合行（account+resource+day 唯一；count 次数 / totalMs 累计耗时）
      properties:
        id:
          type: integer
          description: 主键 id
          format: int64
          example: 512
        account:
          type: string
          maxLength: 64
          description: 账号
          example: admin
        resource:
          type: string
          maxLength: 64
          description: 资源（请求路径首段，如 products）
          example: products
        day:
          type: string
          description: 聚合日期（UTC）
          format: date
          example: '2026-09-20'
        count:
          type: integer
          description: 当日该模块的查询次数
          format: int64
          example: 128
        totalMs:
          type: integer
          description: 当日该模块的累计耗时（毫秒）
          format: int64
          example: 4096
    AuditQueryStatList:
      type: object
      required: [items, total]
      description: 查询聚合分页列表（T04）
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/AuditQueryStatView' }
        total:
          type: integer
          description: 总条数（满足筛选的全量）
          format: int64
          example: 12

    # ── platform · 在线用户（T13 P1-1） ──
    OnlineUserView:
      type: object
      description: 在线会话行（session 表现存行；id 是 token 的 sha256，cookie 凭据不出网）
      required: [id, account, current]
      properties:
        id:
          type: string
          maxLength: 64
          description: 会话对外 id（token 的 sha256，64 位 hex）；强退端点收的就是它
          example: 9f2a4c7e1b8d05a3f6e2c9b4d7a10f385c6e9b2d4a7f01c385e6b9d2a4f7c01e3
        account:
          type: string
          description: 登录账号
          maxLength: 64
          example: admin
        ip:
          type: [string, 'null']
          maxLength: 45
          description: 建立会话时的来源 IP（IPv6 最长 45）
          example: 10.0.0.7
        userAgent:
          type: [string, 'null']
          description: 客户端 UA
          maxLength: 255
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
        createdAt:
          type: string
          format: date-time
          description: 会话建立（登录）时间
          example: '2026-09-21T02:10:00Z'
        lastSeenAt:
          type: string
          format: date-time
          description: 最后活动时间（SessionResolver touch 滑动续期，距上次写库 >1h 才更新）
          example: '2026-09-21T04:12:30Z'
        expiresAt:
          type: string
          format: date-time
          description: 会话过期时间（滑动续期，且受 max-lifetime 绝对上限截断）
          example: '2026-09-28T02:10:00Z'
        current:
          type: boolean
          description: 是否请求者自己那条会话（页面据此不给强退入口）
          example: false
    OnlineUserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/OnlineUserView' }
        total:
          type: integer
          description: 总条数（满足筛选的全量）
          format: int64
          example: 3

    # ── platform · 评论 / 动态流 ──
    CommentView:
      type: object
      description: 评论（platform 卡 §3.3）
      required: [id, objectType, objectId, content, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        objectType: { type: string, description: "绑定对象类型" }
        objectId: { type: integer, format: int64, description: "绑定对象 id" }
        content: { type: string, maxLength: 10000, description: "评论内容" }
        createdBy: { type: string, description: "创建人（登录账号）" }
        createdAt: { type: string, format: date-time, description: "创建时间" }
    CommentCreateRequest:
      type: object
      required: [objectType, objectId, content]
      properties:
        objectType: { type: string, description: "绑定对象类型" }
        objectId: { type: integer, format: int64, description: "绑定对象 id" }
        content: { type: string, minLength: 1, maxLength: 10000, description: "评论内容（必填，非空）" }
    CommentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/CommentView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }
    ActivityView:
      type: object
      description: 动态流（platform 卡 §3.2）
      required: [id, objectType, objectId, actor, action, occurredAt]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        objectType: { type: string, description: "绑定对象类型" }
        objectId: { type: integer, format: int64, description: "绑定对象 id" }
        actor: { type: string, description: "操作者账号" }
        action: { type: string, maxLength: 64, description: "动作码" }
        detail:
          type: [array, 'null']
          description: 编辑类动作字段 diff [{field, oldValue, newValue}]
          items: { type: object, additionalProperties: true }
        remark:
          type: [string, 'null']
          description: 备注
        occurredAt: { type: string, format: date-time, description: "发生时间" }
    ActivityList:
      type: object
      description: 游标分页时间线（03 §3：items + hasMore，倒序）
      required: [items, hasMore]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/ActivityView' }
        hasMore: { type: boolean, description: "是否还有更早的（游标分页）" }

    # ── org · 账号请求 ──
    AccountCreateRequest:
      type: object
      description: 创建账号（org 卡 §3.1 写侧）
      required: [account, password, realName]
      properties:
        account:
          type: string
          description: 登录账号
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9._-]+$'
        password:
          type: string
          description: 口令
          minLength: 6
          maxLength: 64
        realName:
          type: string
          description: 姓名
          minLength: 1
          maxLength: 100
        nickname:
          type: [string, 'null']
          description: 昵称
          maxLength: 60
        departmentId:
          type: [integer, 'null']
          description: 部门 id
          format: int64
        email:
          type: [string, 'null']
          description: 邮箱
          maxLength: 90
        mobile:
          type: [string, 'null']
          description: 手机号
          maxLength: 20
        phone:
          type: [string, 'null']
          description: 电话
          maxLength: 20
        gender:
          type: [string, 'null']
          description: 性别
          enum: [m, f, null]
        birthday:
          type: [string, 'null']
          description: 生日
          format: date
        joinedAt:
          type: [string, 'null']
          description: 入职日期
          format: date
        avatarFileId:
          type: [integer, 'null']
          description: 头像文件 id
          format: int64
        roleIds:
          type: array
          description: 初始角色 id 集合（不存在的 id → 42201）
          items: { type: integer, format: int64 }
    AccountUpdateRequest:
      type: object
      description: 部分更新（account 字段不可出现；null=不修改）
      required: [lockVersion]
      properties:
        realName:
          type: [string, 'null']
          description: 姓名
          maxLength: 100
        nickname:
          type: [string, 'null']
          description: 昵称
          maxLength: 60
        departmentId:
          type: [integer, 'null']
          description: 部门 id
          format: int64
        email:
          type: [string, 'null']
          description: 邮箱
          maxLength: 90
        mobile:
          type: [string, 'null']
          description: 手机号
          maxLength: 20
        phone:
          type: [string, 'null']
          description: 电话
          maxLength: 20
        gender:
          type: [string, 'null']
          description: 性别
          enum: [m, f, null]
        birthday:
          type: [string, 'null']
          description: 生日
          format: date
        joinedAt:
          type: [string, 'null']
          description: 入职日期
          format: date
        avatarFileId:
          type: [integer, 'null']
          description: 头像文件 id
          format: int64
        roleIds:
          type: [array, 'null']
          description: 全量替换的角色 id 集合（null=不修改；不存在的 id → 42201）
          items: { type: integer, format: int64 }
        lockVersion:
          type: integer
          description: 乐观锁版本号（更新须回传，不符 → 40901）
    AccountPasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, minLength: 1, maxLength: 64, description: "当前口令" }
        newPassword: { type: string, minLength: 6, maxLength: 64, description: "新口令" }
    AccountResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, minLength: 6, maxLength: 64, description: "新口令" }
    AccountActionRequest:
      type: object
      description: disable/enable 动作通用请求体（comment 可省；删除动作走 DELETE /accounts/{accountId}）
      required: []
      properties:
        comment:
          type: [string, 'null']
          description: 备注（可省，记入动态流）
    AccountBatchCreateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 待创建账号（≤50，逐项部分成功）
          maxItems: 50
          items: { $ref: '#/components/schemas/AccountCreateRequest' }
    AccountBatchCreateResult:
      type: object
      description: 批量创建逐项结果（org 卡 §5）
      required: [results]
      properties:
        results:
          type: array
          description: 逐项结果
          items:
            type: object
            required: [index, ok]
            properties:
              index: { type: integer }
              ok: { type: boolean }
              id:
                type: [integer, 'null']
                format: int64
              error:
                type: [string, 'null']
    AccountList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/AccountView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }

    # ── org · 部门 ──
    DepartmentNode:
      type: object
      description: 部门节点（org 卡 §3.2；path/grade 服务端维护只读；平铺列表端点复用本 schema，children 恒空数组）
      required: [id, name, path, grade, sort, children]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        name: { type: string, maxLength: 60, description: "部门名称" }
        parentId:
          type: [integer, 'null']
          description: 父节点 id（0 或空=顶级）
          format: int64
        parentName:
          type: [string, 'null']
          description: 上级部门名（服务端按 parent_id 一次映射解析；根部门为 null）
        path:
          type: string
          description: 逗号包裹 id 链（,1,3,8,）
        grade:
          type: integer
          description: 层级，根=1
        sort: { type: integer, description: "排序值（升序，越小越前）" }
        manager:
          type: [string, 'null']
          description: 负责人（登录账号）
        children:
          type: array
          description: 子节点
          items: { $ref: '#/components/schemas/DepartmentNode' }
    DepartmentTree:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 部门节点列表（嵌套树）
          items: { $ref: '#/components/schemas/DepartmentNode' }
    DepartmentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/DepartmentNode' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }
    DepartmentCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: "部门名称" }
        parentId:
          type: [integer, 'null']
          description: 父节点 id（0 或空=顶级）
          format: int64
        sort: { type: integer, minimum: 0, description: "排序值（升序，越小越前）" }
        manager:
          type: [string, 'null']
          description: 负责人（登录账号）
    DepartmentUpdateRequest:
      type: object
      description: 重命名/移动/改负责人（null=不修改）
      required: []
      properties:
        name:
          type: [string, 'null']
          description: 部门名称
          maxLength: 60
        parentId:
          type: [integer, 'null']
          description: 父节点 id（0 或空=顶级）
          format: int64
        sort:
          type: [integer, 'null']
          description: 排序值（升序，越小越前）
          minimum: 0
        manager:
          type: [string, 'null']
          description: 负责人（登录账号）
        lockVersion: { type: integer, description: "乐观锁版本号（更新须回传，不符 → 40901）" }
    DepartmentTreeSaveRequest:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          description: 节点列表（整树保存）
          items:
            type: object
            required: [name]
            properties:
              id:
                type: [integer, 'null']
                format: int64
                description: 无 id = 新增节点
              parentId:
                type: [integer, 'null']
                format: int64
              name: { type: string, minLength: 1, maxLength: 60 }
              sort: { type: integer, minimum: 0 }
              manager:
                type: [string, 'null']

    # ── org · 角色（T23 统一实体）──
    RoleView:
      type: object
      description: >-
        角色（统一实体）：一个角色 = 权限码 + 成员 + 数据权限。`builtin` 的角色不可删除
        （超管角色 id=1 与迁移来的岗位角色）；`code` 是可选稳定标识，创建后不可改。
      required: [id, name, acl, memberCount, privilegeCount, builtin, sort, createdAt, lockVersion]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        code:
          type: [string, 'null']
          maxLength: 32
          description: 可选稳定标识（小写字母/数字/连字符）；迁移来的岗位角色带码，新建角色可空
        name: { type: string, maxLength: 60, description: "角色名称" }
        description:
          type: [string, 'null']
          description: 描述
          maxLength: 255
        acl:
          $ref: '#/components/schemas/RoleAcl'
          description: 访问控制（可见范围策略）
        memberCount: { type: integer, format: int64, description: 成员账号数（实时统计） }
        privilegeCount: { type: integer, format: int64, description: 权限码数（实时统计） }
        builtin: { type: boolean, description: 内置角色（不可删除） }
        sort: { type: integer, description: 升序展示位 }
        createdBy:
          type: [string, 'null']
          description: 创建人（登录账号）
        createdAt: { type: string, format: date-time, description: "创建时间" }
        updatedBy:
          type: [string, 'null']
          description: 更新人（登录账号）
        updatedAt:
          type: [string, 'null']
          description: 更新时间
          format: date-time
        lockVersion: { type: integer, description: "乐观锁版本号（更新须回传，不符 → 40901）" }
    RoleList:
      type: object
      description: 角色列表（角色是配置级小列表，不分页、全量返回）
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/RoleView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }
    RoleCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: "角色名称" }
        code:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[a-z][a-z0-9-]*$'
          description: 可选稳定标识（小写字母开头，字母/数字/连字符）；留空表示这个角色不对外暴露码
        description:
          type: [string, 'null']
          description: 描述
          maxLength: 255
    RoleUpdateRequest:
      type: object
      description: 部分更新（03 §1 null=不修改）；code 创建后不可改（传入不同值 → 42201）
      required: [lockVersion]
      properties:
        name:
          type: [string, 'null']
          description: 角色名称
          maxLength: 60
        code:
          type: [string, 'null']
          description: 只允许原值；改角色码等于换了个角色，故不接受新值
        description:
          type: [string, 'null']
          description: 描述
          maxLength: 255
        acl:
          $ref: '#/components/schemas/RoleAcl'
          description: null=不修改；传对象=整体替换（PATCH null 语义见 03 §1）
        sort:
          type: [integer, 'null']
