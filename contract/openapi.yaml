  # ───────────────────────── workspace · 待办（workspace 卡 §5 /todos 族） ─────────────────────────
  /todos:
    get:
      operationId: listTodos
      summary: 我的待办列表（强制归属：assignee/finishedBy/closedBy = @me；DataScope 见 §7）
      tags: [workspace]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序，白名单 id/date/priority/beginTime/createdAt
          schema: { type: string }
        - name: filters[status]
          in: query
          description: wait|doing|done|closed
          schema: { type: string }
        - name: filters[type]
          in: query
          description: custom|bug|task|story|epic|requirement|testRun
          schema: { type: string }
        - name: filters[priority]
          in: query
          description: 1|2|3|4
          schema: { type: string }
        - name: filters[date]
          in: query
          description: 日期或区间；@null 取待定日期
          schema: { type: string }
        - name: filters[assignee]
          in: query
          description: 账号 / @me / @null
          schema: { type: string }
        - name: filters[createdBy]
          in: query
          schema: { type: string }
        - name: filters[isPrivate]
          in: query
          description: 1/0
          schema: { type: string }
        - name: filters[id]
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: LIKE title
          schema: { type: string }
      responses:
        '200':
          description: 待办分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createTodo
      summary: 创建待办（assignee 缺省当前账号；type≠custom 时 objectId 必填）
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoCreateRequest' }
      responses:
        '200':
          description: 待办视图（含现算 objectTitle）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

