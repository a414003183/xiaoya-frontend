          description: 项目名称
          maxLength: 90
        code:
          type: [string, 'null']
          description: 编码（业务唯一标识）
          maxLength: 45
        model:
          type: [string, 'null']
          description: 项目模型（scrum/waterfall/kanban）
          enum: [scrum, waterfall, kanban, null]
        beginDate:
          type: [string, 'null']
          description: 开始日期
          format: date
        endDate:
          type: [string, 'null']
          description: 结束日期
          format: date
        days:
          type: [integer, 'null']
          description: 工期天数
          minimum: 0
          maximum: 3650
        budget:
          type: [number, 'null']
          description: 预算
          minimum: 0
        pm:
          type: [string, 'null']
          description: 项目经理（登录账号）
        po:
          type: [string, 'null']
          description: 产品负责人（登录账号）
        qd:
          type: [string, 'null']
          description: 测试负责人（登录账号）
        rd:
          type: [string, 'null']
          description: 研发负责人（登录账号）
        acl:
          type: [string, 'null']
          description: 访问控制（可见范围策略）
          enum: [open, private, program, null]
        whitelist:
          type: [array, 'null']
          description: 白名单（自定义可见集）
          items: { type: string }
        description:
          type: [string, 'null']
          description: 描述
        sort:
          type: [integer, 'null']
