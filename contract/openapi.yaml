  # ───────────────────────── org · 人员管理（org 卡 §5 Personnel 节，无表只读聚合） ─────────────────────────
  /personnel/members:
    get:
      operationId: listPersonnelMembers
      summary: 全公司成员视图（启用账号 + 在办任务数/未解决 Bug 数，跨域经 TaskApi/BugApi 计数）
      tags: [org]
      parameters:
        - name: filters[departmentId]
          in: query
          description: 部门过滤（含后代部门）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[account]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: q
          in: query
          description: LIKE realName/account
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成员分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonnelMemberList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /personnel/workload:
    get:
      operationId: listPersonnelWorkload
      summary: 工作量统计（filters[departmentId] 含后代展开 + filters[date] 必填区间；按人聚合 consumedHours 与完成任务数）
      tags: [org]
      parameters:
        - name: filters[departmentId]
          in: query
          description: 部门过滤（含后代部门）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[date]
          in: query
          description: 必填区间 a..b（YYYY-MM-DD..YYYY-MM-DD）；缺失或起止倒置 → 40001；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: sort
          in: query
          description: 排序，白名单 consumedHours/finishedTaskCount/account（缺省 -consumedHours）
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 工作量分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonnelWorkloadList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

