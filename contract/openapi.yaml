  # ───────────────────────── platform · 服务监控（T17 P1-5） ─────────────────────────
  /monitor/server:
    get:
      operationId: getServerMetrics
      summary: 单机负载快照（CPU / 内存 / 磁盘 + JVM 堆与运行时长）
      description: >-
        聚合端点：后端直读 JDK 的 OperatingSystemMXBean 与 FileStore，**不直暴露 actuator**
        （actuator 只开了 health/info）。拿不到的指标给 -1（如部分平台没有 CPU 负载实现），
        页面据此显示「—」而不是 0（ 0 会被误读成空闲）。
      tags: [platform]
      responses:
        '200':
          description: 负载快照（采样时间在 `sampledAt`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMetricsView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 monitor-view（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ───────────────────────── platform · 菜单管理（T03：菜单纯 DB 化，ADR-001） ─────────────────────────
  # 菜单**唯一数据源是 menu 表**：内置基线整树由 Flyway 迁移（V42__menu_seed）从页面注册表播种入库，
  # 此后增删改一律走 DB——没有「覆盖行」语义（T03 之前是「代码基线 + DB 覆盖」合并，已废除）。
  # 页面注册表 backend/src/main/resources/menu/navigation.json（tools/route-codegen.mjs 生成，与 routes.tsx
  # 同源同批）退居二线，只用于：① /menus/routes 补隐藏页；② 菜单表单按 path 自动匹配 component；
  # ③ 按钮节点的**存在性**（按钮是代码派生的：页面文件 HasPerm 扫描 + 权限编目按域归属，见下）。
  # 层级最多三级（组 →（分区 →）菜单），按钮挂菜单下；关闭的菜单不拦截页面访问（页面路由是代码生成的）。
  # 寻址：写端点按 nodeKey 走**查询参数**——页面 key 就是它的 path（含 `/`）、按钮 key 含 `#`，都进不了路径段。
  /menus/tree:
    get:
      operationId: listMenus
      summary: 菜单树（纯 DB 的管理视图，不按权限过滤）
      description: >-
        管理视图：直接读 `menu` 表整树（含停用、隐藏页、按钮节点）。每行都是可编辑/可删除的普通数据行，
        没有「内置节点」与「覆盖行」之分。按钮节点的存在性仍来自代码（见 `MenuNode.kind`），
        其标题/排序/状态可被同 key 的 DB 行覆盖。
      tags: [platform]
      responses:
        '200':
          description: 合并后的菜单树
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuTree'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 menu-manage（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /menus:
    post:
      operationId: createMenu
      summary: 新建菜单节点（目录/菜单/按钮）
      description: >-
        `type` + `title` 必填，目录的 `parentKey` 可空（= 一级模块）。菜单项（`type=menu`）的 `path` 必须命中
        页面注册表里的页面——服务端据此推导 `component`（页面实现是代码，不能手选）；目录与按钮不需要 path。
        改已有节点走 PATCH；没有「覆盖行」，也没有 key 入口（页面节点的 key 就是 path，由服务端推导）。
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuRequest'
      responses:
        '200':
          description: 新建/覆盖后的菜单行（以合并视图的节点形式返回）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuNode'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 menu-manage（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: >-
            title/type/path 缺失或非法、path 不在页面注册表里（fields.path=unknown）、
            parentKey 不存在或层级不合法、perm 未注册（按钮必须给）、状态值非法
            （42201，fields.title|type|path|parentKey|perm|status）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateMenu
      summary: 改菜单行（标题/路径/图标/排序/权限码/状态）
      description: >-
        身份是 node_key，走查询参数 `nodeKey`——**不能**放路径段：页面节点的 key 就是它的 path（含 `/`），
        路径里的 `%2F` 会被 Tomcat 直接 400（实测），按钮 key 里的 `#` 在路径里是 fragment 分隔符。
        传了的字段才改；`path` 传空串 = 清空（仅菜单项有意义，目录/按钮的 path 恒为空）。
        改 `path` 时组件按新 path 重新匹配注册表（未命中则保留原组件）。
      tags: [platform]
      parameters:
        - name: nodeKey
          in: query
          required: true
          description: 目标节点的 key（自然键，URL 编码后传）
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuUpdateRequest'
      responses:
        '200':
          description: 更新后的菜单行（树节点形式）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuNode'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 menu-manage（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 菜单行不存在（40401）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: title/path/icon/perm 非法、path 不在页面注册表里或状态值非法（42201，fields.title|path|icon|perm|status）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteMenu
      summary: 删菜单行（该项连子孙一起删）
      description: >-
        身份同样走查询参数 `nodeKey`。删除即真删（`menu` 表没有 deleted_at/lock_version，是物理删除）：
        节点及其全部子孙（按钮/隐藏页）一起消失；页面节点被删后，其权限码不再出现在树上
        （角色授权里的旧码自然失效、不报错）。删除规则细化（有子节点拒绝 42203 等）归 T07。
      tags: [platform]
      parameters:
        - name: nodeKey
          in: query
          required: true
          description: 目标节点的 key（自然键，URL 编码后传）
          schema: { type: string, maxLength: 255 }
      responses:
        '200':
          description: 已删除（该项及其子孙从树上消失），data 为 null（api-client 拆解后载荷为 null）
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 menu-manage（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 菜单行不存在（40401）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': { $ref: '#/components/responses/Referenced' }

  # ───────────────────────── platform · 角色授权用的菜单树（T22） ─────────────────────────
  # 与 /menus/tree 同一棵树（含目录/菜单/按钮三类节点），差别只在入口权限：授权人要 group-priv-edit，
  # 菜单管理员要 menu-manage——两者的职责不重叠，共用一个入口会让「能授权」被迫等于「能改菜单」。
  /menus/grantable:
    get:
      operationId: listGrantableMenus
      summary: 可授权菜单树（角色权限勾选页的数据源；含按钮节点，不按权限过滤）
      tags: [platform]
      responses:
        '200':
          description: 完整菜单树（含停用与按钮节点）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuTree'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 role-priv-edit（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ───────────────────────── platform · 前端路由表（T26 动态路由 / T03 纯 DB） ─────────────────────────
  # 路由的**层级与路径**来自菜单数据（T03 起 = menu 表），组件实现只能来自代码：前端按下发的
  # component 名从生成的组件表取 lazy 组件挂到 path 上。故此端点返回全部页面（含隐藏页与停用页），
  # 不按权限过滤——权限管「进不进得去」（页面内 403 / 后端真鉴权），与「有没有这条路由」是两件事。
  # 并集口径（T03）：DB 菜单行 ∪ 页面注册表里尚无 DB 行的隐藏页（兜底：注册表新增页面不至于漏路由）。
  /menus/routes:
    get:
      operationId: listMenuRoutes
      summary: 前端路由表（全部页面的 path/component/perm/activeMenu）
      description: 登录即可访问（它就是「本系统有哪些页面」）。前端建立会话后取它建路由，取不到回落代码生成的静态路由表。
      tags: [platform]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 路由表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteTable'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ───────────────────────── platform · 页面注册表（T03：代码侧「有哪些页面」的只读清单） ─────────────────────────
  # 菜单表单按 path 自动匹配 component 的数据源；也是「新页面怎么进系统」的登记处（ADR-001 §影响）。
  /menus/page-registry:
    get:
      operationId: listMenuPageRegistry
      summary: 页面注册表（页面 path → component/title/perm，含隐藏页）
      description: >-
        数据源是 tools/route-codegen.mjs 生成的 navigation.json（页面注解的产物，与前端 routes.tsx 同源同批）。
        管理员按 path 建菜单项时用它自动匹配组件；组件本身不能手选（代码所有）。
      tags: [platform]
      responses:
        '200':
          description: 页面注册表条目（按注册表顺序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRegistry'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 menu-manage（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /menus/my:
    get:
      operationId: listMyMenus
      summary: 当前用户可见菜单树（侧栏数据源；按权限码 + 状态过滤）
      description: >-
        登录即可访问（不给权限码——它就是「我的菜单」）。过滤规则：`status=disabled` 的项及其
        DB 行不下发；`perm` 不在当前账号权限码集合内的项不下发；因此变空的组/分区也不下发。
        内置基线在没有 DB 覆盖时原样返回，故本端点失败时前端回落静态 `navigation` 等价。
      tags: [platform]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前用户可见的菜单树
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuTree'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ───────────────────────── platform · 列设置（个人级，服务端持久化） ─────────────────────────
  /column-prefs/{resource}:
    get:
      operationId: getColumnPref
      summary: 列设置读取（个人级：只读当前账号自己的行；未设置 → columns 为 null，前端用页面默认）
      tags: [platform]
      parameters:
        - $ref: '#/components/parameters/ColumnPrefResource'
      responses:
        '200':
          description: 该账号在该资源的列设置（未设置为 null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnPrefView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: resource 不合规（42201，fields.resource）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: saveColumnPref
      summary: 整表保存列设置（个人级：只写当前账号自己的行；同账号同资源幂等覆盖）
      tags: [platform]
      parameters:
        - $ref: '#/components/parameters/ColumnPrefResource'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnPrefUpdateRequest'
      responses:
        '200':
          description: 保存后的列设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnPrefView'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 列项非法（42201，fields.columns；key 空/重复/超长、fixed 枚举外值）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: resetColumnPref
      summary: 重置列设置（删除当前账号在该资源的行 = 回页面默认）
      tags: [platform]
      parameters:
        - $ref: '#/components/parameters/ColumnPrefResource'
      responses:
        '200':
          description: 已重置，data 为 null
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: resource 不合规（42201，fields.resource）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /lang-items/overrides:
    get:
      operationId: listLangOverrides
      summary: 文案覆盖层全量（按语言；前端运行时合并的数据源）
      tags: [platform]
      parameters:
        - name: lang
          in: query
          description: 文案语言码，缺省 zh-cn
          schema: { type: string }
      responses:
        '200':
          description: 该语言的全部覆盖行（不分页，无 domain/section 过滤）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LangOverrideList'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lang-items/export:
    get:
      operationId: exportLangItems
      summary: 导出语言包 Excel（全量键 + 当前生效文案，lang-manage）
      tags: [platform]
      responses:
        '200':
          description: >-
            xlsx 二进制流（Content-Disposition: attachment; filename=lang-zh-CN.xlsx）；
            单工作表单页，表头 `key | zh-cn | en`，一行一个目录键，值 = 覆盖值（无覆盖则内建默认），
            导出的文件即导入格式，可原样回传；模板列宽 key=50 / 语言列=80 且冻结首行
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /lang-imports:
    post:
      operationId: createLangImport
      summary: 上传语言包 Excel（单文件全语言：格式校验 + 落覆盖 + 记操作，lang-manage）
      tags: [platform]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    .xlsx/.xls 文件（≤5MB、解压后 ≤64MB、≤5000 数据行）；首行表头须**精确**为 `key | zh-cn | en`
                    （列名与顺序一致，列头即语言）；不接受公式单元格。一份文件包揽全部语言
      responses:
        '200':
          description: >-
            成功落库并记一条 status=success 的上传记录（全部行通过校验才写入，校验期间不写覆盖层；
            记录 lang 恒 all——单文件全语言）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LangImportView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: >-
            格式校验失败（42201）：`fields` 为 `row:<Excel 行号>` → 原因码（文件级错误用键 `file`，
            码含 invalid-extension/too-large/unreadable/invalid-header/empty-file/too-many-rows；
            `too-large` 同时覆盖「超 5MB」与「解压后超 64MB」），
            至多 20 条；失败同样写一条 status=failed 的上传记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listLangImports
      summary: 语言包上传记录（平台卡 §3.12；谁在什么时候上传了什么）
      tags: [platform]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序（缺省 -createdAt）
          schema: { type: string, default: '-createdAt' }
        - name: filters[lang]
          in: query
          description: 上传语言（等值；新记录恒 all，历史行仍为 zh-cn/en）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[status]
          in: query
          description: 上传结果（等值）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string, enum: [success, failed] }
        - name: q
          in: query
          description: 关键词（文件名包含匹配）
          schema: { type: string }
      responses:
        '200':
          description: 上传记录列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LangImportList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────── platform · 审计日志 ─────────────────────────
  /audit-logs:
    get:
      operationId: listAuditLogs
      summary: 操作日志列表（谁在什么时候做了什么；只读，行由写端点的审计横切落库）
      description: >-
        audit_log 流水只读视图（B1 §H3；T04 审计 2.0）：登录与每次写请求各一行（成功 result=success、
        失败 result=fail + reason），按 created_at 倒序（缺省 -createdAt）。分类 category 见 ADR-004 的 9 类，
        动作到分类的映射由后端 AuditCatalog 声明；query 类不进本表（聚合在 /audit-logs/query-stats）。
        支持 filters[account]/filters[action]/filters[objectType]/filters[objectId]/filters[category]/
        filters[result]/filters[batchId]（等值或逗号 IN）与 filters[createdAt] 时间区间，以及 q 关键词
        （LIKE account/action）。无写端点：行由 AuditRecorder 追加。
      tags: [platform]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序，白名单 id/createdAt（缺省 -createdAt）
          schema: { type: string, default: '-createdAt' }
        - name: filters[account]
          in: query
          description: 操作人账号（等值 / 逗号 IN）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[action]
          in: query
          description: 动作名（等值 / 逗号 IN；如 login、login-failed、account-create、patch /api/v1/products/{productId}）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[objectType]
          in: query
          description: 对象类型（等值 / 逗号 IN；如 account、product）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[objectId]
          in: query
          description: 对象 id（等值 / 逗号 IN）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[category]
          in: query
          description: 操作分类（等值 / 逗号 IN；auth/perm/config/business/batch/export/sensitive/query/approve）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[result]
          in: query
          description: 结果（等值 / 逗号 IN；success/fail/denied）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[batchId]
          in: query
          description: 批次 id（等值 / 逗号 IN；批量操作同批记录共享，T22 起写入）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[createdAt]
          in: query
          description: 时间区间 a..b（含当日；开区间 a.. 或 ..b）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: q
          in: query
          description: LIKE account/action
          schema: { type: string }
      responses:
        '200':
          description: 审计日志分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '400':
          description: 未注册过滤/排序字段（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 audit-log-view（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /audit-logs/{auditId}:
    get:
      operationId: getAuditLog
      summary: 审计日志详情（单行全字段，含 changes/snapshot/extra）
      description: >-
        按 id 取单行（T04）。changes 是结构化的字段级 diff（敏感字段值掩码为 ***），snapshot 是审批/发布类
        的完整前后快照，extra 是动作自定义补充；三者只在详情返回，列表不带（体积）。不存在 → 40401。
      tags: [platform]
      parameters:
        - name: auditId
          in: path
          required: true
          description: 审计行 id
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 审计日志行详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogDetail'
        '400':
          description: id 非正整数（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 audit-log-view（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 审计行不存在（40401）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /audit-logs/verify:
    get:
      operationId: verifyAuditLogs
      summary: 审计哈希链校验（逐行重算，返回首处断链 id）
      description: >-
        T04 防篡改工具（ADR-004 决策 4）：按 id 升序逐行重算 hash=sha256(prev_hash + 规范序列化)，
        与行内 hash 比对，返回首处不一致的行 id。V43 之前的历史行无 hash（unhashedPrefix 计数，
        不参与校验）；保留策略清理过的前缀不存在（checkedFrom 之后的链自洽即有效）。
        maxRows 是单次扫描上限（默认 10000，上限 50000），超限 scanLimitReached=true，供多次续扫。
      tags: [platform]
      parameters:
        - name: fromId
          in: query
          description: 起始行 id（含；缺省 = 现存最早一行）
          schema: { type: integer, format: int64, minimum: 1 }
        - name: toId
          in: query
          description: 结束行 id（含；缺省 = 最新一行）
          schema: { type: integer, format: int64, minimum: 1 }
        - name: maxRows
          in: query
          description: 单次扫描行数上限，默认 10000、上限 50000，超限 40001 不钳制
          schema: { type: integer, minimum: 1, maximum: 50000, default: 10000 }
      responses:
        '200':
          description: 校验结果（valid=false 时 brokenId 是首处断链行）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResult'
        '400':
          description: 参数非法或 maxRows 超限（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 audit-log-view（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /audit-logs/query-stats:
    get:
      operationId: listAuditQueryStats
      summary: 查询聚合统计（普通查询/列表按 账号+模块+天 采样聚合）
      description: >-
        T04（ADR-004 决策 3）：query 类操作不进 audit_log 主表，按 account+resource+day 聚合到
        audit_query_stat（count 次数 / totalMs 累计耗时），由 QueryStatFilter 异步刷写。
        采样率 setting `audit.query-sample-rate`（默认 100）。
      tags: [platform]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序，白名单 id/day/count（缺省 -day）
          schema: { type: string, default: '-day' }
        - name: filters[account]
          in: query
          description: 账号（等值 / 逗号 IN）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[resource]
          in: query
          description: 资源（请求路径首段，等值 / 逗号 IN；如 products、stories）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[day]
          in: query
          description: 日期区间 a..b（含当日；开区间 a.. 或 ..b）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: q
          in: query
          description: LIKE account/resource
          schema: { type: string }
      responses:
        '200':
          description: 查询聚合分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditQueryStatList'
        '400':
          description: 未注册过滤/排序字段或区间非法（40001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 未登录或会话过期（40101）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 无 audit-log-view（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ───────────────────────── platform · 在线用户（T13 P1-1） ─────────────────────────
  /online-users:
    get:
      operationId: listOnlineUsers
      summary: 在线用户列表（session 表现存行即在线集；id 是 token 摘要，cookie 凭据不出网）
      description: >-
        每行 = 一个在线会话（登出与过期都物理删行，见 SessionResolver/LogoutHandler），按 last_seen_at
        倒序（缺省 -lastSeenAt）；current 标出请求者自己那条。支持 filters[account]（等值或逗号 IN）
        与 sort 白名单。强退见 DELETE /online-users/{sessionId}。
      tags: [platform]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序，白名单 account/createdAt/lastSeenAt/expiresAt（缺省 -lastSeenAt）
          schema: { type: string, default: '-lastSeenAt' }
        - name: filters[account]
          in: query
          description: 账号（等值 / 逗号 IN）；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
      responses:
        '200':
          description: 在线会话分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineUserList'
        '400':
