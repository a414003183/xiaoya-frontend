      required: [id, docId, version, title, digest, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        docId: { type: integer, format: int64, description: "文档 id" }
        version: { type: integer, minimum: 0, description: "版本" }
        title: { type: string, maxLength: 255, description: "文档标题（版本快照）" }
        content:
          type: [string, 'null']
