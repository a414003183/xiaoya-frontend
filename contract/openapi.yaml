      tags: [project]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序，白名单 id/name/status/priority/beginDate/endDate/createdAt/sort
          schema: { type: string }
        - name: filters[type]
          in: query
          schema: { type: string }
        - name: filters[status]
          in: query
          schema: { type: string }
        - name: filters[model]
          in: query
          schema: { type: string }
        - name: filters[priority]
          in: query
          schema: { type: string }
        - name: filters[acl]
          in: query
          schema: { type: string }
        - name: filters[pm]
          in: query
          schema: { type: string }
        - name: filters[parentId]
          in: query
          schema: { type: string }
        - name: filters[beginDate]
          in: query
          description: 闭区间 DSL：2026-01-01..2026-02-01（03 §3）
          schema: { type: string }
        - name: filters[endDate]
          in: query
          description: 闭区间 DSL：2026-01-01..2026-02-01（03 §3）
          schema: { type: string }
        - name: filters[createdBy]
          in: query
          schema: { type: string }
        - name: filters[createdAt]
          in: query
          schema: { type: string }
        - name: filters[id]
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: LIKE name/code
          schema: { type: string }
      responses:
        '200':
          description: 项目集分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createProgram
      summary: 创建项目集（type=program；parentId 缺省 0=顶级）
      tags: [project]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreateRequest' }
      responses:
        '200':
