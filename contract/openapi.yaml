    # ── project · 干系人（project 卡 §3.8） ──
    StakeholderView:
      type: object
      description: 干系人（(objectType, objectId, account) 唯一；旧保留字 user/key/from 规避）
      required: [id, objectType, objectId, account, type, isKey]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        objectType: { type: string, enum: [program, project], description: "绑定对象类型" }
        objectId: { type: integer, format: int64, description: "绑定对象 id" }
        account: { type: string, description: "登录账号" }
        type: { type: string, enum: [inside, outside], description: "类型" }
        isKey: { type: boolean, description: 关键干系人 }
        source:
          type: [string, 'null']
          maxLength: 30
          description: 来源
        createdBy: { type: string, description: "创建人（登录账号）" }
        createdAt: { type: string, format: date-time, description: "创建时间" }
        updatedBy:
          type: [string, 'null']
          description: 更新人（登录账号）
        updatedAt:
          type: [string, 'null']
          description: 更新时间
          format: date-time
    StakeholderCreateRequest:
      type: object
      description: 添加干系人（objectType/objectId 由端点定；同对象重复 account → 42201）
      required: [account, type]
      properties:
        account: { type: string, description: "登录账号" }
        type: { type: string, enum: [inside, outside], description: "类型" }
        isKey:
          type: [boolean, 'null']
          description: 缺省 false
        source:
          type: [string, 'null']
          description: 来源备注（自由文本，≤30 字）
          maxLength: 30
    StakeholderList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/StakeholderView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }

    # ── project · 关联 / 白名单请求体（同构收敛，§5） ──
    WhitelistRequest:
      type: object
      description: 白名单全量替换/读取的同一形状（acl_entry diff 单源；账号不存在 → 42201）
      required: [accounts]
      properties:
        accounts:
          type: array
          description: 账号白名单（登录名集合）
          items: { type: string }
    StoryLinkRequest:
      type: object
      description: 项目/执行关联需求请求体（project_story，幂等：重复关联不增行）
      required: [storyIds]
      properties:
        storyIds:
          type: array
          description: 关联需求 id 集合
          items: { type: integer, format: int64 }
    ProjectProductRequest:
      type: object
      description: 项目关联产品全量替换（POST /projects/{projectId}/products 的请求体与 200 响应同形，diff 落 project_product）
      required: [productIds]
      properties:
        productIds:
          type: array
          description: 关联产品 id 集合
          items: { type: integer, format: int64 }

    # ── project · 执行需求看板（project 卡 §5 kanban 族） ──
    ExecutionKanbanView:
      type: object
      description: 执行需求看板（关联需求按 story.status 分列；K 范式数据源）
      required: [lanes]
      properties:
        lanes:
          type: array
          description: 泳道列表
          items: { $ref: '#/components/schemas/ExecutionKanbanLane' }
    ExecutionKanbanLane:
      type: object
      required: [key, items]
      properties:
        key:
          type: string
          enum: [draft, reviewing, active, changing, changed, closed]
          description: 列 key = story.status（draft|reviewing|active|changing|changed|closed；2026-09-19 修正——原误写 story.stage）
        items:
          type: array
          description: 列内卡片（StoryView 列表）
          items: { $ref: '#/components/schemas/StoryView' }
    ExecutionKanbanMoveRequest:
      type: object
      description: 需求看板拖拽请求体（cardId=storyId；column=目标列 key，委托 story 状态动作，非法迁移 → 42202）
      required: [column]
      properties:
        column:
          type: string
          description: 目标列 key = ExecutionKanbanLane.key
        comment:
          type: [string, 'null']
          description: 备注（可省，记入动态流）

  # ═════════════════════ task · P3 新增 schema（task 卡 §3/§3b）═════════════════════
    # ── task · 任务（task 卡 §3） ──
    TaskChildSummary:
      type: object
      description: 子任务摘要（父任务详情的 children 数组元素，task 卡 §3）
      required: [id, title, status]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        title: { type: string, maxLength: 255, description: "子任务标题" }
        status: { type: string, enum: [wait, doing, done, pause, cancel, closed], description: "状态" }
        assignee:
          type: [string, 'null']
          description: 处理人（登录账号，空=未指派）
    TaskView:
      type: object
      description: 任务视图（task 卡 §3 读侧；children/storyTitle 为联表只读字段，不接受写入）
      required: [id, executionId, projectId, storyId, parentId, categoryId, title, type, priority, status, consumedHours, isParent, notifyAccounts, createdBy, createdAt, lockVersion]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        executionId:
          type: integer
          format: int64
          description: 所属执行，创建后不可改
        projectId:
          type: integer
          format: int64
          description: 冗余列，创建时由执行带出，不可改
        storyId:
          type: integer
          format: int64
          description: 关联需求；0=无（filterable）
        parentId:
          type: integer
          format: int64
          description: 父任务；0=顶层（filterable；父子仅一层）
        categoryId:
          type: integer
          format: int64
          description: 执行下 type=task 的分类节点；0=无（filterable）
        title: { type: string, maxLength: 255, description: "任务标题" }
        type: { type: string, enum: [design, devel, request, test, study, discuss, ui, affair, misc], description: "类型" }
        priority: { type: integer, minimum: 1, maximum: 4, description: "优先级" }
        status: { type: string, enum: [wait, doing, done, pause, cancel, closed], description: "状态" }
        estimateHours:
          type: [number, 'null']
          description: 预计工时（≥0，≤999.99）
        consumedHours:
          type: number
          description: 已消耗（≥0；只读，由动作/工时回写，不开放直改）
        leftHours:
          type: [number, 'null']
          description: 剩余工时（≥0，≤999.99；start 初始化、effort 覆写）
        estStartedDate:
          type: [string, 'null']
          description: 预计开始日期
          format: date
        deadline:
          type: [string, 'null']
          description: 截止时间
          format: date
        assignee:
          type: [string, 'null']
          description: 处理人（登录账号，空=未指派）
        assignedAt:
          type: [string, 'null']
          description: 指派时间
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
          description: start/finish 回写
        activatedAt:
          type: [string, 'null']
          description: 激活时间
          format: date-time
        finishedBy:
          type: [string, 'null']
          description: 完成人（登录账号）
        finishedAt:
          type: [string, 'null']
          description: 完成时间
          format: date-time
        canceledBy:
          type: [string, 'null']
          description: 取消人（登录账号）
        canceledAt:
          type: [string, 'null']
          description: 取消时间
          format: date-time
        closedBy:
          type: [string, 'null']
          description: 关闭人（登录账号）
        closedAt:
          type: [string, 'null']
          description: 关闭时间
          format: date-time
        closedReason:
          type: [string, 'null']
          description: 关闭原因
          enum: [done, cancel, null]
        keywords:
          type: [string, 'null']
          description: 关键词
          maxLength: 255
        description:
          type: [string, 'null']
          description: 描述
        isParent:
          type: boolean
          description: 有未删子任务即 true（系统维护，不开放写）
        notifyAccounts:
          type: array
          description: 通知人（登录账号集合）
          items: { type: string }
        customFields:
          type: object
          description: 自定义字段（动态字段表）
          additionalProperties: true
        createdBy: { type: string, description: "创建人（登录账号）" }
        createdAt: { type: string, format: date-time, description: "创建时间" }
        updatedBy:
          type: [string, 'null']
          description: 更新人（登录账号）
        updatedAt:
          type: [string, 'null']
          description: 更新时间
          format: date-time
        lockVersion:
          type: integer
          description: 写路径 If-Match 语义（动作端点不校验）
        children:
          type: [array, 'null']
          description: 子任务摘要数组（仅详情响应出现；列表为 null）
          items: { $ref: '#/components/schemas/TaskChildSummary' }
        storyTitle:
          type: [string, 'null']
          description: 关联需求标题（仅响应出现，storyId≠0 时；不接受写入）
    TaskCreateRequest:
      type: object
      description: 创建任务（task 卡 §3；executionId 取自路径、projectId 由执行带出，均不在请求体；创建时 status 恒 wait、consumedHours 恒 0，leftHours start 时初始化）
      required: [title]
      properties:
        storyId:
          type: [integer, 'null']
          format: int64
          description: 该执行已关联的需求（0=无）
        parentId:
          type: [integer, 'null']
          format: int64
          description: 同执行任务（带值即创建子任务；0/缺省=顶层）
        parentIndex:
          type: [integer, 'null']
          description: 仅批量创建（items 内下标，0 起）：引用同行父行；父行失败则本行连带 error
        categoryId:
          type: [integer, 'null']
          format: int64
          description: 执行下 type=task 的分类节点（0=无）
        title: { type: string, maxLength: 255, description: "任务标题" }
        type:
          type: [string, 'null']
          description: 缺省 devel
          enum: [design, devel, request, test, study, discuss, ui, affair, misc, null]
        priority:
          type: [integer, 'null']
          description: 优先级（1–4），缺省 3
        estimateHours:
          type: [number, 'null']
          description: 预估工时（≥0，≤999.99）
        estStartedDate:
          type: [string, 'null']
          description: 预计开始日期
          format: date
        deadline:
          type: [string, 'null']
          description: 截止时间
          format: date
        assignee:
          type: [string, 'null']
          description: 指派账号（存在账号）
        keywords:
          type: [string, 'null']
          description: 关键词
          maxLength: 255
        description:
          type: [string, 'null']
          description: 描述
        notifyAccounts:
          type: [array, 'null']
          description: 通知人（登录账号集合）
          items: { type: string }
    TaskUpdateRequest:
      type: object
      description: 部分更新任务（PATCH 白名单；键缺失=不修改；storyId/categoryId 传 0 清空；estStartedDate/deadline/keywords/description 传空串或显式 null 清空；estimateHours 传 0 清零）
      required: [lockVersion]
      properties:
        title:
          type: [string, 'null']
          description: 任务标题
          maxLength: 255
        type:
          type: [string, 'null']
          description: 类型
          enum: [design, devel, request, test, study, discuss, ui, affair, misc, null]
        priority:
          type: [integer, 'null']
          description: 优先级（1–4）
        categoryId:
          type: [integer, 'null']
          description: 分类 id
          format: int64
        storyId:
          type: [integer, 'null']
          description: 需求 id
          format: int64
        estimateHours:
          type: [number, 'null']
          description: 预估工时（≥0，≤999.99）；传 0 清零
        estStartedDate:
          type: [string, 'null']
          description: 预计开始日期
          format: date
        deadline:
          type: [string, 'null']
          description: 截止时间
          format: date
        keywords:
          type: [string, 'null']
          description: 关键词
          maxLength: 255
        description:
          type: [string, 'null']
          description: 描述
        notifyAccounts:
          type: [array, 'null']
          description: 通知人（登录账号集合）
          items: { type: string }
        lockVersion:
          type: integer
          description: 乐观锁版本（不符 → 40901）
    TaskList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/TaskView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }

    # ── task · 动作请求体（task 卡 §4/§5） ──
    TaskStartRequest:
      type: object
      description: 开始任务（均可省；consumedHours>0 时同步落一条 effort）
      required: []
      properties:
        assignee:
          type: [string, 'null']
          description: 传入即改派
        consumedHours:
          type: [number, 'null']
          description: 本次消耗（>0 落 effort）
        leftHours:
          type: [number, 'null']
          description: 缺省初始化为 estimateHours−consumedHours
        comment:
          type: [string, 'null']
          description: 备注（可省，记入动态流）
    TaskFinishRequest:
      type: object
      description: 完成任务（本次消耗按增量累计；consumedHours>0 自动落一条 effort，work 缺省取 comment）
      required: []
      properties:
        consumedHours:
          type: [number, 'null']
          description: 本次消耗（>0 落 effort；与累计均为 0 → 42203）
        leftHours:
          type: [number, 'null']
          description: 缺省清零
        startedAt:
          type: [string, 'null']
          format: date-time
          description: 须 ≤ finishedAt（违反 → 42201）
        finishedAt:
          type: [string, 'null']
          description: 完成时间
          format: date-time
        work:
          type: [string, 'null']
          description: 自动落 effort 的内容
        comment:
          type: [string, 'null']
          description: 备注（可省，记入动态流）
    TaskCloseRequest:
      type: object
      description: 关闭任务（done/cancel 来源缺省回填 closedReason；父任务从任意非 closed 关闭时 closedReason 必填）
      required: []
      properties:
        closedReason:
          type: [string, 'null']
          description: 关闭原因
          enum: [done, cancel, null]
        comment:
          type: [string, 'null']
          description: 备注（可省，记入动态流）
    TaskActivateRequest:
      type: object
      description: 激活任务（leftHours 必填且 >0，缺失/≤0 → 42201；可改派 assignee）
      required: [leftHours]
      properties:
        leftHours:
          type: number
          description: 必填且 >0
        assignee:
          type: [string, 'null']
          description: 传入即改派
        comment:
          type: [string, 'null']
          description: 备注（可省，记入动态流）
    TaskAssignRequest:
      type: object
      description: 指派任务（assignee 必填且为存在账号，否则 42201；可覆写 leftHours）
      required: [assignee]
      properties:
        assignee:
          type: string
          description: 目标账号（存在校验）
        leftHours:
          type: [number, 'null']
          description: 传入则覆写任务剩余
        comment:
          type: [string, 'null']
          description: 备注（可省，记入动态流）

    # ── task · 批量（task 卡 §3/§5） ──
    TaskBatchCreateRequest:
      type: object
      description: 批量创建任务（≤50 条，逐条校验部分成功；子任务用 parentIndex 引用 items 中同行父行——0 起下标、父行失败则子行连带 error，或用 parentId 引用已存在任务）
      required: [items]
      properties:
        items:
          type: array
          description: ≤50 条；子任务随父一并提交
          maxItems: 50
          items: { $ref: '#/components/schemas/TaskCreateRequest' }
    TaskBatchCreateResult:
      type: object
      description: 批量创建逐项结果
      required: [results]
      properties:
        results:
          type: array
          description: 逐项结果
          items: { $ref: '#/components/schemas/BatchCreateResultItem' }

    # ── task · 工时（task 卡 §3b） ──
    EffortView:
      type: object
      description: 工时流水视图（task 卡 §3b；account 恒等于 createdBy，工时不设 lockVersion，流水按 id 定位）
      required: [id, taskId, executionId, projectId, account, workDate, consumedHours, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        taskId:
          type: integer
          format: int64
          description: 强关联任务（仅挂任务）
        executionId:
          type: integer
          format: int64
          description: 冗余列，创建时由任务带出
        projectId:
          type: integer
          format: int64
          description: 冗余列，创建时由任务带出
        account:
          type: string
          description: 登记账号（恒为当前账号/createdBy，不接受传入）
        workDate:
          type: string
          format: date
          description: 登记粒度=天，≤今天
        consumedHours:
          type: number
          description: 本次消耗（>0，≤999.99），增量累计进任务
        leftHours:
          type: [number, 'null']
          description: 覆写任务剩余；null=不覆写
        work:
          type: [string, 'null']
          description: 工时说明
          maxLength: 255
        createdBy: { type: string, description: "创建人（登录账号）" }
        createdAt: { type: string, format: date-time, description: "创建时间" }
        updatedBy:
          type: [string, 'null']
          description: 更新人（登录账号）
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: 软删标记
    EffortCreateRequest:
      type: object
      description: 登记工时（account 恒当前账号，不接受代登记；executionId/projectId 由任务带出）
      required: [consumedHours]
      properties:
        workDate:
          type: [string, 'null']
          format: date
          description: ≤今天；缺省取当天
        consumedHours:
          type: number
          exclusiveMinimum: 0
          maximum: 999.99
          description: 本次消耗，>0
        leftHours:
          type: [number, 'null']
          minimum: 0
          maximum: 999.99
          description: 传值则覆写任务剩余；null/缺省不改动；传 0 触发任务自动完成
        work:
          type: [string, 'null']
          description: 工时说明
          maxLength: 255
    EffortUpdateRequest:
      type: object
      description: 编辑工时（仅 workDate/consumedHours/leftHours/work 可改；taskId/account 不可改；回算任务 consumedHours 与 leftHours，状态不回退）
      required: []
      properties:
        workDate:
          type: [string, 'null']
          format: date
          description: ≤今天
        consumedHours:
          type: [number, 'null']
          description: 已消耗工时
          exclusiveMinimum: 0
          maximum: 999.99
        leftHours:
          type: [number, 'null']
          description: 剩余工时
          minimum: 0
          maximum: 999.99
        work:
          type: [string, 'null']
          description: 工时说明
          maxLength: 255
    EffortList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/EffortView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }

