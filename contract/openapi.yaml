  # ───────────────────────── workspace · 待办（workspace 卡 §5 /todos 族） ─────────────────────────
  /todos:
    get:
      operationId: listTodos
      summary: 我的待办列表（强制归属：assignee/finishedBy/closedBy = @me；DataScope 见 §7）
      tags: [workspace]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          description: 排序，白名单 id/date/priority/beginTime/createdAt
          schema: { type: string }
        - name: filters[status]
          in: query
          description: wait|doing|done|closed；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[type]
          in: query
          description: custom|bug|task|story|epic|requirement|testRun；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[priority]
          in: query
          description: 1|2|3|4；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[date]
          in: query
          description: 日期或区间；@null 取待定日期；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[assignee]
          in: query
          description: 账号 / @me / @null；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[createdBy]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: filters[isPrivate]
          in: query
          description: 1/0；多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制
          schema: { type: string }
        - name: filters[id]
          in: query
          description: 过滤（多值逗号分隔，单个 IN ≤200 值，超限 40001 不钳制）
          schema: { type: string }
        - name: q
          in: query
          description: LIKE title
          schema: { type: string }
      responses:
        '200':
          description: 待办分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
