          description: 附件文件 id 集合
          items: { type: integer, format: int64 }
        createdBy: { type: string, description: "创建人（登录账号）" }
        createdAt: { type: string, format: date-time, description: "创建时间" }
        updatedBy:
          type: [string, 'null']
          description: 更新人（登录账号）
        updatedAt:
          type: [string, 'null']
          description: 更新时间
          format: date-time
    DocVersionList:
      type: object
      description: 版本列表（v≥1 快照，固定 version desc，不分页）
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/DocVersionView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }
    DocCategoryView:
      type: object
      description: 库内目录节点（doc 卡 §2 doc_category；真实删除）
      required: [id, docSpaceId, parentId, name, sort]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        docSpaceId: { type: integer, format: int64, description: "文档库 id" }
        parentId: { type: integer, format: int64, description: "父节点 id（0 或空=顶级）" }
        name: { type: string, maxLength: 60, description: "目录名称" }
        sort: { type: integer, description: "排序值（升序，越小越前）" }
    DocCategoryNode:
      type: object
      description: 目录树节点（嵌套 children）
      required: [id, docSpaceId, parentId, name, sort, children]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        docSpaceId: { type: integer, format: int64, description: "文档库 id" }
        parentId: { type: integer, format: int64, description: "父节点 id（0 或空=顶级）" }
        name: { type: string, maxLength: 60, description: "目录名称" }
        sort: { type: integer, description: "排序值（升序，越小越前）" }
        children:
          type: array
          description: 子节点
          items: { $ref: '#/components/schemas/DocCategoryNode' }
    DocCategoryTree:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 目录节点列表（嵌套树）
          items: { $ref: '#/components/schemas/DocCategoryNode' }
    DocCategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60, description: "目录名称" }
        parentId:
          type: [integer, 'null']
          description: 父节点 id（0 或空=顶级）
          format: int64
        sort:
          type: [integer, 'null']
          description: 排序值（升序，越小越前）
    DocCategoryUpdateRequest:
      type: object
      description: 目录改名/移动/排序（null = 不修改）
      required: []
      properties:
        name:
          type: [string, 'null']
          description: 目录名称
          maxLength: 60
        parentId:
          type: [integer, 'null']
          description: 父节点 id（0 或空=顶级）
          format: int64
        sort:
          type: [integer, 'null']
          description: 排序值（升序，越小越前）

    # ── workspace · 待办（workspace 卡 §3.1） ──
    TodoView:
      type: object
      description: 待办视图（workspace 卡 §3.1 + 现算 objectTitle；旧库 name 列 → title）
      required: [id, title, type, objectId, date, priority, status, isPrivate, assignee, createdBy, createdAt,
        lockVersion]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        title: { type: string, maxLength: 150, description: "待办标题" }
        type:
          type: string
          description: 类型
          enum: [custom, bug, task, story, epic, requirement, testRun]
        objectId: { type: integer, format: int64, description: "绑定对象 id" }
        objectTitle:
          type: [string, 'null']
          description: 现算只读：type≠custom 时关联对象标题，对象已删 → null（不回写 title）
        date:
          type: [string, 'null']
          format: date
          description: 待定日期为 null
        beginTime:
          type: [string, 'null']
          description: HH:mm（DB char(4) 存 HHmm）
        endTime:
          type: [string, 'null']
          description: 结束时间
        priority: { type: integer, description: "优先级" }
        description:
          type: [string, 'null']
          description: 描述
        status:
          type: string
          description: 状态
          enum: [wait, doing, done, closed]
        isPrivate: { type: boolean, description: "是否私密" }
        assignee: { type: string, description: "处理人（登录账号，空=未指派）" }
        assignedBy:
          type: [string, 'null']
          description: 指派人（登录账号）
        assignedAt:
          type: [string, 'null']
          description: 指派时间
          format: date-time
        finishedBy:
          type: [string, 'null']
          description: 完成人（登录账号）
        finishedAt:
          type: [string, 'null']
          description: 完成时间
          format: date-time
        closedBy:
          type: [string, 'null']
          description: 关闭人（登录账号）
        closedAt:
          type: [string, 'null']
          description: 关闭时间
          format: date-time
        createdBy: { type: string, description: "创建人（登录账号）" }
        createdAt: { type: string, format: date-time, description: "创建时间" }
        updatedBy:
          type: [string, 'null']
          description: 更新人（登录账号）
        updatedAt:
          type: [string, 'null']
          description: 更新时间
          format: date-time
        lockVersion: { type: integer, description: "乐观锁版本号（更新须回传，不符 → 40901）" }
    TodoCreateRequest:
      type: object
      description: 创建待办（assignee 缺省当前账号；type≠custom 时 objectId 必填）
      required: [title]
      properties:
        title: { type: string, maxLength: 150, description: "待办标题" }
        type:
          type: [string, 'null']
          description: 类型
          enum: [custom, bug, task, story, epic, requirement, testRun, null]
        objectId:
          type: [integer, 'null']
          description: 绑定对象 id
          format: int64
        date:
          type: [string, 'null']
          description: 日期（当日待办用）
          format: date
        beginTime:
          type: [string, 'null']
          description: 开始时间
          pattern: '^\d{2}:\d{2}$'
        endTime:
          type: [string, 'null']
          description: 结束时间
          pattern: '^\d{2}:\d{2}$'
        priority:
          type: [integer, 'null']
          description: 优先级
          minimum: 1
          maximum: 4
        description:
          type: [string, 'null']
          description: 描述
        isPrivate:
          type: [boolean, 'null']
          description: 是否私密
        assignee:
          type: [string, 'null']
          description: 处理人（登录账号，空=未指派）
    TodoUpdateRequest:
      type: object
      description: 部分更新待办（null = 不修改）
      required: [lockVersion]
      properties:
        title:
          type: [string, 'null']
          description: 待办标题
          maxLength: 150
        type:
          type: [string, 'null']
          description: 类型
          enum: [custom, bug, task, story, epic, requirement, testRun, null]
        objectId:
          type: [integer, 'null']
          description: 绑定对象 id
          format: int64
        date:
          type: [string, 'null']
          description: 日期（当日待办用）
          format: date
        beginTime:
          type: [string, 'null']
          description: 开始时间
          pattern: '^\d{2}:\d{2}$'
        endTime:
          type: [string, 'null']
          description: 结束时间
          pattern: '^\d{2}:\d{2}$'
        priority:
          type: [integer, 'null']
          description: 优先级
          minimum: 1
          maximum: 4
        description:
          type: [string, 'null']
          description: 描述
        isPrivate:
          type: [boolean, 'null']
          description: 是否私密
        lockVersion: { type: integer, description: "乐观锁版本号（更新须回传，不符 → 40901）" }
    TodoAssignRequest:
      type: object
      description: 指派待办（assignee 非本人，否则 42203）
      required: [assignee]
      properties:
        assignee: { type: string, description: "处理人（登录账号，空=未指派）" }
        comment:
          type: [string, 'null']
          description: 备注（可省，记入动态流）
    TodoBatchRequest:
      description: 批量创建（items ≤50）或批量动作（ids+action+params）；两种形态二选一（oneOf 收窄）
      oneOf:
        - $ref: '#/components/schemas/TodoBatchCreateRequest'
        - $ref: '#/components/schemas/TodoBatchActionRequest'
    TodoBatchCreateRequest:
      type: object
      description: 批量创建形态：只带 items（≤50，逐项部分成功，逐项成败互不影响）
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          description: 待创建项（≤50；空数组 → 42201 items.required）
          items: { $ref: '#/components/schemas/TodoCreateRequest' }
    TodoBatchActionRequest:
      type: object
      description: 批量动作形态：ids + action（assign 可带 params.assignee）；逐项套用本域守卫
      required: [ids, action]
      properties:
        ids:
          type: array
          maxItems: 50
          description: 目标待办 id（≤50；空数组 → 42201 ids.required）
          items: { type: integer, format: int64 }
        action:
          type: string
          description: 动作码（未知动作 → 40001）；assign 时 params.assignee 为目标处理人
          enum: [start, finish, activate, close, assign]
        params:
          type: [object, 'null']
          description: 动作参数（assign 需 assignee；其余动作缺省）
          additionalProperties: true
    TodoBatchResultItem:
      type: object
      required: [ok]
      properties:
        index:
          type: [integer, 'null']
          description: 批量创建项下标（动作项为 null）
        id:
          type: [integer, 'null']
          format: int64
          description: 批量动作项 id（创建项成功后为新建 id）
        ok: { type: boolean, description: "是否成功" }
        error:
          type: [string, 'null']
          description: 失败原因（code:message 形态）
    TodoBatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: 逐项结果
          items: { $ref: '#/components/schemas/TodoBatchResultItem' }
    TodoList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/TodoView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }

    # ── workspace · 我的地盘 / 周报 / 报表（workspace 卡 §3.2–§3.4、§5） ──
    MySummaryView:
      type: object
      description: 地盘首页计数（固定 role=assignee 口径）
      required: [todoCount, taskCount, bugCount, storyCount]
      properties:
        todoCount:
          type: integer
          description: 待办 status ∈ wait,doing
        taskCount:
          type: integer
          description: 任务 status ∉ done,closed,cancel
        bugCount:
          type: integer
          description: Bug 数（status=active）
        storyCount:
          type: integer
          description: 需求 status ∉ closed,draft
    TaskSummaryView:
      type: object
      description: 任务摘要行（task 卡 §5；周报三表用，经 TaskApi 只读取数）
      required: [id, title, status, priority, estimateHours, consumedHours, leftHours]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        title: { type: string, description: "标题" }
        status: { type: string, enum: [wait, doing, done, pause, cancel, closed], description: "状态" }
        priority: { type: integer, description: "优先级" }
        assignee:
          type: [string, 'null']
          description: 处理人（登录账号，空=未指派）
        estimateHours: { type: number, description: "预估工时" }
        consumedHours: { type: number, description: "已消耗工时" }
        leftHours: { type: number, description: "剩余工时" }
        beginDate:
          type: [string, 'null']
          description: 开始日期
          format: date
        endDate:
          type: [string, 'null']
          description: 结束日期
          format: date
    WeeklyReportView:
      type: object
      description: 周报视图（workspace 卡 §3.2；weekSN/weekEnd/analysis/三表为读取时现算）
      required: [id, projectId, weekStart, weekSN, weekEnd, pv, ev, ac, sv, cv, staff, workload, analysis,
        finished, postponed, nextWeek, updatedAt]
      properties:
        id: { type: integer, format: int64, description: "主键 id" }
        projectId: { type: integer, format: int64, description: "项目 id" }
        weekStart: { type: string, format: date, description: "周起始日" }
        weekSN:
          type: integer
          description: 第几周，由项目 beginDate 起算
        weekEnd: { type: string, format: date, description: "周结束日" }
        pv: { type: number, description: "计划价值 PV" }
        ev: { type: number, description: "挣值 EV" }
        ac: { type: number, description: "实际成本 AC（挣值口径）" }
        sv: { type: number, description: "进度偏差 SV（挣值口径）" }
        cv: { type: number, description: "成本偏差 CV（挣值口径）" }
        staff: { type: integer, description: "涉及人员数" }
        workload:
          type: object
          description: 本周按任务类型分组的预计工时 map
          additionalProperties: { type: number }
        analysis:
          type: string
          description: 按 sv/cv 阈值现算的纯文本结论，\n 分隔（前端禁 HTML 注入）
        finished:
          type: array
          description: 完成条数
          items: { $ref: '#/components/schemas/TaskSummaryView' }
        postponed:
          type: array
          description: 延期条数
          items: { $ref: '#/components/schemas/TaskSummaryView' }
        nextWeek:
          type: array
          description: 下周计划
          items: { $ref: '#/components/schemas/TaskSummaryView' }
        updatedAt: { type: string, format: date-time, description: "更新时间" }
    WeeklyReportList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/WeeklyReportView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }
    StoryCountByStatus:
      type: object
      required: [status, count]
      properties:
        status: { type: string, enum: [draft, reviewing, active, changing, changed, closed], description: "状态" }
        count: { type: integer, description: "条数" }
    StoryCountByPriority:
      type: object
      required: [priority, count]
      properties:
        priority: { type: integer, description: "优先级" }
        count: { type: integer, description: "条数" }
    StoryCountByStage:
      type: object
      required: [stage, count]
      properties:
        stage: { type: string, enum: [wait, developing, testing, released], description: "阶段" }
        count: { type: integer, description: "条数" }
    StoryCountByType:
      type: object
      required: [type, count]
      properties:
        type: { type: string, enum: [story, epic, requirement], description: "类型" }
        count: { type: integer, description: "条数" }
    StorySummaryReport:
      type: object
      description: 产品需求统计（排除 deletedAt 非空）
      required: [total, byStatus, byPriority, byStage, byType]
      properties:
        total: { type: integer, description: "总条数（满足筛选的全量）" }
        byStatus:
          type: array
          description: 按状态分布
          items: { $ref: '#/components/schemas/StoryCountByStatus' }
        byPriority:
          type: array
          description: 按优先级分布
          items: { $ref: '#/components/schemas/StoryCountByPriority' }
        byStage:
          type: array
          description: 按阶段分布
          items: { $ref: '#/components/schemas/StoryCountByStage' }
        byType:
          type: array
          description: 按类型分布
          items: { $ref: '#/components/schemas/StoryCountByType' }
    BugCountBySeverity:
      type: object
      required: [severity, count]
      properties:
        severity: { type: integer, description: "严重级别" }
        count: { type: integer, description: "条数" }
    BugCountByStatus:
      type: object
      required: [status, count]
      properties:
        status: { type: string, enum: [active, resolved, closed], description: "状态" }
        count: { type: integer, description: "条数" }
    BugCountByResolution:
      type: object
      required: [resolution, count]
      properties:
        resolution: { type: string, enum: [bydesign, duplicate, external, fixed, notrepro, postponed, unresolved, willnotfix, tostory], description: "解决结果" }
        count: { type: integer, description: "条数" }
    BugDistributionReport:
      type: object
      description: Bug 分布（resolution 为空计入 unresolved 桶）
      required: [total, bySeverity, byStatus, byResolution]
      properties:
        total: { type: integer, description: "总条数（满足筛选的全量）" }
        bySeverity:
          type: array
          description: 按严重级别分布
          items: { $ref: '#/components/schemas/BugCountBySeverity' }
        byStatus:
          type: array
          description: 按状态分布
          items: { $ref: '#/components/schemas/BugCountByStatus' }
        byResolution:
          type: array
          description: 按解决结果分布（空值计入 unresolved 桶）
          items: { $ref: '#/components/schemas/BugCountByResolution' }
    BurnReport:
      type: object
      description: 燃尽报表（ideal 直线 + remaining 执行级日行，缺失日沿用上值）
      required: [beginDate, endDate, dates, ideal, remaining]
      properties:
        beginDate: { type: string, format: date, description: "开始日期" }
        endDate: { type: string, format: date, description: "结束日期" }
        dates:
          type: array
          description: 日期序列（横轴）
          items: { type: string, format: date }
        ideal:
          type: array
          description: 理想剩余曲线
          items: { type: number }
        remaining:
          type: array
          description: 剩余工作量序列
          items: { type: number }
    CasePassRateReport:
      type: object
      description: 用例通过率（passRate 分母 total−na 为 0 时 null）
      required: [total, passed, failed, blocked, na, passRate]
      properties:
        total: { type: integer, description: "总条数（满足筛选的全量）" }
        passed: { type: integer, description: "通过条数" }
        failed: { type: integer, description: "失败条数" }
        blocked: { type: integer, description: "阻塞条数" }
        na: { type: integer, description: "不适用条数" }
        passRate:
          type: [number, 'null']
          description: 通过率（百分比）

    # ── org · 人员管理（org 卡 §5 Personnel 节） ──
    PersonnelMemberView:
      type: object
      description: 成员视图（无表只读聚合：账号列 + 跨域在办计数；停用/软删账号不出现）
      required: [account, realName, openTaskCount, unresolvedBugCount]
      properties:
        account: { type: string, description: "登录账号" }
        realName: { type: string, description: "姓名" }
        departmentId:
          type: [integer, 'null']
          description: 部门 id
          format: int64
        roleIds:
          type: array
          description: 所属角色 id 集合（GET /roles 的 id；前端按角色表解析名字）
          items: { type: integer, format: int64 }
        openTaskCount:
          type: integer
          description: 在办任务数（assignee 且 status ∉ done,closed,cancel）
        unresolvedBugCount:
          type: integer
          description: 未解决 Bug 数（status=active 且 assignee=本人）
    PersonnelMemberList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/PersonnelMemberView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }
    PersonnelWorkloadView:
      type: object
      description: 工作量行（effort.workDate ∈ filters[date] 区间按 assignee 聚合）
      required: [account, realName, consumedHours, finishedTaskCount]
      properties:
        account: { type: string, description: "登录账号" }
        realName: { type: string, description: "姓名" }
        departmentId:
          type: [integer, 'null']
          description: 部门 id
          format: int64
        consumedHours: { type: number, description: "已消耗工时" }
        finishedTaskCount:
          type: integer
          description: 区间内完成的任务数（finishedAt ∈ 区间）
    PersonnelWorkloadList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 列表项（当前页）
          items: { $ref: '#/components/schemas/PersonnelWorkloadView' }
        total: { type: integer, format: int64, description: "总条数（满足筛选的全量）" }
