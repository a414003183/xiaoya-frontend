        percent: { type: number, minimum: 0, maximum: 100 }
        type: { type: string, enum: [mix, request, design, dev, qa, release, review, other] }
        projectModel: { type: string, enum: [waterfall] }
        sort:
          type: [integer, 'null']
    StageUpdateRequest:
      type: object
