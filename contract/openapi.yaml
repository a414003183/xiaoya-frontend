        projectModel: { type: string, enum: [waterfall] }
        sort: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
    StageList:
