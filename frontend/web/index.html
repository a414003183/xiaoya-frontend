<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenTao</title>
    <!-- FE-06：初始 lang 随持久化语言（键与 @zentao/i18n 的 STORAGE_KEY 同源字面量；
         JS 禁用/异常时保底 html 属性的 zh-CN）。此后由 i18next languageChanged 联动。 -->
    <script>
      try {
        document.documentElement.lang = localStorage.getItem('zentao.language') === 'en' ? 'en' : 'zh-CN'
      } catch {
        /* 私有模式等取不到 localStorage：保持 html 属性值 */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
